<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#a0b0c0" flood-opacity="0.15" />
    </filter>
    
    <!-- Dynamic Arrow Markers -->
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b5b9e" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33709e" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d874b" />
    </marker>
    <marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a37c00" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <!-- Header -->
    <text x="40" y="60" font-size="28" font-weight="bold" fill="#0f172a">OAuth 2.0 Authentication Sequence</text>
    <text x="40" y="90" font-size="16" fill="#475569">Step-by-step API message flow for third-party user authentication</text>

    <!-- Diagram Content Container -->
    <g transform="translate(0, 100)">
      <!-- Lifelines -->
      <g stroke="#cbd5e1" stroke-dasharray="8,8" stroke-width="2">
        <line x1="150" y1="180" x2="150" y2="690" />
        <line x1="450" y1="180" x2="450" y2="690" />
        <line x1="750" y1="180" x2="750" y2="690" />
        <line x1="1050" y1="180" x2="1050" y2="690" />
      </g>

    <!-- Actor Activation Boxes -->
    <rect x="140" y="245" width="20" height="410" rx="4" fill="#e2e0f0" stroke="#b1a6d4" stroke-width="1.5" />
    <rect x="440" y="245" width="20" height="410" rx="4" fill="#d4e4f7" stroke="#9bbde3" stroke-width="1.5" />
    <rect x="740" y="485" width="20" height="90" rx="4" fill="#b2e3c6" stroke="#7ac496" stroke-width="1.5" />
    <rect x="1040" y="325" width="20" height="90" rx="4" fill="#f3e4c4" stroke="#d9bd84" stroke-width="1.5" />

    <!-- Arrows -->
    <g stroke-width="2">
      <!-- 1. Client to API (Request) -->
      <line x1="160" y1="250" x2="435" y2="250" stroke="#6b5b9e" marker-end="url(#arrow-indigo)" />
      
      <!-- 2. API to IdP (Request) -->
      <line x1="460" y1="330" x2="1035" y2="330" stroke="#33709e" marker-end="url(#arrow-blue)" />

      <!-- 3. IdP to API (Response) -->
      <line x1="1040" y1="410" x2="465" y2="410" stroke="#a37c00" stroke-dasharray="6,4" marker-end="url(#arrow-warm)" />

      <!-- 4. API to DB (Request) -->
      <line x1="460" y1="490" x2="735" y2="490" stroke="#33709e" marker-end="url(#arrow-blue)" />

      <!-- 5. DB to API (Response) -->
      <line x1="740" y1="570" x2="465" y2="570" stroke="#2d874b" stroke-dasharray="6,4" marker-end="url(#arrow-green)" />

      <!-- 6. API to Client (Response) -->
      <line x1="440" y1="650" x2="165" y2="650" stroke="#33709e" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />
    </g>

    <!-- Arrow Texts -->
    <g font-size="12" font-weight="bold" text-anchor="middle">
      <text x="300" y="242" fill="#6b5b9e">1. Initiate Login</text>
      <text x="750" y="322" fill="#33709e">2. Redirect to OAuth Provider</text>
      <text x="750" y="402" fill="#a37c00">3. Return OAuth Token</text>
      <text x="600" y="482" fill="#33709e">4. Fetch / Upsert User</text>
      <text x="600" y="562" fill="#2d874b">5. User Profile Record</text>
      <text x="300" y="642" fill="#33709e">6. Return JWT Session Token</text>
    </g>

    <!-- Actor Headers -->
    <g filter="url(#shadow)">
      <rect x="60" y="120" width="180" height="60" rx="12" fill="#f8f5ff" stroke="#e2e0f0" stroke-width="2" />
      <rect x="360" y="120" width="180" height="60" rx="12" fill="#f5f9ff" stroke="#d4e4f7" stroke-width="2" />
      <rect x="660" y="120" width="180" height="60" rx="12" fill="#f4fcf7" stroke="#b2e3c6" stroke-width="2" />
      <rect x="960" y="120" width="180" height="60" rx="12" fill="#fefcf5" stroke="#f3e4c4" stroke-width="2" />
    </g>

    <!-- Actor Header Texts -->
    <g text-anchor="middle">
      <text x="150" y="150" font-size="14" font-weight="bold" fill="#3b2f6b">Mobile Client</text>
      <text x="150" y="166" font-size="11" fill="#6b5b9e">iOS / Android</text>

      <text x="450" y="150" font-size="14" font-weight="bold" fill="#00477a">API Gateway</text>
      <text x="450" y="166" font-size="11" fill="#33709e">Auth Service</text>

      <text x="750" y="150" font-size="14" font-weight="bold" fill="#0e5927">PostgreSQL DB</text>
      <text x="750" y="166" font-size="11" fill="#2d874b">User Store</text>

      <text x="1050" y="150" font-size="14" font-weight="bold" fill="#7a5900">OAuth Provider</text>
      <text x="1050" y="166" font-size="11" fill="#a37c00">Google / Apple</text>
    </g>
    </g>
  </g>
</svg>
