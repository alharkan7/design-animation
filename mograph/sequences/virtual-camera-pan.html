<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Camera Macro Pan - Mograph</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg-main: #ffffff;
    --card-bg: #0a0a0a;
    --border: #222222;
    --border-bright: #444444;
    --text-main: #ffffff;
    --text-muted: #888888;
    
    --line-base: #e5e5e5;
    --line-trace: #000000;
    --accent: #ffffff;
  }

  body, html {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    background-color: transparent;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    color-scheme: light;
    overflow: hidden;
  }

  .camera {
    width: 100vw; height: 100vh;
    transform-origin: center center;
    animation: cameraMove 18s linear both;
  }

  .canvas {
    position: absolute; left: 50%; top: 50%; 
    width: 300vmin; height: 300vmin;
    margin-left: -150vmin; margin-top: -150vmin;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10vmin;
    padding: 10vmin;
  }

  /*
    Timing for 18s (Match-cut velocity):
  */
  @keyframes cameraMove {
    0%, 10% { transform: scale(1.1) translate(75vmin, 75vmin); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    25%, 35% { transform: scale(1.1) translate(-75vmin, 75vmin); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    50%, 60% { transform: scale(1.1) translate(-75vmin, -75vmin); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    75%, 85% { transform: scale(1.0) translate(0vmin, 0vmin); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    95% { transform: scale(0.28) translate(0vmin, 0vmin); animation-timing-function: cubic-bezier(0.36, 0, 0.64, 1); }
    100% { transform: scale(0) translate(0vmin, 0vmin); }
  }

  .connections {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
  }
  .line {
    fill: none; stroke: var(--line-base); stroke-width: 0.4vmin; stroke-linecap: round; stroke-linejoin: round;
  }
  .trace {
    fill: none; stroke: var(--line-trace); stroke-width: 0.6vmin; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
  }

  /* Sleek SaaS Node Styling */
  .node {
    position: relative; z-index: 2;
    background: var(--card-bg);
    border: 0.2vmin solid var(--border);
    border-radius: 0.5vmin; /* Sharp, minimal rounding */
    
    /* Soft drop shadow so dark cards float beautifully over the white background */
    box-shadow: 0 4vmin 12vmin rgba(0, 0, 0, 0.15), 0 1vmin 3vmin rgba(0, 0, 0, 0.1);
    
    display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start;
    padding: 5vmin; gap: 3vmin;
    width: 45vmin;
    
    align-self: center; justify-self: center;
  }

  .node-header, .node-data, .badge {
    visibility: hidden; 
  }

  .node-header {
    display: flex; align-items: center; gap: 2.5vmin;
    width: 100%;
    border-bottom: 0.1vmin solid var(--border);
    padding-bottom: 3vmin;
  }

  .node-icon {
    width: 6vmin; height: 6vmin;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-main);
  }
  .node-icon svg { width: 100%; height: 100%; }

  .node-title {
    font-family: 'Inter', sans-serif; font-size: 3.5vmin; font-weight: 500;
    color: var(--text-main); letter-spacing: -0.1vmin;
  }

  .node-data {
    font-family: 'JetBrains Mono', monospace; font-size: 2.8vmin; color: var(--text-muted);
    display: flex; flex-direction: column; gap: 1vmin;
  }
  
  .node-data span {
    color: var(--text-main); font-weight: 700;
  }

  /* Placement */
  .n-auth { grid-column: 1 / span 2; grid-row: 1 / span 2; }
  .n-api { grid-column: 3 / span 2; grid-row: 1 / span 2; }
  .n-db { grid-column: 3 / span 2; grid-row: 3 / span 2; }
  .n-core { 
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
    z-index: 10;
  }

  .badge {
    position: absolute; top: 3.5vmin; right: 3.5vmin;
    background: transparent; color: var(--text-main);
    font-family: 'Inter', sans-serif; font-size: 2vmin; font-weight: 500;
    padding: 0.8vmin 1.5vmin; border-radius: 0.2vmin;
    border: 0.1vmin solid var(--border-bright);
    letter-spacing: 0.2vmin; text-transform: uppercase;
  }

  /* INNER CONTENT ANIMATIONS */
  @keyframes wipeUpIn { 0% { clip-path: inset(100% 0 0 0); transform: translateY(4vmin); visibility: visible; opacity: 0; } 100% { clip-path: inset(0 0 0 0); transform: translateY(0); visibility: visible; opacity: 1; } }

  /* Using opacity + transform for a highly elegant reveal (Not green screen safe, but matches the SaaS shadow aesthetic) */
  
  /* Node 1 (Arrives at 0s) */
  .n-auth .node-header { animation: wipeUpIn 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .n-auth .node-data { animation: wipeUpIn 0.8s 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* Node 2 (Arrives visibly at ~3.5s. Pan technically ends at 4.5s) */
  .n-api .node-header { animation: wipeUpIn 0.8s 3.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .n-api .node-data { animation: wipeUpIn 0.8s 3.9s cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* Node 3 (Arrives visibly at ~8.0s. Pan technically ends at 9.0s) */
  .n-db .node-header { animation: wipeUpIn 0.8s 8.2s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .n-db .node-data { animation: wipeUpIn 0.8s 8.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .n-db .badge { animation: wipeUpIn 0.8s 8.6s cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* Node 4 (Arrives visibly at ~12.5s. Pan technically ends at 13.5s) */
  .n-core .node-header { animation: wipeUpIn 0.8s 12.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .n-core .node-data { animation: wipeUpIn 0.8s 12.9s cubic-bezier(0.16, 1, 0.3, 1) both; }


  /* SYNCED TRACE DRAWING */
  .t1 { --len: 150; animation: traceDraw1 2.7s 1.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .t2 { --len: 150; animation: traceDraw2 2.7s 6.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .t3 { --len: 121.74; animation: traceDraw3 2.7s 10.8s cubic-bezier(0.16, 1, 0.3, 1) both; }

  @keyframes traceDraw1 { 0% { stroke-dashoffset: 150; } 100% { stroke-dashoffset: 0; } }
  @keyframes traceDraw2 { 0% { stroke-dashoffset: 150; } 100% { stroke-dashoffset: 0; } }
  @keyframes traceDraw3 { 0% { stroke-dashoffset: 121.74; } 100% { stroke-dashoffset: 0; } }

</style>
</head>
<body>
  <div class="camera">
    <div class="canvas">
      
      <svg class="connections" viewBox="0 0 300 300" preserveAspectRatio="none">
        <path class="line" d="M 75 75 L 225 75" />
        <path class="trace t1" d="M 75 75 L 225 75" />

        <path class="line" d="M 225 75 L 225 225" />
        <path class="trace t2" d="M 225 75 L 225 225" />

        <path class="line" d="M 225 225 Q 225 150 150 150" />
        <path class="trace t3" d="M 225 225 Q 225 150 150 150" />
      </svg>

      <div class="node n-auth">
        <div class="node-header">
          <div class="node-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          </div>
          <div class="node-title">Auth Gateway</div>
        </div>
        <div class="node-data">
          STATUS <br>
          <span>TOKEN_VALID</span>
        </div>
      </div>

      <div class="node n-api">
        <div class="node-header">
          <div class="node-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          </div>
          <div class="node-title">API Cluster</div>
        </div>
        <div class="node-data">
          THROUGHPUT <br>
          <span>7,492 REQ/S</span>
        </div>
      </div>

      <div class="node n-db">
        <div class="node-header">
          <div class="node-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
          </div>
          <div class="node-title">Data Lake</div>
        </div>
        <div class="node-data">
          STORAGE ALLOCATED <br>
          <span>8.4 PB</span>
        </div>
        <div class="badge">SECURE</div>
      </div>

      <div class="node n-core">
        <div class="node-header">
          <div class="node-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          </div>
          <div class="node-title">Core AI Node</div>
        </div>
        <div class="node-data">
          SYSTEM STATE <br>
          <span>ONLINE</span>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
