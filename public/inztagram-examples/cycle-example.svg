<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#a0b0c0" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <!-- Header -->
    <text x="40" y="60" font-size="28" font-weight="bold" fill="#0f172a">Recommendation Engine Loop</text>
    <text x="40" y="90" font-size="16" fill="#475569">Continuous machine learning cycle for Inztagram's personalized Explore feed</text>
    
    <!-- Center Decor -->
    <g opacity="0.8">
      <circle cx="600" cy="500" r="180" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,8" />
      <circle cx="600" cy="500" r="140" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4" />
      <text x="600" y="495" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="1">CONTINUOUS</text>
      <text x="600" y="525" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="1">DATA FLYWHEEL</text>
    </g>

    <!-- Connecting Arrows -->
    <g fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M 730 160 C 850 160, 960 200, 960 295" />
      <path d="M 960 410 L 960 575" />
      <path d="M 960 690 C 960 800, 850 840, 745 840" />
      <path d="M 470 840 C 350 840, 240 800, 240 705" />
      <path d="M 240 590 L 240 425" />
      <path d="M 240 310 C 240 200, 350 160, 455 160" />
    </g>

    <!-- Cycle Nodes -->
    <g filter="url(#shadow)">
      <!-- 1. Data Ingestion (Top) -->
      <rect x="470" y="110" width="260" height="100" rx="16" fill="#f5f9ff" stroke="#d4e4f7" stroke-width="2" />
      <!-- 2. Feature Engineering (TR) -->
      <rect x="830" y="310" width="260" height="100" rx="16" fill="#f8f5ff" stroke="#e2e0f0" stroke-width="2" />
      <!-- 3. Model Training (BR) -->
      <rect x="830" y="590" width="260" height="100" rx="16" fill="#fff0f5" stroke="#ffcce0" stroke-width="2" />
      <!-- 4. Model Evaluation (Bottom) -->
      <rect x="470" y="790" width="260" height="100" rx="16" fill="#fff9f9" stroke="#f6dce0" stroke-width="2" />
      <!-- 5. Model Serving (BL) -->
      <rect x="110" y="590" width="260" height="100" rx="16" fill="#fefcf5" stroke="#f3e4c4" stroke-width="2" />
      <!-- 6. User Interaction (TL) -->
      <rect x="110" y="310" width="260" height="100" rx="16" fill="#f4fcf7" stroke="#b2e3c6" stroke-width="2" />
    </g>

    <!-- Node Text -->
    <!-- 1 -->
    <text x="600" y="145" font-size="16" font-weight="bold" fill="#00477a" text-anchor="middle">1. Data Ingestion</text>
    <text x="600" y="165" font-size="12" fill="#0060a6" text-anchor="middle">Real-time Kafka streams</text>
    <text x="600" y="185" font-size="12" fill="#0060a6" text-anchor="middle">of user taps, likes, &amp; watch time</text>

    <!-- 2 -->
    <text x="960" y="345" font-size="16" font-weight="bold" fill="#3b2f6b" text-anchor="middle">2. Feature Engineering</text>
    <text x="960" y="365" font-size="12" fill="#50428a" text-anchor="middle">Apache Flink pipelines to</text>
    <text x="960" y="385" font-size="12" fill="#50428a" text-anchor="middle">extract user &amp; content vectors</text>

    <!-- 3 -->
    <text x="960" y="625" font-size="16" font-weight="bold" fill="#800040" text-anchor="middle">3. Model Training</text>
    <text x="960" y="645" font-size="12" fill="#a60053" text-anchor="middle">Distributed GPU clusters</text>
    <text x="960" y="665" font-size="12" fill="#a60053" text-anchor="middle">updating Deep Learning models</text>

    <!-- 4 -->
    <text x="600" y="825" font-size="16" font-weight="bold" fill="#8f000b" text-anchor="middle">4. Model Evaluation</text>
    <text x="600" y="845" font-size="12" fill="#b3000e" text-anchor="middle">Automated A/B testing &amp;</text>
    <text x="600" y="865" font-size="12" fill="#b3000e" text-anchor="middle">shadow deployments for safety</text>

    <!-- 5 -->
    <text x="240" y="625" font-size="16" font-weight="bold" fill="#7a5900" text-anchor="middle">5. Model Serving</text>
    <text x="240" y="645" font-size="12" fill="#a37c00" text-anchor="middle">Low-latency inference API</text>
    <text x="240" y="665" font-size="12" fill="#a37c00" text-anchor="middle">providing real-time rankings</text>

    <!-- 6 -->
    <text x="240" y="345" font-size="16" font-weight="bold" fill="#0e5927" text-anchor="middle">6. User Interaction</text>
    <text x="240" y="365" font-size="12" fill="#168039" text-anchor="middle">Explore Feed &amp; Reels UI</text>
    <text x="240" y="385" font-size="12" fill="#168039" text-anchor="middle">where users consume content</text>
  </g>
</svg>
