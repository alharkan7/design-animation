<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#a0b0c0" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <!-- Header -->
    <text x="40" y="60" font-size="28" font-weight="bold" fill="#0f172a">Video Upload Workflow</text>
    <text x="40" y="90" font-size="16" fill="#475569">A cross-system swimlane diagram for asynchronous media processing</text>

    <!-- Lane Backgrounds -->
    <rect x="0" y="120" width="1200" height="180" fill="#f8fafc" />
    <rect x="0" y="300" width="1200" height="180" fill="#ffffff" />
    <rect x="0" y="480" width="1200" height="180" fill="#f8fafc" />
    <rect x="0" y="660" width="1200" height="180" fill="#ffffff" />

    <!-- Lane Borders -->
    <g stroke="#cbd5e1" stroke-width="1.5">
      <line x1="0" y1="120" x2="1200" y2="120" />
      <line x1="0" y1="300" x2="1200" y2="300" />
      <line x1="0" y1="480" x2="1200" y2="480" />
      <line x1="0" y1="660" x2="1200" y2="660" />
      <line x1="0" y1="840" x2="1200" y2="840" />
    </g>

    <!-- Lane Titles -->
    <g font-size="14" font-weight="bold" letter-spacing="1">
      <text x="40" y="215" fill="#3b2f6b">1. MOBILE CLIENT</text>
      <text x="40" y="395" fill="#00477a">2. API GATEWAY</text>
      <text x="40" y="575" fill="#0e5927">3. MEDIA SERVICE</text>
      <text x="40" y="755" fill="#7a5900">4. CLOUD INFRA</text>
    </g>

    <!-- Connectors -->
    <g fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)">
      <!-- N1 to N2 (Bottom to Left) -->
      <path d="M 260 240 C 260 315, 300 390, 335 390" />
      <!-- N2 to N3 (Right to Bottom) -->
      <path d="M 480 390 C 520 390, 560 315, 560 245" />
      <!-- N3 to N4 (Bottom to Top) -->
      <path d="M 560 240 L 560 715" />
      <!-- N4 to N5 (Right to Bottom) -->
      <path d="M 630 750 C 670 750, 710 675, 710 605" />
      <!-- N5 to N6 (Bottom to Left) -->
      <path d="M 710 600 C 710 675, 750 750, 785 750" />
      <!-- N5 to N7 (Top to Left) -->
      <path d="M 710 540 C 710 465, 750 390, 785 390" />
      <!-- N7 to N8 (Right to Bottom) -->
      <path d="M 930 390 C 970 390, 1010 315, 1010 245" />
    </g>

    <!-- Nodes with Shadows -->
    <g filter="url(#shadow)">
      <!-- Indigo Nodes (Lane 1) -->
      <g fill="#f8f5ff" stroke="#e2e0f0" stroke-width="2">
        <rect x="190" y="180" width="140" height="60" rx="12" />
        <rect x="490" y="180" width="140" height="60" rx="12" />
        <rect x="940" y="180" width="140" height="60" rx="12" />
      </g>

      <!-- Blue Nodes (Lane 2) -->
      <g fill="#f5f9ff" stroke="#d4e4f7" stroke-width="2">
        <rect x="340" y="360" width="140" height="60" rx="12" />
        <rect x="790" y="360" width="140" height="60" rx="12" />
      </g>

      <!-- Green Nodes (Lane 3) -->
      <g fill="#f4fcf7" stroke="#b2e3c6" stroke-width="2">
        <rect x="640" y="540" width="140" height="60" rx="12" />
      </g>

      <!-- Warm Nodes (Lane 4) -->
      <g fill="#fefcf5" stroke="#f3e4c4" stroke-width="2">
        <rect x="490" y="720" width="140" height="60" rx="12" />
        <rect x="790" y="720" width="140" height="60" rx="12" />
      </g>
    </g>

    <!-- Node Text -->
    <g text-anchor="middle">
      <!-- Indigo Text -->
      <text x="260" y="210" font-size="14" font-weight="bold" fill="#3b2f6b">Select Media</text>
      <text x="260" y="226" font-size="11" fill="#6b5b9e">User Action</text>

      <text x="560" y="210" font-size="14" font-weight="bold" fill="#3b2f6b">Upload Bytes</text>
      <text x="560" y="226" font-size="11" fill="#6b5b9e">Direct to Storage</text>

      <text x="1010" y="210" font-size="14" font-weight="bold" fill="#3b2f6b">Render in Feed</text>
      <text x="1010" y="226" font-size="11" fill="#6b5b9e">UI Update</text>

      <!-- Blue Text -->
      <text x="410" y="390" font-size="14" font-weight="bold" fill="#00477a">Sign Upload</text>
      <text x="410" y="406" font-size="11" fill="#33709e">Generate URL</text>

      <text x="860" y="390" font-size="14" font-weight="bold" fill="#00477a">Notify Client</text>
      <text x="860" y="406" font-size="11" fill="#33709e">Websocket Push</text>

      <!-- Green Text -->
      <text x="710" y="570" font-size="14" font-weight="bold" fill="#0e5927">Transcode Video</text>
      <text x="710" y="586" font-size="11" fill="#2d874b">Extract Thumbnail</text>

      <!-- Warm Text -->
      <text x="560" y="750" font-size="14" font-weight="bold" fill="#7a5900">Raw S3 Bucket</text>
      <text x="560" y="766" font-size="11" fill="#a37c00">Storage Trigger</text>

      <text x="860" y="750" font-size="14" font-weight="bold" fill="#7a5900">Save Metadata</text>
      <text x="860" y="766" font-size="11" fill="#a37c00">PostgreSQL DB</text>
    </g>
  </g>
</svg>
