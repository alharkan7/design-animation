<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#a0b0c0" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" />
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text x="40" y="50" font-size="28" font-weight="bold" fill="#0f172a">System Architecture: Scalable Realtime Chat</text>
    <text x="40" y="75" font-size="16" fill="#475569">High-level view of microservices, gateways, and state management for millions of concurrent users</text>
    <rect x="40" y="100" width="220" height="720" rx="16" fill="#f8f5ff" stroke="#e2e0f0" stroke-width="2" stroke-dasharray="8,5" />
    <text x="60" y="135" font-size="14" font-weight="bold" fill="#3b2f6b" letter-spacing="1">CLIENT TIER</text>
    <rect x="300" y="100" width="220" height="720" rx="16" fill="#f4fcf7" stroke="#b2e3c6" stroke-width="2" stroke-dasharray="8,5" />
    <text x="320" y="135" font-size="14" font-weight="bold" fill="#0e5927" letter-spacing="1">EDGE &amp; GATEWAY</text>
    <rect x="560" y="100" width="500" height="720" rx="16" fill="#f5f9ff" stroke="#d4e4f7" stroke-width="2" stroke-dasharray="8,5" />
    <text x="580" y="135" font-size="14" font-weight="bold" fill="#00477a" letter-spacing="1">COMPUTE &amp; MICROSERVICES</text>
    <rect x="1100" y="100" width="450" height="720" rx="16" fill="#fff9f9" stroke="#f6dce0" stroke-width="2" stroke-dasharray="8,5" />
    <text x="1120" y="135" font-size="14" font-weight="bold" fill="#8f000b" letter-spacing="1">DATA &amp; STATE</text>
    <g fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 230 220 C 280 220, 280 200, 330 200" />
      <path d="M 230 400 C 280 400, 280 270, 330 270" />
      <path d="M 230 580 C 280 580, 280 340, 330 340" />
      <path d="M 230 260 C 280 260, 280 500, 330 500" />
      <path d="M 230 440 C 280 440, 280 540, 330 540" />
      <path d="M 230 620 C 280 620, 280 580, 330 580" />
      <path d="M 490 190 L 600 190" />
      <path d="M 490 270 L 600 270" />
      <path d="M 490 350 L 600 350" />
      <path d="M 490 530 L 600 530" />
      <path d="M 1020 190 L 1150 190" />
      <path d="M 1020 270 L 1150 270" />
      <path d="M 1020 350 L 1150 350" />
      <path d="M 1020 530 L 1150 530" />
      <path d="M 1020 670 L 1150 670" />
      <path d="M 1020 660 C 1080 660, 1080 550, 1150 550" />
      <path d="M 1020 750 L 1150 750" />
      <path d="M 1020 740 C 1080 740, 1080 570, 1150 570" />
    </g>
    <g filter="url(#shadow)">
      <rect x="70" y="200" width="160" height="80" rx="12" fill="#fbeea3" stroke="#e8d67d" stroke-width="1.5" />
      <rect x="70" y="380" width="160" height="80" rx="12" fill="#fbeea3" stroke="#e8d67d" stroke-width="1.5" />
      <rect x="70" y="560" width="160" height="80" rx="12" fill="#fbeea3" stroke="#e8d67d" stroke-width="1.5" />
    </g>
    <g text-anchor="middle">
      <text x="150" y="234" font-size="16" font-weight="bold" fill="#7a5900">Web App</text>
      <text x="150" y="254" font-size="13" fill="#967000">React / SPA</text>
      <text x="150" y="414" font-size="16" font-weight="bold" fill="#7a5900">Mobile App</text>
      <text x="150" y="434" font-size="13" fill="#967000">iOS / Android</text>
      <text x="150" y="594" font-size="16" font-weight="bold" fill="#7a5900">Desktop App</text>
      <text x="150" y="614" font-size="13" fill="#967000">Electron (Mac/Win)</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="330" y="160" width="160" height="220" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="330" y="480" width="160" height="100" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    </g>
    <g text-anchor="middle">
      <text x="410" y="250" font-size="16" font-weight="bold" fill="#0f172a">API Gateway</text>
      <text x="410" y="275" font-size="13" fill="#475569">REST / GraphQL</text>
      <text x="410" y="295" font-size="12" fill="#64748b">Rate Limiting &amp; Auth</text>
      <text x="410" y="520" font-size="16" font-weight="bold" fill="#0f172a">WebSocket</text>
      <text x="410" y="540" font-size="16" font-weight="bold" fill="#0f172a">Gateway</text>
      <text x="410" y="565" font-size="13" fill="#475569">Connection Term.</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="600" y="160" width="420" height="60" rx="12" fill="#cbf1d8" stroke="#a9daba" stroke-width="1.5" />
      <rect x="600" y="240" width="420" height="60" rx="12" fill="#cbf1d8" stroke="#a9daba" stroke-width="1.5" />
      <rect x="600" y="320" width="420" height="60" rx="12" fill="#cbf1d8" stroke="#a9daba" stroke-width="1.5" />
      <rect x="600" y="480" width="420" height="100" rx="12" fill="#d1e9ff" stroke="#aecdec" stroke-width="1.5" />
      <rect x="600" y="640" width="420" height="60" rx="12" fill="#cbf1d8" stroke="#a9daba" stroke-width="1.5" />
      <rect x="600" y="720" width="420" height="60" rx="12" fill="#cbf1d8" stroke="#a9daba" stroke-width="1.5" />
    </g>
    <path d="M 620 530 Q 700 480 810 530 T 1000 530" fill="none" stroke="#00477a" stroke-width="8" opacity="0.05" />
    <g text-anchor="middle">
      <text x="810" y="188" font-size="16" font-weight="bold" fill="#0e5927">User &amp; Auth Service</text>
      <text x="810" y="208" font-size="13" fill="#168039">Profiles, Sessions, Social Graph</text>
      <text x="810" y="268" font-size="16" font-weight="bold" fill="#0e5927">Group &amp; Room Service</text>
      <text x="810" y="288" font-size="13" fill="#168039">Memberships, Roles, Permissions</text>
      <text x="810" y="348" font-size="16" font-weight="bold" fill="#0e5927">Media &amp; Attachment Service</text>
      <text x="810" y="368" font-size="13" fill="#168039">Upload Handling, Thumbnail Generation</text>
      <text x="810" y="510" font-size="16" font-weight="bold" fill="#00477a">Real-time Chat Nodes (Stateful Compute)</text>
      <text x="810" y="530" font-size="13" fill="#0060a6">Maintains persistent WS connections</text>
      <text x="810" y="550" font-size="13" fill="#0060a6">Routes incoming/outgoing messages</text>
      <text x="810" y="570" font-size="12" fill="#0077cc">Publishes presence and chat events to Redis</text>
      <text x="810" y="668" font-size="16" font-weight="bold" fill="#0e5927">Message History Service (Workers)</text>
      <text x="810" y="688" font-size="13" fill="#168039">Async writes &amp; reads for chat history, consumes from Redis</text>
      <text x="810" y="748" font-size="16" font-weight="bold" fill="#0e5927">Push Notification Service</text>
      <text x="810" y="768" font-size="13" fill="#168039">Listens for offline mentions/messages, formats device payloads</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1150" y="160" width="350" height="140" rx="12" fill="#d1e9ff" stroke="#aecdec" stroke-width="1.5" />
      <rect x="1150" y="320" width="350" height="60" rx="12" fill="#fbeea3" stroke="#e8d67d" stroke-width="1.5" />
      <rect x="1150" y="480" width="350" height="100" rx="12" fill="#ffd4d6" stroke="#f0b6bc" stroke-width="1.5" />
      <rect x="1150" y="640" width="350" height="60" rx="12" fill="#d1e9ff" stroke="#aecdec" stroke-width="1.5" />
      <rect x="1150" y="720" width="350" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    </g>
    <rect x="1170" y="240" width="100" height="8" rx="4" fill="#00477a" opacity="0.05" />
    <rect x="1170" y="260" width="150" height="8" rx="4" fill="#00477a" opacity="0.05" />
    <rect x="1170" y="280" width="120" height="8" rx="4" fill="#00477a" opacity="0.05" />
    <circle cx="1200" cy="530" r="30" fill="#8f000b" opacity="0.04" />
    <circle cx="1280" cy="530" r="45" fill="#8f000b" opacity="0.04" />
    <g text-anchor="middle">
      <text x="1325" y="200" font-size="16" font-weight="bold" fill="#00477a">Relational Database</text>
      <text x="1325" y="225" font-size="13" font-style="italic" fill="#0060a6">(PostgreSQL Cluster)</text>
      <text x="1325" y="245" font-size="12" fill="#0077cc">Users, Groups, Relations, App Metadata</text>
      <text x="1325" y="348" font-size="16" font-weight="bold" fill="#7a5900">Object Storage &amp; CDN</text>
      <text x="1325" y="368" font-size="13" font-style="italic" fill="#967000">(Amazon S3 / CloudFront)</text>
      <text x="1325" y="515" font-size="16" font-weight="bold" fill="#8f000b">State &amp; Event Bus</text>
      <text x="1325" y="540" font-size="13" font-style="italic" fill="#b80011">(Redis Cluster)</text>
      <text x="1325" y="560" font-size="12" fill="#d91a2a">Cross-node routing, Presence, Caching</text>
      <text x="1325" y="668" font-size="16" font-weight="bold" fill="#00477a">Wide-column Store</text>
      <text x="1325" y="688" font-size="13" font-style="italic" fill="#0060a6">(Cassandra / ScyllaDB for chat history)</text>
      <text x="1325" y="748" font-size="16" font-weight="bold" fill="#0f172a">External Push Providers</text>
      <text x="1325" y="768" font-size="13" font-style="italic" fill="#475569">(APNs, FCM, WebPush)</text>
    </g>
  </g>
</svg>