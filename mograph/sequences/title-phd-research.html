<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Title PhD Research</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; }

  :root {
    /* Academic Paper Theme */
    --bg-main: #F7F5F0;
    --text-main: #1A1A1A;
    --accent: #1E3A8A; /* Oxford Blue */
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background-color: var(--bg-main);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: exitScene 0.8s 6s cubic-bezier(0.36, 0, 0.64, 1) forwards;
  }

  .bg-orb {
    position: absolute;
    width: 120vmin;
    height: 120vmin;
    background: radial-gradient(circle, rgba(30, 58, 138, 0.06) 0%, rgba(30, 58, 138, 0) 70%);
    border-radius: 50%;
    z-index: 0;
    top: 50%; left: 30%;
    transform: translate(-50%, -50%) scale(0.5);
    animation: orbPulse 8s cubic-bezier(0.25, 1, 0.5, 1) both;
  }

  /* Abstract Pattern Background */
  .bg-grid {
    position: absolute;
    width: 100vw; height: 100vh;
    top: 0; left: 0;
    background-image: 
      linear-gradient(rgba(30, 58, 138, 0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30, 58, 138, 0.15) 1px, transparent 1px);
    background-size: 8vmin 8vmin;
    background-position: 0 0;
    z-index: 0;
    animation: gridReveal 3s ease-out 0s both, gridSlide 10s linear forwards;
    mask-image: radial-gradient(circle at 30% 50%, black 30%, transparent 90%);
    -webkit-mask-image: radial-gradient(circle at 30% 50%, black 30%, transparent 90%);
  }

  @keyframes gridReveal {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  .abstract-shapes {
    position: absolute;
    width: 100vw; height: 100vh;
    z-index: 0;
    overflow: hidden;
  }
  
  .ring-wrapper {
    position: absolute;
    top: 50%; left: 30%;
  }

  .ring-1-wrap { animation: ringReveal 2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
  .ring-2-wrap { animation: ringReveal 2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
  .ring-3-wrap { animation: ringReveal 2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }

  @keyframes ringReveal {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  
  .ring {
    position: relative;
    border-radius: 50%;
    display: block;
  }
  
  .ring-1 {
    width: 45vmin; height: 45vmin;
    /* Replaced CSS dashed border with inline SVG in HTML for wider spacing */
    animation: ringSpin 20s linear forwards;
  }
  
  .ring-2 {
    width: 65vmin; height: 65vmin;
    border: 0.3vmin solid rgba(30, 58, 138, 0.15);
    animation: ringSpinReverse 25s linear forwards;
  }
  
  .ring-3 {
    width: 90vmin; height: 90vmin;
    border: 0.6vmin dotted rgba(30, 58, 138, 0.2);
    animation: ringSpin 30s linear forwards;
  }

  .title-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 1.5vmin;
    animation: drift 7s cubic-bezier(0.25, 1, 0.5, 1) both;
  }

  .word {
    display: flex;
    align-items: baseline;
  }
  
  .space {
    width: 2vmin;
  }

  .letter {
    font-family: 'Lora', serif;
    font-size: 7.5vmin;
    font-weight: 500;
    color: var(--text-main);
    line-height: 1;
    padding: 0 0.2vmin;
    --delay: calc(0.3s + var(--i) * 0.04s);
    animation: letterReveal 1.2s var(--delay) cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .indent {
    /* Removed arbitrary indent for strict flush-left alignment */
  }

  .subtitle {
    margin-top: 3vmin;
    align-items: center;
    gap: 1.5vmin;
  }

  .letter.sub {
    font-family: 'Inter', sans-serif;
    font-size: 3.2vmin;
    font-weight: 600;
    letter-spacing: 0.3vmin;
    text-transform: uppercase;
    color: var(--text-main);
  }

  .letter.accent {
    color: var(--accent);
    font-weight: 800;
  }

  .line {
    width: 6vmin;
    height: 0.3vmin;
    background: var(--accent);
    transform-origin: left;
    margin-right: 1vmin;
    animation: drawLine 1s 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes letterReveal {
    0% { 
      transform: translateY(100%); 
      clip-path: inset(-50% -50% 100% -50%);
    }
    100% { 
      transform: translateY(0); 
      clip-path: inset(-50% -50% -50% -50%);
    }
  }

  @keyframes drawLine {
    0% { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }

  @keyframes drift {
    0% { transform: scale(0.92); }
    100% { transform: scale(1.05); }
  }

  @keyframes orbPulse {
    0% { transform: translate(-50%, -50%) scale(0.5); }
    100% { transform: translate(-50%, -50%) scale(1.5); }
  }

  @keyframes gridSlide {
    0% { background-position: 0 0; }
    100% { background-position: -4vmin -4vmin; }
  }

  @keyframes ringSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(180deg); }
  }
  
  @keyframes ringSpinReverse {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-180deg); }
  }

  @keyframes exitScene {
    0% { transform: translateY(0) scale(1); clip-path: inset(-50% -50% -50% -50%); }
    100% { transform: translateY(-10vmin) scale(0.95); clip-path: inset(0 0 100% 0); }
  }

</style>
</head>
<body>
  <div class="scene">
    <div class="bg-grid"></div>
    <div class="abstract-shapes">
      <div class="ring-wrapper ring-1-wrap">
        <svg class="ring ring-1" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="49" fill="none" stroke="rgba(30, 58, 138, 0.3)" stroke-width="0.4" stroke-dasharray="1.5 3" />
        </svg>
      </div>
      <div class="ring-wrapper ring-2-wrap">
        <div class="ring ring-2"></div>
      </div>
      <div class="ring-wrapper ring-3-wrap">
        <div class="ring ring-3"></div>
      </div>
    </div>
    <div class="bg-orb"></div>
    <div class="title-container">
      
      <div class="word">
        <div class="letter" style="--i: 0">A</div>
        <div class="letter" style="--i: 1">u</div>
        <div class="letter" style="--i: 2">t</div>
        <div class="letter" style="--i: 3">o</div>
        <div class="letter" style="--i: 4">m</div>
        <div class="letter" style="--i: 5">a</div>
        <div class="letter" style="--i: 6">t</div>
        <div class="letter" style="--i: 7">i</div>
        <div class="letter" style="--i: 8">n</div>
        <div class="letter" style="--i: 9">g</div>
      </div>
      
      <div class="word indent">
        <div class="letter" style="--i: 10">M</div>
        <div class="letter" style="--i: 11">y</div>
        <div class="space"></div>
        <div class="letter" style="--i: 12">P</div>
        <div class="letter" style="--i: 13">h</div>
        <div class="letter" style="--i: 14">D</div>
        <div class="space"></div>
        <div class="letter" style="--i: 15">R</div>
        <div class="letter" style="--i: 16">e</div>
        <div class="letter" style="--i: 17">s</div>
        <div class="letter" style="--i: 18">e</div>
        <div class="letter" style="--i: 19">a</div>
        <div class="letter" style="--i: 20">r</div>
        <div class="letter" style="--i: 21">c</div>
        <div class="letter" style="--i: 22">h</div>
      </div>

      <div class="word subtitle">
        <div class="line"></div>
        <div class="letter sub" style="--i: 23">P</div>
        <div class="letter sub" style="--i: 24">a</div>
        <div class="letter sub" style="--i: 25">r</div>
        <div class="letter sub" style="--i: 26">t</div>
        <div class="space"></div>
        <div class="letter sub accent" style="--i: 27">2</div>
      </div>

    </div>
  </div>
</body>
</html>
