  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    .stage {
      position: absolute;
      width: 100vw;
      height: 100vh;
      left: 0;
      top: 0;
    }
    .logo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20vw;
      height: auto;
      translate: -50% -50%;
      scale: 0;
      will-change: scale, translate;
    }
    
    @media (max-aspect-ratio: 1/1) {
      .logo {
        width: 35vw;
      }
    }

    /* Main Hero Logo */
    .hero-logo {
      z-index: 100;
      animation: 
        hero-enter 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both,
        hero-fly var(--fly-duration) cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
    }

    @keyframes hero-enter {
      0% { scale: 0; }
      100% { scale: 2.25; }
    }
    
    @keyframes hero-fly {
      0% {
        scale: 2.25;
        translate: -50% -50%;
      }
      100% {
        scale: 0;
        translate: calc(-50% + var(--tx)) calc(-50% + var(--ty));
      }
    }

    /* Clone Logos */
    .clone-logo {
      z-index: 10;
      animation: clone-spread var(--duration) cubic-bezier(0.16, 1, 0.3, 1) var(--delay) both;
    }

    @keyframes clone-spread {
      0% {
        scale: 0;
        translate: -50% -50%;
      }
      1% {
        scale: var(--start-scale-rand); 
        translate: -50% -50%;
      }
      100% {
        scale: 0;
        translate: calc(-50% + var(--tx)) calc(-50% + var(--ty));
      }
    }
  </style>
</head>
