<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Title Beeblio - Mograph</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600;1,800&family=Inter:wght@400;500;600;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg-main: #f8fafc;
    --text-main: #0f172a;
    --accent: #4f46e5; 
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background-color: var(--bg-main);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Exit animation to clear the screen at the end */
    animation: exitScene 0.8s 5s cubic-bezier(0.36, 0, 0.64, 1) forwards;
  }

  .bg-orb {
    position: absolute;
    width: 80vmin;
    height: 80vmin;
    background: radial-gradient(circle, rgba(79, 70, 229, 0.08) 0%, rgba(79, 70, 229, 0) 70%);
    border-radius: 50%;
    z-index: 0;
    animation: orbPulse 8s cubic-bezier(0.25, 1, 0.5, 1) both;
  }

  .title-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    /* Slow kinetic drift forward */
    animation: drift 6s cubic-bezier(0.25, 1, 0.5, 1) both;
  }

  .letters-wrap {
    display: flex;
    align-items: baseline;
  }

  .letter {
    font-family: 'Playfair Display', serif;
    font-size: 16vmin;
    font-weight: 800;
    font-style: italic;
    color: var(--text-main);
    line-height: 1;
    /* Small horizontal padding so italics don't bleed out visually */
    padding: 0 0.5vmin;
    
    --delay: calc(0.2s + var(--index) * 0.08s);
    animation: letterReveal 1s var(--delay) cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  
  .dot {
    font-family: 'Inter', sans-serif;
    font-size: 16vmin;
    font-weight: 800;
    color: var(--accent);
    margin-left: 1vmin;
    animation: dotReveal 0.6s 1.0s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .line {
    width: 100%;
    height: 0.6vmin;
    background: var(--text-main);
    margin-top: 2vmin;
    transform-origin: left;
    border-radius: 1vmin;
    animation: drawLine 1.2s 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* 
    The clip-path uses -50% for top, left, right to prevent cutting off 
    the bounding box bleeds of italic letters. It strictly clips from the bottom (100%).
  */
  @keyframes letterReveal {
    0% { 
      transform: translateY(100%); 
      clip-path: inset(-50% -50% 100% -50%);
    }
    100% { 
      transform: translateY(0); 
      clip-path: inset(-50% -50% -50% -50%);
    }
  }

  @keyframes dotReveal {
    0% { transform: scale(0) translateY(5vmin); }
    100% { transform: scale(1) translateY(0); }
  }

  @keyframes drawLine {
    0% { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }

  @keyframes drift {
    0% { transform: scale(0.92); }
    100% { transform: scale(1.05); }
  }

  @keyframes orbPulse {
    0% { transform: scale(0.5); }
    100% { transform: scale(1.5); }
  }

  @keyframes exitScene {
    0% { transform: translateY(0) scale(1); clip-path: inset(-50% -50% -50% -50%); }
    100% { transform: translateY(-15vmin) scale(0.9); clip-path: inset(0 0 100% 0); }
  }

</style>
</head>
<body>
  <div class="scene">
    <div class="bg-orb"></div>
    <div class="title-container">
      <div class="letters-wrap">
        <div class="letter" style="--index: 0;">B</div>
        <div class="letter" style="--index: 1;">e</div>
        <div class="letter" style="--index: 2;">e</div>
        <div class="letter" style="--index: 3;">b</div>
        <div class="letter" style="--index: 4;">l</div>
        <div class="letter" style="--index: 5;">i</div>
        <div class="letter" style="--index: 6;">o</div>
        <div class="dot">.</div>
      </div>
      <div class="line"></div>
    </div>
  </div>
</body>
</html>
