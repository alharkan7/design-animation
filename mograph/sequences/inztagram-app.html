<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inztagram App Sequence</title>
  <style>
    :root {
      --bg: #f8fafc;
      --fg: #0f172a;
      --card: #ffffff;
      --border: #e2e8f0;
      --primary: #3b82f6;
    }
    body {
      margin: 0; padding: 0; overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      width: 100vw; height: 100vh;
      background-color: var(--bg);
      color: var(--fg);
      font-size: min(1.3vw, 2.2vh); 
    }
    .sequence-container {
      position: relative; width: 100vw; height: 100vh;
      perspective: 2500px;
      transform-style: preserve-3d;
    }
    
    /* Background effects */
    .bg-orbs {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
    }
    .orb-1 { position: absolute; top: -20%; left: -10%; width: 50%; height: 50%; border-radius: 50%; background: rgba(99, 102, 241, 0.15); filter: blur(120px); mix-blend-mode: multiply; }
    .orb-2 { position: absolute; bottom: -20%; right: -10%; width: 60%; height: 60%; border-radius: 50%; background: rgba(59, 130, 246, 0.15); filter: blur(150px); mix-blend-mode: multiply; }
    .orb-3 { position: absolute; top: 20%; right: 10%; width: 30%; height: 30%; border-radius: 50%; background: rgba(6, 182, 212, 0.1); filter: blur(100px); mix-blend-mode: multiply; }
    .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px); background-size: 24px 24px; }
    
    /* App Frame */
    .app-frame {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      background: var(--bg);
      transform-origin: center center;
      animation: flyInUI 3.2s forwards;
      overflow: hidden;
      /* Initial hidden state */
      opacity: 0;
    }
    
    @keyframes flyInUI {
      0% {
        transform: translate3d(120vw, 120vh, -2000px) rotateX(60deg) rotateZ(-45deg) scale(0.2);
        opacity: 0;
        border-radius: 6em;
        box-shadow: 0 0 0 0.2em rgba(148, 163, 184, 0.4), -15em 15em 30em rgba(0,0,0,0.1);
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      40% {
        transform: translate3d(0, 0, -600px) rotateX(60deg) rotateZ(-45deg) scale(0.65);
        opacity: 1;
        border-radius: 4em;
        box-shadow: 0 0 0 0.2em rgba(148, 163, 184, 0.4), -5em 5em 15em rgba(0,0,0,0.15);
        animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      }
      80%, 100% {
        transform: translate3d(0, 0, 0) rotateX(0deg) rotateZ(0deg) scale(1);
        opacity: 1;
        border-radius: 0;
        box-shadow: 0 0 0 0 rgba(148, 163, 184, 0), 0 0 0 rgba(0,0,0,0);
      }
    }

    /* Camera Animation */
    .camera {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      animation: camMove 11s forwards;
    }
    @keyframes camMove {
      0%, 36% {
        transform: scale(1) translate(0, 0);
        animation-timing-function: cubic-bezier(0.76, 0, 0.24, 1);
      }
      45% {
        transform: scale(2.2) translate(28vw, -4vh);
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      73% {
        transform: scale(2.2) translate(-15vw, -4vh);
        animation-timing-function: cubic-bezier(0.76, 0, 0.24, 1);
      }
      86%, 100% {
        transform: scale(2.8) translate(25vw, -10vh);
      }
    }
    
    /* Typing Animation */
    #fake-textarea {
      display: block; box-sizing: border-box; white-space: nowrap; overflow: hidden;
    }
    .typewriter-text {
      display: inline-block; overflow: hidden; white-space: nowrap; width: 0;
      border-right: 0.15em solid var(--primary);
      padding-right: 0.1em;
      animation: typing 3s steps(52) 5s forwards, blink 0.8s infinite;
    }
    .typewriter-text::before {
      content: "System architecture for a scalable realtime chat app";
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 26.5em; }
    }
    @keyframes blink {
      0%, 100% { border-color: var(--primary); }
      50% { border-color: transparent; }
    }

    /* Mode Toggle Animation */
    #mode-mermaid {
      animation: toggleOff 0.3s ease 9.5s forwards;
    }
    #mode-freeform {
      animation: toggleOn 0.3s ease 9.5s forwards;
    }
    @keyframes toggleOff {
      to { background: transparent; color: #64748b; box-shadow: none; }
    }
    @keyframes toggleOn {
      to { background: #ffffff; color: #0f172a; box-shadow: 0 0 0 0.15em var(--primary), 0 0.1em 0.5em rgba(0,0,0,0.1); }
    }

    /* Layouts Overlay */
    .layouts-overlay {
      position: absolute; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(248, 250, 252, 0.85); backdrop-filter: blur(30px);
      opacity: 0; visibility: hidden;
      animation: overlayVisibility 4.5s 10.5s forwards;
    }
    @keyframes overlayVisibility {
      0% { opacity: 0; visibility: hidden; }
      10%, 100% { opacity: 1; visibility: visible; }
    }
    .layouts-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5em;
      width: 35em; max-width: 90vw;
      transform: translateY(120vh);
      animation: trainScroll 4.5s 10.5s forwards;
    }
    @keyframes trainScroll {
      0% {
        transform: translateY(120vh);
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      25% {
        transform: translateY(25vh);
        animation-timing-function: cubic-bezier(0.4, 0.1, 0.6, 0.9);
      }
      80% {
        transform: translateY(-40vh);
        animation-timing-function: cubic-bezier(0.7, 0, 1, 0.4);
      }
      100% {
        transform: translateY(-200vh);
      }
    }
    .layout-card {
      background: #ffffff; border: 0.1em solid var(--border); border-radius: 1em;
      padding: 1.5em; box-shadow: 0 1em 2em rgba(0,0,0,0.05);
      display: flex; flex-direction: column; align-items: center; gap: 1em;
    }
    .layout-card img {
      width: 100%; height: auto; border-radius: 0.5em;
    }
    .layout-card span {
      font-size: 1.2em; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    }

    /* Page Home */
    .page-home {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10;
    }
    
    .hero { text-align: center; }
    .hero-title {
      font-size: 5em; font-weight: 800; margin: 0; letter-spacing: -0.02em;
      background: linear-gradient(to right, #4f46e5, #0891b2, #059669);
      -webkit-background-clip: text; color: transparent;
    }
    
    .input-wrapper {
      margin-top: 3em; position: relative; width: 50em; max-width: 90vw;
    }
    .input-glow {
      position: absolute; inset: -1em;
      background: linear-gradient(to right, rgba(99,102,241,0.15), rgba(6,182,212,0.15));
      border-radius: 2em; filter: blur(30px); z-index: -1;
    }
    .input-box {
      background: var(--card); border: 0.1em solid var(--border);
      border-radius: 1.5em; padding: 1.5em;
      display: flex; flex-direction: column; gap: 1em;
      box-shadow: 0 1em 3em rgba(0,0,0,0.05);
    }
    .input-textarea {
      width: 100%; height: 6em; background: transparent; border: none;
      color: #0f172a; font-size: 1.1em; outline: none; resize: none;
      font-family: inherit; line-height: 1.5;
    }
    .input-actions {
      display: flex; justify-content: space-between; align-items: center;
    }
    .mode-switch {
      display: flex; background: rgba(0,0,0,0.05); border-radius: 0.5em; padding: 0.3em;
    }
    .mode-btn {
      padding: 0.5em 1em; border-radius: 0.3em; font-size: 0.9em; font-weight: 500;
      background: transparent; color: #64748b;
    }
    .mode-btn.active { background: #ffffff; color: #0f172a; box-shadow: 0 0 0 0.15em var(--primary), 0 0.1em 0.5em rgba(0,0,0,0.1); }
    .btn-send {
      background: var(--primary); color: #fff; padding: 0.6em 1.5em;
      border-radius: 0.5em; font-weight: 600; border: none; font-size: 1em;
    }
    
    /* Page Detail */
    .page-detail {
      position: absolute; inset: 0; padding-top: 2em; padding-bottom: 3.5em;
      display: flex; visibility: hidden; opacity: 0; z-index: 5;
    }
    
    .detail-layout {
      display: flex; width: 100%; height: 100%; padding: 1em; gap: 1em;
      box-sizing: border-box; max-width: 1600px; margin: 0 auto;
    }
    
    .diagram-area {
      flex: 1; background: var(--card); border: 0.1em solid var(--border);
      border-radius: 1em; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1em 2em rgba(0,0,0,0.02);
    }
    
    .chat-sidebar {
      width: 25em; background: rgba(255, 255, 255, 0.8); border: 0.1em solid var(--border); backdrop-filter: blur(20px);
      border-radius: 1em; display: flex; flex-direction: column;
      box-shadow: 0 1em 2em rgba(0,0,0,0.02);
    }
    .chat-messages {
      flex: 1; padding: 1.5em; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5em;
    }
    .chat-input {
      padding: 1em; border-top: 0.1em solid var(--border); background: var(--card); border-radius: 0 0 1em 1em;
    }
    .chat-input-box {
      background: rgba(0,0,0,0.02); border: 0.1em solid var(--border);
      border-radius: 0.5em; padding: 0.8em; display: flex; gap: 0.5em; align-items: center;
    }
    .chat-input-box input {
      flex: 1; background: transparent; border: none; color: #0f172a; outline: none; font-size: 0.9em;
    }
    
    .msg-user {
      align-self: flex-end; background: #e2e8f0; color: #0f172a;
      padding: 0.8em 1.2em; border-radius: 1em 1em 0 1em; font-size: 0.9em; max-width: 85%; line-height: 1.4;
    }
    .msg-ai {
      align-self: flex-start; color: #334155;
      padding: 0; font-size: 0.9em; max-width: 85%; line-height: 1.4;
    }
    
    @media (max-aspect-ratio: 1/1) {
      body { font-size: 2.2vw; }
      .input-wrapper { width: 90vw; }
      .detail-layout { flex-direction: column; }
      .chat-sidebar { width: 100%; height: 35vh; }
      .hero-title { font-size: 4em; }
      
      .layouts-grid { width: 90vw; gap: 1em; }
    }

  </style>
</head>
<body>
  <div class="sequence-container">
    <div class="camera">
      <div class="app-frame">
        <!-- Background elements -->
        <div class="bg-orbs">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
        <div class="orb-3"></div>
        <div class="bg-grid"></div>
      </div>
      
      <!-- PAGE 1: HOME -->
      <div class="page-home" id="page-home">
        <div class="hero">
          <h1 class="hero-title">Inztagram</h1>
        </div>
        
        <div class="input-wrapper">
          <div class="input-glow"></div>
          <div class="input-box">
            <div class="input-textarea" id="fake-textarea">
              <span class="typewriter-text"></span>
            </div>
            <div class="input-actions">
              <div class="mode-switch">
                <div class="mode-btn" id="mode-freeform">Freeform</div>
                <div class="mode-btn active" id="mode-mermaid">Mermaid</div>
              </div>
              <button class="btn-send">Generate</button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- PAGE 2: DETAIL -->
      <div class="page-detail" id="page-detail">
        <div class="detail-layout">
          <div class="diagram-area">
            <!-- Diagram placeholder -->
            <svg viewBox="0 0 800 600" width="80%" height="80%">
              <defs>
                <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
                  <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.1" />
                </filter>
              </defs>
              <g font-family="Inter, sans-serif">
                <path d="M 400 200 L 400 400" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
                <g transform="translate(250, 100)">
                  <rect width="300" height="100" rx="16" fill="#f5f9ff" stroke="#d4e4f7" stroke-width="2" filter="url(#shadow)"/>
                  <text x="150" y="55" fill="#00477a" font-size="24" font-weight="600" text-anchor="middle">Input Data</text>
                </g>
                <g transform="translate(250, 400)">
                  <rect width="300" height="100" rx="16" fill="#f4fcf7" stroke="#b2e3c6" stroke-width="2" filter="url(#shadow)"/>
                  <text x="150" y="55" fill="#0e5927" font-size="24" font-weight="600" text-anchor="middle">Output Result</text>
                </g>
              </g>
            </svg>
          </div>
          
          <div class="chat-sidebar">
            <div class="chat-messages">
              <div class="msg-user">Generate a simple input/output diagram</div>
              <div class="msg-ai">Generated diagram</div>
            </div>
            <div class="chat-input">
              <div class="chat-input-box">
                <input type="text" placeholder="Update diagram..." />
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </div>
            </div>
          </div>
        </div>
      </div>
      
    </div>
    </div>
    
    <!-- Layouts Overlay -->
    <div class="layouts-overlay">
      <div class="layouts-grid">
        <div class="layout-card"><img src="/inztagram/layouts/grid.svg"><span>Grid</span></div>
        <div class="layout-card"><img src="/inztagram/layouts/flow.svg"><span>Flow</span></div>
        <div class="layout-card"><img src="/inztagram/layouts/radial.svg"><span>Radial</span></div>
        <div class="layout-card"><img src="/inztagram/layouts/mindmap.svg"><span>Mindmap</span></div>
        <div class="layout-card"><img src="/inztagram/layouts/hierarchy.svg"><span>Hierarchy</span></div>
        <div class="layout-card"><img src="/inztagram/layouts/sequence.svg"><span>Sequence</span></div>
        <div class="layout-card"><img src="/inztagram/layouts/timeline.svg"><span>Timeline</span></div>
        <div class="layout-card"><img src="/inztagram/layouts/comparison.svg"><span>Comparison</span></div>
        <div class="layout-card"><img src="/inztagram/layouts/swimlane.svg"><span>Swimlane</span></div>
        <div class="layout-card"><img src="/inztagram/layouts/funnel.svg"><span>Funnel</span></div>
        <div class="layout-card"><img src="/inztagram/layouts/cycle.svg"><span>Cycle</span></div>
        <div class="layout-card"><img src="/inztagram/layouts/layers.svg"><span>Layers</span></div>
      </div>
    </div>
    
  </div>
</body>
</html>
