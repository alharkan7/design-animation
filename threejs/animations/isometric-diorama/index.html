<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric Diorama - Day/Night Cycle</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene Setup
        const scene = new THREE.Scene();

        // 2. Camera Setup
        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = 14; 
        const camera = new THREE.OrthographicCamera(
            frustumSize * aspect / - 2,
            frustumSize * aspect / 2,
            frustumSize / 2,
            frustumSize / - 2,
            1,
            1000
        );
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ 
            alpha: true, 
            antialias: true, 
            preserveDrawingBuffer: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        // 4. Lighting & Celestial Setup (Day/Night Cycle)
        const orbitTiltGroup = new THREE.Group();
        orbitTiltGroup.rotation.x = Math.PI / 8; // Tilt the orbit slightly for a nice diagonal arc
        scene.add(orbitTiltGroup);

        const celestialPivot = new THREE.Group();
        orbitTiltGroup.add(celestialPivot);

        // Hemisphere Light for soft ambient fill transitioning between day/night
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xffffff, 1);
        scene.add(hemiLight);

        // Target for the celestial directional lights
        const lightTarget = new THREE.Object3D();
        lightTarget.position.set(0, 0, 0);
        scene.add(lightTarget);

        // --- Sun ---
        const sunGroup = new THREE.Group();
        sunGroup.position.set(8, 0, 0); // Closer orbit radius
        celestialPivot.add(sunGroup);

        const sunGeo = new THREE.IcosahedronGeometry(0.8, 1);
        const sunMat = new THREE.MeshStandardMaterial({ 
            color: 0xffaa00, 
            emissive: 0xfffaed, 
            emissiveIntensity: 2, 
            toneMapped: false,
            flatShading: true
        });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        sunGroup.add(sunMesh);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.5);
        sunLight.castShadow = true;
        sunLight.target = lightTarget;
        sunGroup.add(sunLight);

        // --- Moon ---
        const moonGroup = new THREE.Group();
        moonGroup.position.set(-8, 0, 0); // Closer orbit radius
        celestialPivot.add(moonGroup);

        const moonGeo = new THREE.DodecahedronGeometry(0.5, 0);
        const moonMat = new THREE.MeshStandardMaterial({ 
            color: 0x88bbff, 
            emissive: 0x4488ff, 
            emissiveIntensity: 1.5, 
            toneMapped: false,
            flatShading: true
        });
        const moonMesh = new THREE.Mesh(moonGeo, moonMat);
        moonGroup.add(moonMesh);

        const moonLight = new THREE.DirectionalLight(0x88bbff, 0.5);
        moonLight.castShadow = true;
        moonLight.target = lightTarget;
        moonGroup.add(moonLight);

        function configureShadow(light) {
            light.shadow.mapSize.width = 2048;
            light.shadow.mapSize.height = 2048;
            light.shadow.camera.left = -8;
            light.shadow.camera.right = 8;
            light.shadow.camera.top = 8;
            light.shadow.camera.bottom = -8;
            light.shadow.bias = -0.001; 
        }
        configureShadow(sunLight);
        configureShadow(moonLight);

        // --- Stars ---
        const starCount = 150;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for(let i = 0; i < starCount * 3; i += 3) {
            const r = 12 + Math.random() * 6;
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            starPos[i] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i+1] = r * Math.sin(phi) * Math.sin(theta);
            starPos[i+2] = r * Math.cos(phi);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0, toneMapped: false });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // 5. Diorama Group
        const dioramaGroup = new THREE.Group();
        scene.add(dioramaGroup);

        // Materials
        const materials = {
            base: new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9, flatShading: true }),
            grass: new THREE.MeshStandardMaterial({ color: 0x5a9e48, roughness: 0.8, flatShading: true }),
            wood: new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9, flatShading: true }),
            leaves: new THREE.MeshStandardMaterial({ color: 0x3a793a, roughness: 0.8, flatShading: true }),
            houseWall: new THREE.MeshStandardMaterial({ color: 0xf5f5dc, roughness: 1.0, flatShading: true }),
            houseRoof: new THREE.MeshStandardMaterial({ color: 0x8b3a3a, roughness: 0.7, flatShading: true }),
            window: new THREE.MeshStandardMaterial({ color: 0xffeebb, roughness: 0.2, emissive: 0xffaa00, emissiveIntensity: 0 }),
            water: new THREE.MeshPhysicalMaterial({ 
                color: 0x44aaff, 
                transmission: 0.8,
                opacity: 1,
                metalness: 0.1,
                roughness: 0.2,
                ior: 1.3,
                thickness: 0.5,
                transparent: true,
            }),
            stone: new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8, flatShading: true }),
            cloud: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true, transparent: true, opacity: 0.9 }),
            smoke: new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 1, transparent: true, opacity: 0.6, flatShading: true })
        };

        // --- Base Terrain ---
        const topGeo = new THREE.CylinderGeometry(4.2, 4.2, 0.4, 64);
        const topGrass = new THREE.Mesh(topGeo, materials.grass);
        topGrass.position.y = 0.2;
        topGrass.receiveShadow = true;
        topGrass.castShadow = true;
        dioramaGroup.add(topGrass);

        const baseGeo = new THREE.CylinderGeometry(4.2, 3.5, 2, 64);
        const base = new THREE.Mesh(baseGeo, materials.base);
        base.position.y = -1.0;
        base.receiveShadow = true;
        base.castShadow = true;
        dioramaGroup.add(base);

        const hillGeo = new THREE.SphereGeometry(1.6, 16, 16);
        const hill = new THREE.Mesh(hillGeo, materials.grass);
        hill.position.set(1.8, 0.1, -1.2);
        hill.scale.set(1, 0.35, 1);
        hill.castShadow = true;
        hill.receiveShadow = true;
        dioramaGroup.add(hill);

        // --- House ---
        const houseGroup = new THREE.Group();
        houseGroup.position.set(-1.2, 0.4, -0.8);
        houseGroup.rotation.y = Math.PI / 5;

        const wallGeo = new THREE.BoxGeometry(1.6, 1.2, 1.3);
        const walls = new THREE.Mesh(wallGeo, materials.houseWall);
        walls.position.y = 0.6;
        walls.castShadow = true;
        walls.receiveShadow = true;
        houseGroup.add(walls);

        const roofGeo = new THREE.ConeGeometry(1.5, 1.3, 4);
        const roof = new THREE.Mesh(roofGeo, materials.houseRoof);
        roof.position.y = 1.85;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        roof.receiveShadow = true;
        houseGroup.add(roof);
        
        const chimneyGeo = new THREE.BoxGeometry(0.35, 0.9, 0.35);
        const chimney = new THREE.Mesh(chimneyGeo, materials.houseWall);
        chimney.position.set(-0.4, 1.7, 0);
        chimney.castShadow = true;
        chimney.receiveShadow = true;
        houseGroup.add(chimney);

        const windowGeo = new THREE.BoxGeometry(0.6, 0.4, 0.1);
        const windowMesh = new THREE.Mesh(windowGeo, materials.window);
        windowMesh.position.set(0, 0.7, 0.66);
        houseGroup.add(windowMesh);

        const houseLight = new THREE.PointLight(0xffa500, 0, 5); // Intensity controlled in loop
        houseLight.position.set(0, 0.7, 1.2);
        houseGroup.add(houseLight);

        dioramaGroup.add(houseGroup);

        // --- Stepping Stones ---
        for (let i = 0; i < 5; i++) {
            const stoneGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.05, 7);
            const stone = new THREE.Mesh(stoneGeo, materials.stone);
            stone.position.set(-0.6 + i * 0.5, 0.42, 0.6 + i * 0.6);
            stone.rotation.y = Math.random() * Math.PI;
            stone.castShadow = true;
            stone.receiveShadow = true;
            dioramaGroup.add(stone);
        }

        // --- Trees ---
        function createTree(x, z, scale = 1) {
            const tree = new THREE.Group();
            
            const trunkGeo = new THREE.CylinderGeometry(0.08, 0.14, 0.6, 6);
            const trunk = new THREE.Mesh(trunkGeo, materials.wood);
            trunk.position.y = 0.3;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            tree.add(trunk);

            const leavesGeo = new THREE.IcosahedronGeometry(0.5, 0);
            const leaves1 = new THREE.Mesh(leavesGeo, materials.leaves);
            leaves1.position.y = 0.8;
            leaves1.castShadow = true;
            leaves1.receiveShadow = true;
            tree.add(leaves1);

            const leaves2 = new THREE.Mesh(leavesGeo, materials.leaves);
            leaves2.position.set(0.25, 0.6, 0.25);
            leaves2.scale.set(0.7, 0.7, 0.7);
            leaves2.castShadow = true;
            leaves2.receiveShadow = true;
            tree.add(leaves2);

            const leaves3 = new THREE.Mesh(leavesGeo, materials.leaves);
            leaves3.position.set(-0.25, 0.6, -0.25);
            leaves3.scale.set(0.6, 0.6, 0.6);
            leaves3.castShadow = true;
            leaves3.receiveShadow = true;
            tree.add(leaves3);

            tree.position.set(x, 0.4, z);
            if (x > 0.5 && z < 0) tree.position.y = 0.6;
            
            tree.scale.set(scale, scale, scale);
            tree.rotation.y = Math.random() * Math.PI;
            dioramaGroup.add(tree);
        }

        createTree(2.2, -1.2, 1.2);
        createTree(1.3, -2.5, 0.85);
        createTree(2.6, 0.8, 1.0);
        createTree(-2.2, 2.3, 0.9);
        createTree(-3.0, 1.0, 1.1);

        // --- Rocks ---
        function createRock(x, z, scale = 1) {
            const rockGeo = new THREE.DodecahedronGeometry(0.2, 0);
            const rock = new THREE.Mesh(rockGeo, materials.stone);
            rock.position.set(x, 0.45, z);
            rock.scale.set(scale, scale * 0.7, scale * 1.2);
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            rock.castShadow = true;
            rock.receiveShadow = true;
            dioramaGroup.add(rock);
        }
        createRock(-2.5, -1.5, 1.2);
        createRock(-2.9, -1.1, 0.7);
        createRock(-2.2, -1.9, 1.5);
        createRock(1.2, 2.2, 0.9);
        createRock(1.6, 1.9, 0.6);

        // --- Pond ---
        const pondHoleGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.05, 16);
        const pondHoleMat = new THREE.MeshStandardMaterial({ color: 0x3d301f, roughness: 1 });
        const pondHole = new THREE.Mesh(pondHoleGeo, pondHoleMat);
        pondHole.position.set(-2, 0.38, -1.5);
        pondHole.receiveShadow = true;
        dioramaGroup.add(pondHole);

        const pondGeo = new THREE.CylinderGeometry(1.1, 1.1, 0.05, 16);
        const pond = new THREE.Mesh(pondGeo, materials.water);
        pond.position.set(-2, 0.41, -1.5);
        pond.receiveShadow = true;
        dioramaGroup.add(pond);

        // --- Clouds ---
        const clouds = [];
        function createCloud(x, y, z, scale) {
            const cloudGroup = new THREE.Group();
            
            const p1 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.6, 1), materials.cloud);
            p1.position.set(0, 0, 0);
            cloudGroup.add(p1);
            
            const p2 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4, 1), materials.cloud);
            p2.position.set(0.5, -0.1, 0.2);
            cloudGroup.add(p2);
            
            const p3 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.5, 1), materials.cloud);
            p3.position.set(-0.5, -0.05, -0.2);
            cloudGroup.add(p3);

            cloudGroup.position.set(x, y, z);
            cloudGroup.scale.set(scale, scale, scale);
            
            cloudGroup.children.forEach(c => {
                c.castShadow = true;
                c.receiveShadow = true;
            });

            dioramaGroup.add(cloudGroup);
            clouds.push({ 
                mesh: cloudGroup, 
                originX: x, 
                originY: y, 
                originZ: z,
                speed: 0.1 + Math.random() * 0.1 
            });
        }
        createCloud(3, 3.5, 2, 0.8);
        createCloud(-4, 4.5, -2, 0.9);
        createCloud(1, 4.0, -4, 1.1);

        // --- Smoke Particles ---
        const smokeParticles = [];
        const smokeCount = 12;
        for(let i=0; i<smokeCount; i++) {
            const smGeo = new THREE.IcosahedronGeometry(0.12, 0);
            const sm = new THREE.Mesh(smGeo, materials.smoke);
            sm.visible = false;
            houseGroup.add(sm);
            smokeParticles.push({
                mesh: sm,
                life: Math.random(),
                speed: 0.003 + Math.random() * 0.003,
                driftX: (Math.random() - 0.5) * 0.015,
                driftZ: (Math.random() - 0.5) * 0.015,
                driftY: 0.015 + Math.random() * 0.01
            });
        }

        // 6. Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8; // Nice and slow to watch the sun/moon orbit

        // 7. Resize Handler
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Variables for Day/Night logic
        let celestialTime = 0;
        const sunWorldPos = new THREE.Vector3();
        const moonWorldPos = new THREE.Vector3();

        // 8. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;
            
            // --- Day/Night Cycle Logic ---
            celestialTime += 0.008; // Speed of the day/night cycle
            celestialPivot.rotation.z = celestialTime;

            // Get absolute Y positions of Sun and Moon to drive lighting changes
            sunMesh.getWorldPosition(sunWorldPos);
            moonMesh.getWorldPosition(moonWorldPos);

            // dayRatio: 1 = Zenith (High Noon), 0 = Midnight.
            // Transition happens between Y = -2 and Y = +2 to create a sunset/sunrise phase
            const dayRatio = Math.max(0, Math.min(1, (sunWorldPos.y + 2) / 4)); 
            const moonRatio = Math.max(0, Math.min(1, (moonWorldPos.y + 2) / 4));

            // Sky / Ambient Colors
            const daySky = new THREE.Color(0x88bbff);
            const nightSky = new THREE.Color(0x0a1526);
            const dayGround = new THREE.Color(0x443322);
            const nightGround = new THREE.Color(0x050a12);
            
            hemiLight.color.lerpColors(nightSky, daySky, dayRatio);
            hemiLight.groundColor.lerpColors(nightGround, dayGround, dayRatio);
            hemiLight.intensity = 0.3 + dayRatio * 0.4;

            // Sun color transition (Sunset/Sunrise effect)
            // 1 at zenith (8), 0 at horizon (0)
            const sunHeightRatio = Math.max(0, Math.min(1, sunWorldPos.y / 8));
            const horizonColor = new THREE.Color(0xff5500);
            const zenithColor = new THREE.Color(0xfffaed);
            sunLight.color.lerpColors(horizonColor, zenithColor, sunHeightRatio);
            sunMesh.material.emissive.copy(sunLight.color);
            sunMesh.material.emissiveIntensity = 1 + sunHeightRatio; // Brighter at noon

            // Light intensities (fade out when below horizon)
            sunLight.intensity = dayRatio * 1.6;
            moonLight.intensity = moonRatio * 0.8;

            // Turn on House Lights & Stars at night!
            materials.window.emissiveIntensity = (1 - dayRatio) * 2.5;
            houseLight.intensity = (1 - dayRatio) * 3.5;
            starMat.opacity = (1 - dayRatio) * 0.8;
            stars.rotation.y = time * 0.05;

            // --- Object Animations ---
            dioramaGroup.position.y = Math.sin(time * 1.5) * 0.12;

            pond.position.y = 0.41 + Math.sin(time * 2.5) * 0.015;
            pond.scale.set(1 + Math.sin(time * 2)*0.02, 1, 1 + Math.cos(time * 2.2)*0.02);

            clouds.forEach((cloud, index) => {
                cloud.mesh.position.y = cloud.originY + Math.sin(time + index) * 0.15;
                const angle = time * cloud.speed * 0.5;
                cloud.mesh.position.x = cloud.originX + Math.cos(angle) * 0.5;
                cloud.mesh.position.z = cloud.originZ + Math.sin(angle) * 0.5;
                cloud.mesh.rotation.y = Math.sin(time * 0.5) * 0.2;
            });

            smokeParticles.forEach((sp) => {
                sp.life += sp.speed;
                if(sp.life > 1.0) {
                    sp.life = 0;
                    sp.mesh.position.set(-0.4, 2.15, 0); 
                    sp.mesh.scale.set(1, 1, 1);
                    sp.mesh.visible = true;
                    sp.mesh.rotation.set(Math.random(), Math.random(), Math.random());
                }
                if(sp.mesh.visible) {
                    sp.mesh.position.y += sp.driftY;
                    sp.mesh.position.x += sp.driftX;
                    sp.mesh.position.z += sp.driftZ;
                    sp.mesh.rotation.x += 0.01;
                    sp.mesh.rotation.y += 0.01;
                    const scale = Math.max(0, 1.0 - sp.life);
                    sp.mesh.scale.set(scale, scale, scale);
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
