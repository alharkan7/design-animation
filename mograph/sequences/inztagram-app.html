<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inztagram App Sequence</title>
  <style>
    :root {
      --bg: #f8fafc;
      --fg: #0f172a;
      --card: #ffffff;
      --border: #e2e8f0;
      --primary: #3b82f6;
    }
    body {
      margin: 0; padding: 0; overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      width: 100vw; height: 100vh;
      background-color: var(--bg);
      color: var(--fg);
      font-size: min(1.3vw, 2.2vh); 
    }
    .sequence-container {
      position: relative; width: 100vw; height: 100vh;
      perspective: 150vw;
      transform-style: preserve-3d;
    }
    
    /* Background effects */
    .bg-orbs {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
    }
    .orb-1 { position: absolute; top: -20%; left: -10%; width: 50%; height: 50%; border-radius: 50%; background: rgba(99, 102, 241, 0.15); filter: blur(10vw); mix-blend-mode: multiply; }
    .orb-2 { position: absolute; bottom: -20%; right: -10%; width: 60%; height: 60%; border-radius: 50%; background: rgba(59, 130, 246, 0.15); filter: blur(12vw); mix-blend-mode: multiply; }
    .orb-3 { position: absolute; top: 20%; right: 10%; width: 30%; height: 30%; border-radius: 50%; background: rgba(6, 182, 212, 0.1); filter: blur(8vw); mix-blend-mode: multiply; }
    .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(0,0,0,0.03) 0.1em, transparent 0.1em), linear-gradient(to bottom, rgba(0,0,0,0.03) 0.1em, transparent 0.1em); background-size: 2.5em 2.5em; }
    
    /* App Frame */
    .app-frame {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      background: var(--bg);
      transform-origin: center center;
      animation: flyInUI 3.2s forwards;
      overflow: hidden;
      /* Initial hidden state */
      opacity: 0;
    }
    
    @keyframes flyInUI {
      0% {
        transform: translate3d(120vw, 120vh, -150vw) rotateX(60deg) rotateZ(-45deg) scale(0.2);
        opacity: 0;
        border-radius: 6em;
        box-shadow: 0 0 0 0.2em rgba(148, 163, 184, 0.4), -15em 15em 30em rgba(0,0,0,0.1);
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      40% {
        transform: translate3d(0, 0, -40vw) rotateX(60deg) rotateZ(-45deg) scale(0.65);
        opacity: 1;
        border-radius: 4em;
        box-shadow: 0 0 0 0.2em rgba(148, 163, 184, 0.4), -5em 5em 15em rgba(0,0,0,0.15);
        animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      }
      80%, 100% {
        transform: translate3d(0, 0, 0) rotateX(0deg) rotateZ(0deg) scale(1);
        opacity: 1;
        border-radius: 0;
        box-shadow: 0 0 0 0 rgba(148, 163, 184, 0), 0 0 0 rgba(0,0,0,0);
      }
    }

    /* Camera Animation */
    .camera {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      animation: camMove 11s forwards;
    }
    @keyframes camMove {
      0%, 36% {
        transform: scale(1) translate(0, 0);
        animation-timing-function: cubic-bezier(0.76, 0, 0.24, 1);
      }
      45% {
        transform: scale(2.2) translate(28vw, -4vh);
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      73% {
        transform: scale(2.2) translate(-5vw, -4vh);
        animation-timing-function: cubic-bezier(0.76, 0, 0.24, 1);
      }
      86%, 100% {
        transform: scale(2.8) translate(28vw, -10vh);
      }
    }
    
    /* Typing Animation */
    #fake-textarea {
      display: block; box-sizing: border-box; white-space: nowrap; overflow: hidden;
    }
    .typewriter-text {
      display: inline-block; position: relative;
      white-space: nowrap;
    }
    .typewriter-text::before {
      content: "System architecture for a scalable realtime chat app";
    }
    .typewriter-text::after {
      content: ""; position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: var(--card);
      border-left: 0.15em solid var(--primary);
      margin-left: -0.1em;
      animation: revealText 3s steps(52) 5s forwards, blinkCover 0.8s 20 forwards;
    }
    @keyframes revealText {
      from { left: 0; }
      to { left: 100%; }
    }
    @keyframes blinkCover {
      0%, 100% { border-left-color: var(--primary); }
      50% { border-left-color: transparent; }
    }

    /* Mode Toggle Animation */
    #mode-mermaid {
      color: #ffffff;
      animation: colorOff 0.3s ease 9.5s forwards;
    }
    #mode-freeform {
      color: #64748b;
      animation: colorOn 0.3s ease 9.5s forwards;
    }
    @keyframes colorOff {
      to { color: #64748b; }
    }
    @keyframes colorOn {
      to { color: #ffffff; }
    }
    @keyframes slideSwitch {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* Layouts Overlay */
    .layouts-overlay {
      position: absolute; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(248, 250, 252, 0.85); backdrop-filter: blur(30px);
      opacity: 0; visibility: hidden;
      animation: overlayVisibility 4.5s 10.5s forwards;
    }
    @keyframes overlayVisibility {
      0% { opacity: 0; visibility: hidden; }
      10%, 100% { opacity: 1; visibility: visible; }
    }
    .layouts-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5em;
      width: 35em; max-width: 90vw;
      transform: translateY(120vh);
      animation: trainScroll 4.5s 10.5s forwards;
    }
    @keyframes trainScroll {
      0% {
        transform: translateY(120vh);
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      25% {
        transform: translateY(25vh);
        animation-timing-function: cubic-bezier(0.4, 0.1, 0.6, 0.9);
      }
      80% {
        transform: translateY(-40vh);
        animation-timing-function: cubic-bezier(0.7, 0, 1, 0.4);
      }
      100% {
        transform: translateY(-200vh);
      }
    }
    .layout-card {
      background: #ffffff; border: 0.1em solid var(--border); border-radius: 1em;
      padding: 1.5em; box-shadow: 0 1em 2em rgba(0,0,0,0.05);
      display: flex; flex-direction: column; align-items: center; gap: 1em;
    }
    .layout-card svg {
      width: 100%; height: auto; border-radius: 0.5em;
    }
    .layout-card span {
      font-size: 1.2em; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    }

    /* Page Home */
    .page-home {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10;
    }
    
    .hero { text-align: center; }
    .hero-title {
      font-size: 5em; font-weight: 800; margin: 0; letter-spacing: -0.02em;
      color: var(--fg);
    }
    
    .input-wrapper {
      margin-top: 3em; position: relative; width: 50em; max-width: 90vw;
    }
    .input-glow {
      position: absolute; inset: -1em;
      background: linear-gradient(to right, rgba(99,102,241,0.15), rgba(6,182,212,0.15));
      border-radius: 2em; filter: blur(30px); z-index: -1;
    }
    .input-box {
      background: var(--card); border: 0.1em solid var(--border);
      border-radius: 1.5em; padding: 1.5em;
      display: flex; flex-direction: column; gap: 1em;
      box-shadow: 0 1em 3em rgba(0,0,0,0.05);
    }
    .input-textarea {
      width: 100%; height: 6em; background: transparent; border: none;
      color: #0f172a; font-size: 1.1em; outline: none; resize: none;
      font-family: inherit; line-height: 1.5;
    }
    .input-actions {
      display: flex; justify-content: space-between; align-items: center;
    }
    .mode-switch {
      display: flex; background: #f1f5f9; border-radius: 2em; padding: 0.3em; box-shadow: inset 0 0.1em 0.2em rgba(0,0,0,0.05);
      position: relative; z-index: 1;
    }
    .mode-switch::before {
      content: ""; position: absolute; top: 0.3em; bottom: 0.3em; right: 0.3em;
      width: calc(50% - 0.3em);
      background: #0f172a; background-image: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-radius: 1.5em; border: 0.05em solid #334155; box-sizing: border-box;
      box-shadow: 0 0.2em 0.5em rgba(0, 0, 0, 0.15), inset 0 0.05em 0.1em rgba(255, 255, 255, 0.15);
      z-index: -1;
      animation: slideSwitch 0.4s cubic-bezier(0.76, 0, 0.24, 1) 9.5s forwards;
    }
    .mode-btn {
      flex: 1; text-align: center;
      padding: 0.6em 1.2em; font-size: 0.95em; font-weight: 600;
      color: #64748b; letter-spacing: 0.02em; position: relative; z-index: 1;
    }
    .btn-send {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff; 
      padding: 0.8em 2.4em;
      border-radius: 2em; 
      font-weight: 600; 
      font-size: 1em;
      letter-spacing: 0.02em;
      border: 0.05em solid #334155;
      box-shadow: 0 0.5em 1em -0.2em rgba(0, 0, 0, 0.15), inset 0 0.05em 0.1em rgba(255, 255, 255, 0.15);
    }
    
    /* Page Detail */
    .page-detail {
      position: absolute; inset: 0; padding-top: 2em; padding-bottom: 3.5em;
      display: flex; visibility: hidden; opacity: 0; z-index: 5;
    }
    
    .detail-layout {
      display: flex; width: 100%; height: 100%; padding: 1em; gap: 1em;
      box-sizing: border-box; max-width: 1600px; margin: 0 auto;
    }
    
    .diagram-area {
      flex: 1; background: var(--card); border: 0.1em solid var(--border);
      border-radius: 1em; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1em 2em rgba(0,0,0,0.02);
    }
    
    .chat-sidebar {
      width: 25em; background: rgba(255, 255, 255, 0.8); border: 0.1em solid var(--border); backdrop-filter: blur(20px);
      border-radius: 1em; display: flex; flex-direction: column;
      box-shadow: 0 1em 2em rgba(0,0,0,0.02);
    }
    .chat-messages {
      flex: 1; padding: 1.5em; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5em;
    }
    .chat-input {
      padding: 1em; border-top: 0.1em solid var(--border); background: var(--card); border-radius: 0 0 1em 1em;
    }
    .chat-input-box {
      background: rgba(0,0,0,0.02); border: 0.1em solid var(--border);
      border-radius: 0.5em; padding: 0.8em; display: flex; gap: 0.5em; align-items: center;
    }
    .chat-input-box input {
      flex: 1; background: transparent; border: none; color: #0f172a; outline: none; font-size: 0.9em;
    }
    
    .msg-user {
      align-self: flex-end; background: #e2e8f0; color: #0f172a;
      padding: 0.8em 1.2em; border-radius: 1em 1em 0 1em; font-size: 0.9em; max-width: 85%; line-height: 1.4;
    }
    .msg-ai {
      align-self: flex-start; color: #334155;
      padding: 0; font-size: 0.9em; max-width: 85%; line-height: 1.4;
    }
    
    @media (max-aspect-ratio: 1/1) {
      body { font-size: 2.2vw; }
      .input-wrapper { width: 90vw; }
      .detail-layout { flex-direction: column; }
      .chat-sidebar { width: 100%; height: 35vh; }
      .hero-title { font-size: 4em; }
      
      .layouts-grid { width: 90vw; gap: 1em; }
    }

  </style>
</head>
