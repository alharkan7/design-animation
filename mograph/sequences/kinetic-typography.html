<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Kinetic Typography - Light Mode</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Space+Grotesk:wght@900&display=swap');

  :root {
    --bg: #ffffff;
    --text: #090e17;
    --accent: #FF3366;
    --accent2: #4361EE;
    --grid: #e2e8f0;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    color: var(--text);
  }

  /* GLOBAL & BACKGROUND */
  .grid-bg {
    position: absolute;
    inset: -50%;
    background-image: 
      linear-gradient(to right, var(--grid) 2px, transparent 2px),
      linear-gradient(to bottom, var(--grid) 2px, transparent 2px);
    background-size: 8vmin 8vmin;
    animation: 
      gridIn 1.5s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both,
      exitScaleDown 0.6s 11.5s cubic-bezier(0.76, 0, 0.24, 1) forwards;
  }
  
  @keyframes gridIn {
    0% { transform: scale(0) rotate(-15deg); }
    100% { transform: scale(1) rotate(0); }
  }

  @keyframes exitScaleDown {
    0% { transform: scale(1); }
    100% { transform: scale(0); }
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .word {
    font-weight: 900;
    text-transform: uppercase;
    will-change: transform;
    line-height: 1;
  }

  .word-container {
    position: absolute;
    overflow: hidden;
    padding: 0.1em;
    margin: -0.1em;
  }

  .ui-accent {
    position: absolute;
  }

  /* ================= STAGE 1 ================= */
  .stage-1 {
    animation: stageOutLeft 0.6s 3.5s cubic-bezier(0.76, 0, 0.24, 1) forwards;
  }
  @keyframes stageOutLeft {
    0% { transform: translateX(0); }
    100% { transform: translateX(-150vw); }
  }

  .s1-wc-1 { top: 15%; left: 8%; }
  .s1-word-1 {
    font-size: clamp(6rem, 16vw, 14rem);
    color: var(--text);
    animation: slideUpFloor 0.8s 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .s1-wc-2 { top: 35%; right: 5%; }
  .s1-word-2 {
    font-size: clamp(8rem, 22vw, 18rem);
    color: transparent;
    -webkit-text-stroke: 4px var(--accent);
    animation: slideRightFloor 0.8s 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .s1-word-3 {
    position: absolute;
    bottom: 25%;
    left: 12%;
    font-size: clamp(4rem, 10vw, 8rem);
    letter-spacing: -0.05em;
    animation: popInKerning 1.2s 1.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* Burst */
  .s1-burst {
    position: absolute;
    top: 45%; right: 25%;
    width: 0; height: 0;
  }
  .burst-line {
    position: absolute;
    width: 8px; height: 100px;
    background: var(--accent);
    transform-origin: bottom center;
    bottom: 0; left: -4px;
  }
  .bl-1 { --rot: 0deg; animation: burstFire 0.8s 1.1s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .bl-2 { --rot: 45deg; animation: burstFire 0.8s 1.15s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .bl-3 { --rot: 90deg; animation: burstFire 0.8s 1.2s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .bl-4 { --rot: 135deg; animation: burstFire 0.8s 1.25s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .bl-5 { --rot: 180deg; animation: burstFire 0.8s 1.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .bl-6 { --rot: 225deg; animation: burstFire 0.8s 1.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .bl-7 { --rot: 270deg; animation: burstFire 0.8s 1.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .bl-8 { --rot: 315deg; animation: burstFire 0.8s 1.45s cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* Accents */
  .s1-data-bar {
    height: 6px; width: 25vw;
    background: var(--text);
    top: 8%; left: 8%;
    transform-origin: left center;
    animation: scaleXIn 1s 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .s1-crosshair {
    width: 60px; height: 60px;
    bottom: 8%; left: 8%;
    border: 3px solid var(--grid);
    border-radius: 50%;
    background: transparent;
    animation: scaleIn 1s 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .s1-crosshair::before, .s1-crosshair::after {
    content: ''; position: absolute; background: var(--text);
  }
  .s1-crosshair::before { width: 100%; height: 3px; top: 50%; left: 0; transform: translateY(-50%); }
  .s1-crosshair::after { width: 3px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }


  /* ================= STAGE 2 ================= */
  .stage-2 {
    animation: 
      stageInRight 0.8s 3.3s cubic-bezier(0.76, 0, 0.24, 1) both,
      stageOutUp 0.6s 7.5s cubic-bezier(0.76, 0, 0.24, 1) forwards;
  }
  @keyframes stageInRight {
    0% { transform: translateX(150vw); }
    100% { transform: translateX(0); }
  }
  @keyframes stageOutUp {
    0% { transform: translateY(0); }
    100% { transform: translateY(-150vh); }
  }

  .s2-marquee-group {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2vh;
    z-index: 0;
  }
  .marquee {
    display: flex;
    white-space: nowrap;
    font-size: clamp(10rem, 25vw, 20rem);
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    color: transparent;
    -webkit-text-stroke: 3px var(--grid);
    line-height: 0.8;
  }
  .m1 { animation: scrollLeft 4.5s 3.3s linear both; }
  .m2 { animation: scrollRight 4.5s 3.3s linear both; }
  .m3 { animation: scrollLeft2 4.5s 3.3s linear both; }

  @keyframes scrollLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-30vw); } }
  @keyframes scrollRight { 0% { transform: translateX(-30vw); } 100% { transform: translateX(0); } }
  @keyframes scrollLeft2 { 0% { transform: translateX(-10vw); } 100% { transform: translateX(-40vw); } }

  .s2-center-text {
    position: absolute;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  
  .s2-wc-1 { position: relative; overflow: hidden; }
  .s2-word-1 {
    font-size: clamp(4rem, 8vw, 6rem);
    color: var(--accent2);
    animation: slideDownFloor 0.6s 4.0s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  
  .s2-wc-2 { position: relative; overflow: hidden; margin-top: -0.2em; }
  .s2-word-2 {
    font-size: clamp(6rem, 16vw, 14rem);
    color: var(--text);
    animation: slideUpFloor 0.8s 4.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .s2-circle {
    width: 30vmin; height: 30vmin;
    border-radius: 50%;
    border: 4px solid var(--accent);
    top: 20%; left: 15%;
    animation: scaleIn 0.8s 4.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .s2-line {
    width: 4px; height: 40vh;
    background: var(--text);
    bottom: 0; right: 20%;
    transform-origin: bottom center;
    animation: scaleYIn 0.6s 4.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }


  /* ================= STAGE 3 ================= */
  .stage-3 {
    animation: 
      stageInUp 0.8s 7.3s cubic-bezier(0.76, 0, 0.24, 1) both,
      exitScaleDown 0.6s 11.5s cubic-bezier(0.76, 0, 0.24, 1) forwards;
  }
  @keyframes stageInUp {
    0% { transform: translateY(150vh); }
    100% { transform: translateY(0); }
  }

  .s3-container {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.1em;
    z-index: 10;
  }
  
  .s3-wc-1 { position: relative; margin-left: -20vw; overflow: hidden; }
  .s3-word-1 { font-size: clamp(4rem, 10vw, 8rem); color: var(--text); animation: slideUpFloor 0.6s 8.0s cubic-bezier(0.16, 1, 0.3, 1) both; }
  
  .s3-wc-2 { position: relative; margin-left: -10vw; overflow: hidden; }
  .s3-word-2 { font-size: clamp(4rem, 10vw, 8rem); color: var(--text); animation: slideUpFloor 0.6s 8.15s cubic-bezier(0.16, 1, 0.3, 1) both; }
  
  .s3-wc-3 { position: relative; margin-left: 0; overflow: hidden; }
  .s3-word-3 { font-size: clamp(4rem, 10vw, 8rem); color: var(--accent); animation: slideUpFloor 0.6s 8.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
  
  .s3-wc-4 { 
    position: relative; 
    margin-left: 10vw; 
    animation: scaleIn 0.8s 8.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .s3-wc-4 .marker-sweep {
    position: absolute;
    top: -5%; left: -2%;
    width: 104%; height: 110%;
    background: var(--text);
    transform-origin: left center;
    animation: sweepIn 0.6s 9.2s cubic-bezier(0.76, 0, 0.24, 1) both;
    z-index: -1;
  }
  .s3-word-4 {
    font-size: clamp(5rem, 12vw, 10rem);
    color: var(--bg);
    position: relative; z-index: 1; padding: 0 0.05em;
  }
  .s3-wc-4 .karaoke-text {
    position: absolute; top: 0; left: 0;
    color: var(--accent2);
    clip-path: inset(0 100% 0 0);
    animation: karaokeReveal 0.6s 9.5s cubic-bezier(0.76, 0, 0.24, 1) both;
  }

  .s3-bracket-left, .s3-bracket-right {
    position: absolute;
    width: 10vw; height: 50vh;
    border: 8px solid var(--grid);
    top: 25%;
  }
  .s3-bracket-left {
    left: 5%; border-right: none;
    transform-origin: left center;
    animation: scaleXIn 0.8s 7.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .s3-bracket-right {
    right: 5%; border-left: none;
    transform-origin: right center;
    animation: scaleXIn 0.8s 7.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }


  /* ================= COMMON ANIMATIONS ================= */
  @keyframes slideUpFloor { 0% { transform: translateY(120%); } 100% { transform: translateY(0); } }
  @keyframes slideDownFloor { 0% { transform: translateY(-120%); } 100% { transform: translateY(0); } }
  @keyframes slideRightFloor { 0% { transform: translateX(-120%); } 100% { transform: translateX(0); } }
  
  @keyframes popInKerning {
    0% { transform: scale(0) rotate(5deg); letter-spacing: -0.2em; }
    40% { transform: scale(1.1) rotate(-2deg); letter-spacing: 0.1em; }
    100% { transform: scale(1) rotate(0); letter-spacing: -0.05em; }
  }
  
  @keyframes scaleXIn { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
  @keyframes scaleYIn { 0% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
  @keyframes scaleIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  
  @keyframes sweepIn { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
  
  @keyframes karaokeReveal { 0% { clip-path: inset(0 100% 0 0); } 100% { clip-path: inset(0 0 0 0); } }
  
  @keyframes burstFire {
    0% { transform: rotate(var(--rot)) translateY(-60px) scaleY(0); }
    40% { transform: rotate(var(--rot)) translateY(-120px) scaleY(1); }
    100% { transform: rotate(var(--rot)) translateY(-180px) scaleY(0); }
  }

</style>
</head>
<body>
  <div class="grid-bg"></div>
  
  <div class="scene">
    <!-- STAGE 1 -->
    <div class="stage stage-1">
      <div class="ui-accent s1-data-bar"></div>
      <div class="ui-accent s1-crosshair"></div>
      
      <div class="word-container s1-wc-1">
        <div class="word s1-word-1">SHIP</div>
      </div>
      
      <div class="s1-burst">
        <div class="burst-line bl-1"></div>
        <div class="burst-line bl-2"></div>
        <div class="burst-line bl-3"></div>
        <div class="burst-line bl-4"></div>
        <div class="burst-line bl-5"></div>
        <div class="burst-line bl-6"></div>
        <div class="burst-line bl-7"></div>
        <div class="burst-line bl-8"></div>
      </div>
      
      <div class="word-container s1-wc-2">
        <div class="word s1-word-2">FASTER</div>
      </div>
      
      <div class="word s1-word-3">THAN EVER</div>
    </div>

    <!-- STAGE 2 -->
    <div class="stage stage-2">
      <div class="s2-marquee-group">
        <div class="marquee m1"><span>DISRUPT </span><span>DISRUPT </span><span>DISRUPT </span></div>
        <div class="marquee m2"><span>DISRUPT </span><span>DISRUPT </span><span>DISRUPT </span></div>
        <div class="marquee m3"><span>DISRUPT </span><span>DISRUPT </span><span>DISRUPT </span></div>
      </div>
      
      <div class="s2-center-text">
        <div class="word-container s2-wc-1">
          <div class="word s2-word-1">THE</div>
        </div>
        <div class="word-container s2-wc-2">
          <div class="word s2-word-2">INDUSTRY</div>
        </div>
      </div>

      <div class="ui-accent s2-circle"></div>
      <div class="ui-accent s2-line"></div>
    </div>

    <!-- STAGE 3 -->
    <div class="stage stage-3">
      <div class="ui-accent s3-bracket-left"></div>
      <div class="ui-accent s3-bracket-right"></div>
      
      <div class="s3-container">
        <div class="word-container s3-wc-1">
          <div class="word s3-word-1">BUILD</div>
        </div>
        <div class="word-container s3-wc-2">
          <div class="word s3-word-2">WITH</div>
        </div>
        <div class="word-container s3-wc-3">
          <div class="word s3-word-3">UNLIMITED</div>
        </div>
        
        <div class="s3-wc-4">
          <div class="marker-sweep"></div>
          <div class="word s3-word-4">SCALE</div>
          <div class="word s3-word-4 karaoke-text">SCALE</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
