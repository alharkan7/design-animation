<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Layered Architecture Core</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap');

    :root {
      --c-text: #0f172a;
      --c-text-muted: #64748b;
    }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background: transparent;
    }

    .scene {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      perspective: 2500px;
    }

    .camera {
      position: relative;
      transform-style: preserve-3d;
      animation: ambientPan 12s ease-in-out both;
      transform: translateY(2vmin);
    }
    @keyframes ambientPan {
      0% { transform: translateY(2vmin) rotateZ(0deg); }
      100% { transform: translateY(0vmin) rotateZ(2deg); }
    }

    .tilt-wrapper {
      position: relative;
      width: 40vmin; height: 40vmin;
      transform-style: preserve-3d;
      transform: rotateX(60deg) rotateZ(-45deg);
      animation: sceneOut 1s 11.5s cubic-bezier(0.76, 0, 0.24, 1) forwards;
    }

    @keyframes sceneOut {
      0% { transform: rotateX(60deg) rotateZ(-45deg) scale(1) translateZ(0); }
      100% { transform: rotateX(60deg) rotateZ(-45deg) scale(0) translateZ(50vmin); }
    }

    .cake-layer {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
    }

    /* Colors for each band of the cake */
    .layer-1 { --c-top: #3b82f6; --c-side-curved-light: #2563eb; --c-side-curved-dark: #1e3a8a; --c-side-cut-x: #1d4ed8; --c-side-cut-y: #1e40af; animation: l1Enter 1.2s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both, l1Exit 0.8s 10s forwards; }
    .layer-2 { --c-top: #8b5cf6; --c-side-curved-light: #7c3aed; --c-side-curved-dark: #4c1d95; --c-side-cut-x: #6d28d9; --c-side-cut-y: #5b21b6; animation: l2Enter 1.2s 0.7s cubic-bezier(0.16, 1, 0.3, 1) both, l2Exit 0.8s 9.8s forwards; }
    .layer-3 { --c-top: #10b981; --c-side-curved-light: #059669; --c-side-curved-dark: #064e3b; --c-side-cut-x: #047857; --c-side-cut-y: #065f46; animation: l3Enter 1.2s 0.9s cubic-bezier(0.16, 1, 0.3, 1) both, l3Exit 0.8s 9.6s forwards; }
    .layer-4 { --c-top: #f59e0b; --c-side-curved-light: #d97706; --c-side-curved-dark: #7c2d12; --c-side-cut-x: #b45309; --c-side-cut-y: #92400e; animation: l4Enter 1.2s 1.1s cubic-bezier(0.16, 1, 0.3, 1) both, l4Exit 0.8s 9.4s forwards; }

    /* 
      CRITICAL 3D FIX: DO NOT animate 'opacity' on elements that need to preserve-3d.
      Opacity creates a stacking context which forcefully flattens all 3D children into a single 2D plane!
      We use purely scale and translate to pop the layers in, preserving perfect 3D depth.
    */
    @keyframes l1Enter { 0% { transform: translateZ(-20vmin) scale(0); } 100% { transform: translateZ(0vmin) scale(1); } }
    @keyframes l1Exit { 0% { transform: translateZ(0vmin) scale(1); } 100% { transform: translateZ(20vmin) scale(0); } }
    @keyframes l2Enter { 0% { transform: translateZ(-15vmin) scale(0); } 100% { transform: translateZ(5vmin) scale(1); } }
    @keyframes l2Exit { 0% { transform: translateZ(5vmin) scale(1); } 100% { transform: translateZ(25vmin) scale(0); } }
    @keyframes l3Enter { 0% { transform: translateZ(-10vmin) scale(0); } 100% { transform: translateZ(10vmin) scale(1); } }
    @keyframes l3Exit { 0% { transform: translateZ(10vmin) scale(1); } 100% { transform: translateZ(30vmin) scale(0); } }
    @keyframes l4Enter { 0% { transform: translateZ(-5vmin) scale(0); } 100% { transform: translateZ(15vmin) scale(1); } }
    @keyframes l4Exit { 0% { transform: translateZ(15vmin) scale(1); } 100% { transform: translateZ(35vmin) scale(0); } }

    /* The stacked slices that form the true 3D volume */
    .slice {
      position: absolute; inset: 0;
      border-radius: 50%;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 100%, 50% 50%, 0 50%);
      background: linear-gradient(135deg, var(--c-side-curved-light), var(--c-side-curved-dark));
      transform: translateZ(calc(var(--i) * 0.25vmin));
      transform-style: preserve-3d;
    }
    
    .slice.top-slice {
      background-color: var(--c-top);
      background-image: 
        linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 4vmin 4vmin;
    }

    /* Explicit 3D planes to cover the inner cut perfectly smoothly */
    .wall-cut-x { position: absolute; width: 5.25vmin; height: 20.1vmin; left: 19.9vmin; top: 19.9vmin; transform-origin: left center; transform: rotateY(-90deg); background: var(--c-side-cut-x); }
    .wall-cut-y { position: absolute; width: 20.1vmin; height: 5.25vmin; left: -0.1vmin; top: 14.85vmin; transform-origin: bottom center; transform: rotateX(-90deg); background: var(--c-side-cut-y); }

    /* Decor inside Top Faces */
    .db-node { position: absolute; width: 4vmin; height: 4vmin; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); }
    .cpu-chip { position: absolute; left: 22vmin; top: 5vmin; width: 10vmin; height: 10vmin; background: rgba(0,0,0,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 1vmin; }
    .cpu-core { position: absolute; inset: 2vmin; background: rgba(255,255,255,0.25); border-radius: 0.5vmin; }
    .bar-chart { position: absolute; left: 20vmin; top: 4vmin; width: 15vmin; height: 12vmin; display: flex; align-items: flex-end; gap: 1vmin; }
    .mini-bar { flex: 1; background: rgba(255,255,255,0.4); border-top-left-radius: 0.5vmin; border-top-right-radius: 0.5vmin; }
    .ui-window { position: absolute; left: 12vmin; top: 4vmin; width: 22vmin; height: 14vmin; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 1vmin; padding: 1.5vmin; display: flex; flex-direction: column; gap: 1.2vmin; box-sizing: border-box; }
    .ui-header { height: 2vmin; width: 50%; background: rgba(255,255,255,0.4); border-radius: 0.5vmin; }
    .ui-line { height: 1vmin; width: 100%; background: rgba(255,255,255,0.25); border-radius: 0.5vmin; }
    .ui-line.short { width: 70%; }

    /* 
       Decoupled Labels 
       Placed directly in tilt-wrapper so they are not affected by layer scaling.
       Counter-rotated to face the camera perfectly.
    */
    .label-anchor-3d {
      position: absolute;
      left: 34.14vmin; top: 34.14vmin; /* Mathematically exact screen-right silhouette tangent */
      transform-style: preserve-3d;
    }
    
    /* SVG Leader Lines */
    .leader-svg {
      position: absolute;
      left: 0; top: 0;
      width: 100vmin; height: 100vmin;
      overflow: visible;
      pointer-events: none;
    }
    .leader-path {
      fill: none;
      stroke: var(--c-text);
      stroke-width: 0.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: drawPath 0.6s var(--delay) cubic-bezier(0.16, 1, 0.3, 1) both,
                 fadeLabelOut 0.4s 9.0s forwards;
    }

    .label-dot {
      position: absolute;
      left: 19.25vmin; /* Positioned at the end of the 20vmin line */
      width: 1.5vmin; height: 1.5vmin;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      animation: dotPop 0.4s calc(var(--delay) + 0.5s) cubic-bezier(0.34, 1.56, 0.64, 1) both,
                 fadeLabelOut 0.4s 9.0s forwards;
    }
    
    .label-2d {
      position: absolute;
      left: 21.5vmin; /* A neat gap from the end of the 20vmin line */
      width: max-content;
      display: flex; flex-direction: column; justify-content: center;
      animation: fadeLabelIn 0.4s calc(var(--delay) + 0.3s) both,
                 fadeLabelOut 0.4s 9.0s forwards;
    }

    .label-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.4vmin; color: var(--c-text-muted); font-weight: 700; letter-spacing: 0.15em; line-height: 1; }
    .label-value { font-size: 3vmin; font-weight: 700; color: var(--c-text); margin-top: 0.6vmin; line-height: 1; }

    @keyframes drawPath { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
    @keyframes dotPop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes fadeLabelIn { 0% { opacity: 0; transform: translateX(-2vmin); } 100% { opacity: 1; transform: translateX(0); } }
    @keyframes fadeLabelOut { 0% { opacity: 1; } 100% { opacity: 0; } }

  </style>
</head>
<body>
  <div class="scene">
    <div class="camera">
      <div class="tilt-wrapper">
        
        <!-- LAYER 1 (Storage) -->
        <div class="cake-layer layer-1">
          <div class="slice" style="--i:0"></div><div class="slice" style="--i:1"></div><div class="slice" style="--i:2"></div><div class="slice" style="--i:3"></div><div class="slice" style="--i:4"></div><div class="slice" style="--i:5"></div><div class="slice" style="--i:6"></div><div class="slice" style="--i:7"></div><div class="slice" style="--i:8"></div><div class="slice" style="--i:9"></div><div class="slice" style="--i:10"></div><div class="slice" style="--i:11"></div><div class="slice" style="--i:12"></div><div class="slice" style="--i:13"></div><div class="slice" style="--i:14"></div><div class="slice" style="--i:15"></div><div class="slice" style="--i:16"></div><div class="slice" style="--i:17"></div><div class="slice" style="--i:18"></div><div class="slice" style="--i:19"></div>
          <div class="slice top-slice" style="--i:20">
            <div class="db-node" style="left:25vmin; top:5vmin;"></div>
            <div class="db-node" style="left:32vmin; top:5vmin;"></div>
            <div class="db-node" style="left:25vmin; top:12vmin;"></div>
            <div class="db-node" style="left:32vmin; top:12vmin;"></div>
          </div>
          <div class="wall-cut-x"></div>
          <div class="wall-cut-y"></div>
        </div>

        <!-- LAYER 2 (Compute) -->
        <div class="cake-layer layer-2">
          <div class="slice" style="--i:0"></div><div class="slice" style="--i:1"></div><div class="slice" style="--i:2"></div><div class="slice" style="--i:3"></div><div class="slice" style="--i:4"></div><div class="slice" style="--i:5"></div><div class="slice" style="--i:6"></div><div class="slice" style="--i:7"></div><div class="slice" style="--i:8"></div><div class="slice" style="--i:9"></div><div class="slice" style="--i:10"></div><div class="slice" style="--i:11"></div><div class="slice" style="--i:12"></div><div class="slice" style="--i:13"></div><div class="slice" style="--i:14"></div><div class="slice" style="--i:15"></div><div class="slice" style="--i:16"></div><div class="slice" style="--i:17"></div><div class="slice" style="--i:18"></div><div class="slice" style="--i:19"></div>
          <div class="slice top-slice" style="--i:20">
            <div class="cpu-chip"><div class="cpu-core"></div></div>
          </div>
          <div class="wall-cut-x"></div>
          <div class="wall-cut-y"></div>
        </div>

        <!-- LAYER 3 (Logic) -->
        <div class="cake-layer layer-3">
          <div class="slice" style="--i:0"></div><div class="slice" style="--i:1"></div><div class="slice" style="--i:2"></div><div class="slice" style="--i:3"></div><div class="slice" style="--i:4"></div><div class="slice" style="--i:5"></div><div class="slice" style="--i:6"></div><div class="slice" style="--i:7"></div><div class="slice" style="--i:8"></div><div class="slice" style="--i:9"></div><div class="slice" style="--i:10"></div><div class="slice" style="--i:11"></div><div class="slice" style="--i:12"></div><div class="slice" style="--i:13"></div><div class="slice" style="--i:14"></div><div class="slice" style="--i:15"></div><div class="slice" style="--i:16"></div><div class="slice" style="--i:17"></div><div class="slice" style="--i:18"></div><div class="slice" style="--i:19"></div>
          <div class="slice top-slice" style="--i:20">
            <div class="bar-chart">
              <div class="mini-bar" style="height: 40%"></div>
              <div class="mini-bar" style="height: 70%"></div>
              <div class="mini-bar" style="height: 50%"></div>
              <div class="mini-bar" style="height: 90%"></div>
            </div>
          </div>
          <div class="wall-cut-x"></div>
          <div class="wall-cut-y"></div>
        </div>

        <!-- LAYER 4 (Presentation) -->
        <div class="cake-layer layer-4">
          <div class="slice" style="--i:0"></div><div class="slice" style="--i:1"></div><div class="slice" style="--i:2"></div><div class="slice" style="--i:3"></div><div class="slice" style="--i:4"></div><div class="slice" style="--i:5"></div><div class="slice" style="--i:6"></div><div class="slice" style="--i:7"></div><div class="slice" style="--i:8"></div><div class="slice" style="--i:9"></div><div class="slice" style="--i:10"></div><div class="slice" style="--i:11"></div><div class="slice" style="--i:12"></div><div class="slice" style="--i:13"></div><div class="slice" style="--i:14"></div><div class="slice" style="--i:15"></div><div class="slice" style="--i:16"></div><div class="slice" style="--i:17"></div><div class="slice" style="--i:18"></div><div class="slice" style="--i:19"></div>
          <div class="slice top-slice" style="--i:20">
            <div class="ui-window">
              <div class="ui-header"></div>
              <div class="ui-line"></div>
              <div class="ui-line short"></div>
              <div class="ui-line"></div>
            </div>
          </div>
          <div class="wall-cut-x"></div>
          <div class="wall-cut-y"></div>
        </div>

        <!-- LABELS -->
        <!-- L1: STORAGE -->
        <div class="label-anchor-3d" style="--delay: 1.5s; transform: translateZ(2.5vmin) rotateZ(45deg) rotateX(-60deg);">
          <svg class="leader-svg" viewBox="0 0 100 100"><path class="leader-path" d="M 0 0 L 2 0 L 13 11 L 20 11" /></svg>
          <div class="label-dot" style="background: #3b82f6; top: 10.25vmin;"></div>
          <div class="label-2d" style="top: 8.8vmin;">
            <div class="label-title">STORAGE</div>
            <div class="label-value">4.2 PB</div>
          </div>
        </div>
        
        <!-- L2: COMPUTE -->
        <div class="label-anchor-3d" style="--delay: 1.7s; transform: translateZ(7.5vmin) rotateZ(45deg) rotateX(-60deg);">
          <svg class="leader-svg" viewBox="0 0 100 100"><path class="leader-path" d="M 0 0 L 2 0 L 7 5 L 20 5" /></svg>
          <div class="label-dot" style="background: #8b5cf6; top: 4.25vmin;"></div>
          <div class="label-2d" style="top: 2.8vmin;">
            <div class="label-title">COMPUTE</div>
            <div class="label-value">128 Cores</div>
          </div>
        </div>
        
        <!-- L3: API LOGIC -->
        <div class="label-anchor-3d" style="--delay: 1.9s; transform: translateZ(12.5vmin) rotateZ(45deg) rotateX(-60deg);">
          <svg class="leader-svg" viewBox="0 0 100 100"><path class="leader-path" d="M 0 0 L 2 0 L 3 -1 L 20 -1" /></svg>
          <div class="label-dot" style="background: #10b981; top: -1.75vmin;"></div>
          <div class="label-2d" style="top: -3.2vmin;">
            <div class="label-title">API LOGIC</div>
            <div class="label-value">2ms Latency</div>
          </div>
        </div>

        <!-- L4: CLIENT -->
        <div class="label-anchor-3d" style="--delay: 2.1s; transform: translateZ(17.5vmin) rotateZ(45deg) rotateX(-60deg);">
          <svg class="leader-svg" viewBox="0 0 100 100"><path class="leader-path" d="M 0 0 L 2 0 L 7 -5 L 20 -5" /></svg>
          <div class="label-dot" style="background: #f59e0b; top: -5.75vmin;"></div>
          <div class="label-2d" style="top: -7.2vmin;">
            <div class="label-title">CLIENT</div>
            <div class="label-value">Web / Mobile</div>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
