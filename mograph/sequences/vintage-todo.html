<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Caveat:wght@700&display=swap');

  *, *::before, *::after { box-sizing: border-box; }

  body {
    width: 100%;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    background-color: transparent;
    font-family: 'Space Mono', monospace;
    color: #2e2a24;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }



  .metadata {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    font-weight: 400;
    color: #8c8375;
    letter-spacing: 0.1em;
    visibility: hidden;
    animation: fadeInOut 12.5s 0.2s both;
  }

  #todo-wrapper {
    display: flex;
    flex-direction: column;
    width: 90%;
    max-width: 900px;
    background: transparent;
    padding: clamp(25px, 5vmin, 50px) clamp(20px, 6vmin, 60px);
    margin-top: 5vh;
    animation: panDown 6s 3s forwards;
  }

  .todo-title-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: clamp(25px, 6vmin, 50px);
    
    --enter-delay: 0.2s;
    --exit-delay: 11s;
    animation: slideUpEnter 1.2s var(--enter-delay) cubic-bezier(0.25, 1, 0.25, 1) both,
               slideUpExit 0.8s var(--exit-delay) cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .todo-title {
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 5vmin, 3rem);
    font-weight: 800;
    font-style: italic;
    color: #2e2a24;
    letter-spacing: 0.02em;
  }



  .todo-list-container {
    display: flex;
    flex-direction: column;
  }

  .todo-row {
    display: grid;
    grid-template-columns: 1fr clamp(50px, 12vmin, 100px) clamp(50px, 12vmin, 100px);
    column-gap: clamp(10px, 3vmin, 40px);
    align-items: end;
    padding: clamp(15px, 3vmin, 25px) 0;
    border-bottom: 1px solid #e0d8c3;
    
    --enter-delay: calc(0.3s + var(--index) * 0.15s);
    --exit-delay: calc(11.1s + var(--index) * 0.1s);
    animation: fadeSlideUpEnter 1s var(--enter-delay) cubic-bezier(0.25, 1, 0.25, 1) both,
               fadeSlideUpExit 0.7s var(--exit-delay) cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  
  .todo-row:last-child {
    border-bottom: none;
  }

  .todo-header-row {
    border-bottom: 2px solid #c8bea8;
    padding-bottom: 10px;
    padding-top: 0;
    align-items: center;
  }

  .todo-header {
    font-size: clamp(0.7rem, 2vmin, 1.2rem);
    font-weight: 700;
    color: #8c8375;
    text-align: center;
    letter-spacing: 0.1em;
  }

  .todo-text {
    font-size: clamp(1rem, 3.5vmin, 1.8rem);
    font-weight: 700;
    line-height: 1.3;
    padding-bottom: 2px;
  }

  .checkbox-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding-bottom: 2px;
  }

  .checkbox-box {
    width: clamp(16px, 4vmin, 26px);
    height: clamp(16px, 4vmin, 26px);
    border: 1.5px solid #a8a08f;
    border-radius: 2px;
    background: transparent;
  }

  .checkbox-mark {
    position: absolute;
    top: 50%;
    left: 50%;
    font-size: clamp(2rem, 6vmin, 4rem);
    color: #a63a2c;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    
    --delay: calc(1.5s + var(--check-delay) * 0.2s);
    animation: drawCheck 0.6s var(--delay) cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes drawCheck {
    from { visibility: hidden; transform: translate(-50%, -60%) scale(0) rotate(-20deg); }
    to { visibility: visible; transform: translate(-50%, -60%) scale(1) rotate(0deg); }
  }

  @keyframes fadeSlideUpEnter {
    from { visibility: hidden; transform: translateY(40px) scale(0.95); }
    to { visibility: visible; transform: translateY(0) scale(1); }
  }

  @keyframes fadeSlideUpExit {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-20px); }
  }

  @keyframes slideUpEnter {
    from { visibility: hidden; transform: translateY(60px) scale(0.95); }
    to { visibility: visible; transform: translateY(0) scale(1); }
  }

  @keyframes slideUpExit {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-30px); }
  }

  @keyframes scaleXIn {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  @keyframes fadeInOut {
    0% { visibility: hidden; }
    5% { visibility: visible; }
    95% { visibility: visible; }
    100% { visibility: hidden; }
  }
  
  @keyframes panDown {
    0% { transform: translateY(0); animation-timing-function: cubic-bezier(0.45, 0, 0.15, 1); }
    85% { transform: translateY(calc(-100% + 88vh)); animation-timing-function: ease-in-out; }
    93% { transform: translateY(calc(-100% + 90.5vh)); animation-timing-function: ease-in-out; }
    100% { transform: translateY(calc(-100% + 90vh)); }
  }
  

</style>
</head>
<body>


  
  <div class="scene">
    <div id="todo-wrapper"></div>
  </div>

  <script>
    const data = {
      title: "Automating Research",
      items: [
        { text: "Visual Brainstorming", done: true, shared: true },
        { text: "Chat with Paper", done: true, shared: true },
        { text: "Data Visualizer & Chart Creator (Mermaid)", done: true, shared: true },
        { text: "Automated Systematic Literature Review (SLR)", done: true, shared: false },
        { text: "Reference Finder & Library Manager", done: true, shared: false },
        { text: "Statistical Analysis & Report Generation", done: true, shared: false },
        { text: "Contextual Writing Assistance", done: true, shared: false },
        { text: "Outline Templates", done: true, shared: false },
        { text: "Editing Agent", done: true, shared: false },
        { text: "Citation & Reference Style Manager", done: true, shared: false },
        { text: "Word Processor", done: true, shared: false },
        { text: "Export (Docs, Word, Markdown, LaTeX, BibTeX)", done: true, shared: false },
        { text: "Presentation Builder (Graphics & Slides)", done: true, shared: false },
        { text: "Reference Analysis (Compare by Subject, etc.)", done: false, shared: false },
        { text: "Research Gap Identifier", done: false, shared: false },
        { text: "Deep Research", done: false, shared: false },
        { text: "Parallel Data Search (via API)", done: false, shared: false },
        { text: "Version Control & History", done: false, shared: false }
      ]
    };

    const wrapper = document.getElementById('todo-wrapper');
    
    let html = `
      <div class="todo-title-container">
        <div class="todo-title">${data.title}</div>
      </div>
      
      <div class="todo-list-container">
        <div class="todo-row todo-header-row" style="--index: 0">
          <div class="todo-header"></div>
          <div class="todo-header">DONE</div>
          <div class="todo-header">SHARED</div>
        </div>
    `;
    
    data.items.forEach((item, i) => {
      const index = i + 1;
      html += `
        <div class="todo-row" style="--index: ${index}">
          <div class="todo-text">${item.text}</div>
          <div class="checkbox-wrapper">
            <div class="checkbox-box"></div>
            ${item.done ? `<div class="checkbox-mark" style="--check-delay: ${index}">✓</div>` : ''}
          </div>
          <div class="checkbox-wrapper">
            <div class="checkbox-box"></div>
            ${item.shared ? `<div class="checkbox-mark" style="--check-delay: ${index + 0.5}">✓</div>` : ''}
          </div>
        </div>
      `;
    });
    
    html += `</div>`;
    wrapper.innerHTML = html;
  </script>
</body>
</html>
