<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly Landscape Flythrough</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        // Background is transparent for composite rendering
        
        // Add a subtle fog to blend the distance and hide the edges of the terrain
        scene.fog = new THREE.FogExp2(0x88bbff, 0.005); 

        // 2. Camera Setup
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ 
            alpha: true, 
            antialias: true, 
            preserveDrawingBuffer: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // 4. Lighting Setup
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x445566, 0.6);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 1.5);
        dirLight.position.set(150, 200, 100);
        dirLight.castShadow = true;
        // Large shadow map bounds to cover the terrain
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -150;
        dirLight.shadow.camera.right = 150;
        dirLight.shadow.camera.top = 150;
        dirLight.shadow.camera.bottom = -150;
        dirLight.shadow.camera.far = 500;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        // 5. Procedural Low-Poly Terrain Generation
        let terrainGeo = new THREE.PlaneGeometry(350, 350, 90, 90);
        terrainGeo.rotateX(-Math.PI / 2);
        
        // Convert to non-indexed to give each face its own unique vertices and normals.
        // This is crucial for achieving true flat shading with vertex colors.
        terrainGeo = terrainGeo.toNonIndexed();

        const posAttr = terrainGeo.getAttribute('position');
        const colors = [];
        const colorObj = new THREE.Color();

        // Calculate height for a given (x, z)
        const getH = (x, z) => {
            const d = Math.sqrt(x*x + z*z);
            
            // Multiple layers of noise
            const n1 = (Math.sin(x * 0.05) + Math.cos(z * 0.05)) * 10;
            const n2 = (Math.sin(x * 0.15 + 1) + Math.cos(z * 0.1 + 2)) * 5;
            const n3 = (Math.sin(x * 0.4 + 3) + Math.cos(z * 0.4 + 4)) * 1.5;
            
            let y = n1 + n2 + n3;
            
            // Push the edges up to form a crater / valley bowl so we don't fly off the edge
            y += Math.pow(d * 0.04, 2);
            
            // Floor of the valley
            if (y < 4) y = 4 + (Math.sin(x * 0.5) + Math.cos(z * 0.5)) * 0.2;
            return y;
        };

        // We process in groups of 3 vertices (1 triangle/face)
        for (let i = 0; i < posAttr.count; i += 3) {
            const x0 = posAttr.getX(i), z0 = posAttr.getZ(i);
            const x1 = posAttr.getX(i+1), z1 = posAttr.getZ(i+1);
            const x2 = posAttr.getX(i+2), z2 = posAttr.getZ(i+2);
            
            const y0 = getH(x0, z0);
            const y1 = getH(x1, z1);
            const y2 = getH(x2, z2);

            posAttr.setY(i, y0);
            posAttr.setY(i+1, y1);
            posAttr.setY(i+2, y2);

            // Determine face color based on average height of the triangle
            const avgY = (y0 + y1 + y2) / 3;

            if (avgY < 6) {
                colorObj.setHex(0xe3d8a4); // Sand
            } else if (avgY < 22) {
                colorObj.setHex(0x4a7c59); // Grass / Forest
            } else if (avgY < 45) {
                colorObj.setHex(0x6e6e6e); // Mountain Rock
            } else {
                colorObj.setHex(0xffffff); // Snow Peaks
            }
            
            // Add a slight random brightness variation per face to break up flat areas
            colorObj.offsetHSL(0, 0, (Math.random() - 0.5) * 0.08);

            colors.push(colorObj.r, colorObj.g, colorObj.b);
            colors.push(colorObj.r, colorObj.g, colorObj.b);
            colors.push(colorObj.r, colorObj.g, colorObj.b);
        }

        terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        terrainGeo.computeVertexNormals();

        const terrainMat = new THREE.MeshStandardMaterial({ 
            vertexColors: true, 
            flatShading: true,
            roughness: 0.9,
            metalness: 0.0
        });
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        terrain.receiveShadow = true;
        terrain.castShadow = true;
        scene.add(terrain);

        // --- Scatter Objects on Terrain ---
        const getSurfaceType = (y) => {
            if (y < 6) return 'sand';
            if (y < 22) return 'grass';
            if (y < 45) return 'rock';
            return 'snow';
        };

        const dummy = new THREE.Object3D();

        // 1. Trees (InstancedMesh for massive performance)
        const treeCount = 400;
        const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 2.5, 5);
        const leavesGeo = new THREE.ConeGeometry(2, 5, 5);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, flatShading: true });
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2a5939, flatShading: true });

        const trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount);
        const leavesMesh = new THREE.InstancedMesh(leavesGeo, leavesMat, treeCount);
        trunkMesh.castShadow = true; trunkMesh.receiveShadow = true;
        leavesMesh.castShadow = true; leavesMesh.receiveShadow = true;

        let placedTrees = 0;
        for(let i = 0; i < 2000 && placedTrees < treeCount; i++) {
            const x = (Math.random() - 0.5) * 320;
            const z = (Math.random() - 0.5) * 320;
            const y = getH(x, z);
            
            if (getSurfaceType(y) === 'grass') {
                const scale = 0.6 + Math.random() * 0.8;
                
                // Position Trunk
                dummy.position.set(x, y + 1.25 * scale, z);
                dummy.scale.set(scale, scale, scale);
                dummy.rotation.set(0, Math.random() * Math.PI, 0);
                dummy.updateMatrix();
                trunkMesh.setMatrixAt(placedTrees, dummy.matrix);
                
                // Position Leaves
                dummy.position.set(x, y + 3.5 * scale, z);
                dummy.updateMatrix();
                leavesMesh.setMatrixAt(placedTrees, dummy.matrix);
                
                placedTrees++;
            }
        }
        trunkMesh.count = placedTrees;
        leavesMesh.count = placedTrees;
        scene.add(trunkMesh);
        scene.add(leavesMesh);

        // 2. Rocks & Boulders
        const rockCount = 200;
        const rockGeo = new THREE.DodecahedronGeometry(1, 0);
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x6e6e6e, flatShading: true });
        const rockMesh = new THREE.InstancedMesh(rockGeo, rockMat, rockCount);
        rockMesh.castShadow = true; rockMesh.receiveShadow = true;
        
        let placedRocks = 0;
        for(let i = 0; i < 1000 && placedRocks < rockCount; i++) {
            const x = (Math.random() - 0.5) * 320;
            const z = (Math.random() - 0.5) * 320;
            const y = getH(x, z);
            
            // Scatter on rock, sand, and occasionally snow
            if (getSurfaceType(y) !== 'grass' || Math.random() > 0.8) {
                const scale = 0.5 + Math.random() * 2;
                dummy.position.set(x, y, z);
                dummy.scale.set(scale, scale * 0.7, scale * 1.2);
                dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                dummy.updateMatrix();
                rockMesh.setMatrixAt(placedRocks, dummy.matrix);
                placedRocks++;
            }
        }
        rockMesh.count = placedRocks;
        scene.add(rockMesh);

        // 3. Cabins
        const cabinGroup = new THREE.Group();
        scene.add(cabinGroup);
        
        const cabinWallMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, flatShading: true });
        const cabinRoofMat = new THREE.MeshStandardMaterial({ color: 0xaa3333, flatShading: true });
        const cabinWallGeo = new THREE.BoxGeometry(3, 2.5, 3);
        const cabinRoofGeo = new THREE.ConeGeometry(2.5, 2, 4);

        let placedCabins = 0;
        for(let i = 0; i < 200 && placedCabins < 6; i++) {
            const x = (Math.random() - 0.5) * 120; // Keep in central valley
            const z = (Math.random() - 0.5) * 120;
            const y = getH(x, z);
            
            if (y > 5 && y < 15) { // Only flat-ish grass areas near the water
                const cabin = new THREE.Group();
                
                const walls = new THREE.Mesh(cabinWallGeo, cabinWallMat);
                walls.position.y = 1.25;
                walls.castShadow = true; walls.receiveShadow = true;
                cabin.add(walls);

                const roof = new THREE.Mesh(cabinRoofGeo, cabinRoofMat);
                roof.position.y = 3.5;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true; roof.receiveShadow = true;
                cabin.add(roof);

                cabin.position.set(x, y, z);
                cabin.rotation.y = Math.random() * Math.PI;
                cabinGroup.add(cabin);
                placedCabins++;
            }
        }

        // 6. Water Layer
        const waterGeo = new THREE.PlaneGeometry(350, 350, 32, 32);
        waterGeo.rotateX(-Math.PI / 2);
        // Make the water vertices wiggle later in animation loop
        
        const waterMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x2288ff,
            transmission: 0.8,
            opacity: 1,
            metalness: 0.1,
            roughness: 0.1,
            ior: 1.3,
            transparent: true,
            flatShading: true
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.y = 5; // Slightly above the lowest sand
        water.receiveShadow = true;
        scene.add(water);

        // 7. Ambient Details (Birds / Dust)
        const birdCount = 20;
        const birdGeo = new THREE.ConeGeometry(0.6, 1.8, 3);
        birdGeo.rotateX(Math.PI / 2); // Point forward
        const birdMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
        const birds = new THREE.Group();
        scene.add(birds);

        for(let i=0; i<birdCount; i++) {
            const bird = new THREE.Mesh(birdGeo, birdMat);
            bird.position.set(
                (Math.random() - 0.5) * 200,
                20 + Math.random() * 30,
                (Math.random() - 0.5) * 200
            );
            bird.userData = {
                speed: 0.2 + Math.random() * 0.3,
                offset: Math.random() * Math.PI * 2,
                orbitCenter: new THREE.Vector3(bird.position.x, 0, bird.position.z),
                orbitRadius: 20 + Math.random() * 30
            };
            birds.add(bird);
        }

        // 8. Camera Path (CatmullRomCurve3)
        // Creating a closed circular loop through the valleys and over hills
        const pathRadius = 90;
        const points = [];
        for (let i = 0; i <= 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const x = Math.cos(angle) * pathRadius;
            const z = Math.sin(angle) * pathRadius;
            // Camera bobs up and down rhythmically 
            const y = 25 + Math.sin(angle * 3) * 12; 
            points.push(new THREE.Vector3(x, y, z));
        }
        const cameraPath = new THREE.CatmullRomCurve3(points, true); // true = closed loop

        // 9. Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 10. Animation Loop
        const waterPosAttr = water.geometry.getAttribute('position');
        const waterOriginalY = new Float32Array(waterPosAttr.count);
        for(let i=0; i<waterPosAttr.count; i++) {
            waterOriginalY[i] = waterPosAttr.getY(i);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            
            // --- Camera Flythrough ---
            // Convert time to a normalized position along the curve (0 to 1)
            // It takes 30 seconds (30000 ms) to complete one full loop
            const loopDuration = 30000;
            const t = (time % loopDuration) / loopDuration;
            
            // Get position and look-ahead position
            const currentPos = cameraPath.getPointAt(t);
            // Look slightly ahead on the curve (0.01 ahead, wrapping around using %)
            const lookAtPos = cameraPath.getPointAt((t + 0.02) % 1);

            camera.position.copy(currentPos);
            camera.lookAt(lookAtPos);

            // --- Water Animation ---
            for(let i=0; i<waterPosAttr.count; i++) {
                const x = waterPosAttr.getX(i);
                const z = waterPosAttr.getZ(i);
                // Gentle ripple
                const yOffset = Math.sin(x * 0.1 + time * 0.002) * 0.5 + Math.cos(z * 0.1 + time * 0.0015) * 0.5;
                waterPosAttr.setY(i, waterOriginalY[i] + yOffset);
            }
            waterPosAttr.needsUpdate = true;

            // --- Birds Animation ---
            birds.children.forEach(b => {
                const ud = b.userData;
                const angle = time * 0.001 * ud.speed + ud.offset;
                
                // Birds circle their orbit centers
                const targetX = ud.orbitCenter.x + Math.cos(angle) * ud.orbitRadius;
                const targetZ = ud.orbitCenter.z + Math.sin(angle) * ud.orbitRadius;
                const targetY = b.position.y + Math.sin(time * 0.002 + ud.offset) * 0.1;
                
                const targetPos = new THREE.Vector3(targetX, targetY, targetZ);
                
                // Move towards target smoothly
                b.position.lerp(targetPos, 0.05);
                
                // Point in direction of velocity
                b.lookAt(targetPos);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
