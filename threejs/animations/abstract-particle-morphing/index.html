<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Particle Morphing</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 0, 80);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const pixelRatio = Math.min(window.devicePixelRatio, 2);
        renderer.setPixelRatio(pixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. Geometries for Sampling
        const particleCount = 4000; // Balanced count for abstract shape definition

        
        // Shape A: Sphere (Data Core)
        const geoA = new THREE.SphereGeometry(15, 64, 64);
        const samplerA = new MeshSurfaceSampler(new THREE.Mesh(geoA)).build();

        // Shape B: Torus Knot (Neural Network / Complexity)
        const geoB = new THREE.TorusKnotGeometry(12, 3, 200, 32);
        const samplerB = new MeshSurfaceSampler(new THREE.Mesh(geoB)).build();

        // 3. Generate Particle Buffers
        const positionsA = new Float32Array(particleCount * 3);
        const positionsB = new Float32Array(particleCount * 3);
        const positionsC = new Float32Array(particleCount * 3);
        const randoms = new Float32Array(particleCount * 3); // For swarming chaos

        const tempPosition = new THREE.Vector3();
        
        // Vibrant, high-contrast colors that pop against BOTH white and black backgrounds
        const colorA = new THREE.Color(0xe76f51); // Vibrant Coral
        const colorB = new THREE.Color(0x2a9d8f); // Deep Teal
        const colorC = new THREE.Color(0x8338ec); // Rich Purple

        for (let i = 0; i < particleCount; i++) {
            // Sample Shape A (Sphere)
            samplerA.sample(tempPosition);
            positionsA[i*3] = tempPosition.x;
            positionsA[i*3+1] = tempPosition.y;
            positionsA[i*3+2] = tempPosition.z;

            // Sample Shape B (Torus Knot)
            samplerB.sample(tempPosition);
            positionsB[i*3] = tempPosition.x;
            positionsB[i*3+1] = tempPosition.y;
            positionsB[i*3+2] = tempPosition.z;

            // Generate Shape C (Double Helix via Math)
            const h = (Math.random() - 0.5) * 40; // Height -20 to 20
            const angle = h * 0.5;
            const radius = 8;
            // Two opposing strands
            const strandOffset = Math.random() > 0.5 ? 0 : Math.PI;
            // Tighter noise radius since the particles themselves are now very large
            const noiseR = radius + (Math.random() - 0.5) * 1.5;
            positionsC[i*3] = Math.sin(angle + strandOffset) * noiseR;
            positionsC[i*3+1] = h;
            positionsC[i*3+2] = Math.cos(angle + strandOffset) * noiseR;

            // Random values per particle for chaotic swarming paths
            randoms[i*3] = (Math.random() - 0.5);
            randoms[i*3+1] = (Math.random() - 0.5);
            randoms[i*3+2] = (Math.random() - 0.5);
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positionsA, 3)); 
        geometry.setAttribute('posA', new THREE.BufferAttribute(positionsA, 3));
        geometry.setAttribute('posB', new THREE.BufferAttribute(positionsB, 3));
        geometry.setAttribute('posC', new THREE.BufferAttribute(positionsC, 3));
        geometry.setAttribute('randoms', new THREE.BufferAttribute(randoms, 3));

        // 4. Custom Shader Material for GPU Morphing
        // This calculates the transition of 40,000 particles entirely on the GPU
        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uProgress: { value: 0 }, // 0=A, 1=B, 2=C, 3=A
                uColorA: { value: colorA },
                uColorB: { value: colorB },
                uColorC: { value: colorC }
            },
            vertexShader: `
                uniform float uTime;
                uniform float uProgress;
                uniform vec3 uColorA;
                uniform vec3 uColorB;
                uniform vec3 uColorC;

                attribute vec3 posA;
                attribute vec3 posB;
                attribute vec3 posC;
                attribute vec3 randoms;
                
                varying vec3 vColor;

                // Easing function for a snappy, organic transition
                float easeInOutCubic(float x) {
                    return x < 0.5 ? 4.0 * x * x * x : 1.0 - pow(-2.0 * x + 2.0, 3.0) / 2.0;
                }

                void main() {
                    vec3 targetPos = posA;
                    vec3 targetColor = uColorA;
                    
                    // Route the transition based on the timeline progress (0 to 3)
                    if (uProgress < 1.0) {
                        float p = easeInOutCubic(uProgress);
                        targetPos = mix(posA, posB, p);
                        targetColor = mix(uColorA, uColorB, p);
                        
                        // Add swarming chaos exactly at the halfway mark of the transition
                        float swarm = sin(p * 3.14159);
                        targetPos += randoms * swarm * 15.0;
                        
                    } else if (uProgress < 2.0) {
                        float p = easeInOutCubic(uProgress - 1.0);
                        targetPos = mix(posB, posC, p);
                        targetColor = mix(uColorB, uColorC, p);
                        
                        float swarm = sin(p * 3.14159);
                        targetPos += randoms * swarm * 15.0;
                        
                    } else {
                        float p = easeInOutCubic(uProgress - 2.0);
                        targetPos = mix(posC, posA, p);
                        targetColor = mix(uColorC, uColorA, p);
                        
                        float swarm = sin(p * 3.14159);
                        targetPos += randoms * swarm * 15.0;
                    }

                    // Add a constant, tiny floating micro-motion to keep the shape alive
                    targetPos += randoms * sin(uTime * 2.0 + randoms.x * 10.0) * 0.4;

                    vColor = targetColor;

                    vec4 mvPosition = modelViewMatrix * vec4(targetPos, 1.0);
                    
                    // Perspective size attenuation
                    gl_PointSize = (300.0 * ${pixelRatio.toFixed(1)}) / -mvPosition.z; 
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    vec2 coord = gl_PointCoord - vec2(0.5);
                    float dist = length(coord);
                    if(dist > 0.5) discard;
                    
                    // Soft glowing edge (alpha fades out smoothly)
                    float alpha = smoothstep(0.5, 0.1, dist);
                    
                    // Pure fill color, no outline!
                    gl_FragColor = vec4(vColor, alpha);
                }
            `,
            transparent: true,
            blending: THREE.NormalBlending, // Additive fails on pure white backgrounds!
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // 5. Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true; 
        controls.autoRotateSpeed = 1.0;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. Animation Timeline (12 Second Loop)
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;

            material.uniforms.uTime.value = time;

            // Timeline Math
            const cycle = time % 12;
            let progress = 0;
            
            if (cycle < 1) {
                progress = 0; // Hold A (Sphere)
            } else if (cycle < 4) {
                progress = (cycle - 1) / 3; // Morph A -> B
            } else if (cycle < 5) {
                progress = 1.0; // Hold B (Torus Knot)
            } else if (cycle < 8) {
                progress = 1.0 + (cycle - 5) / 3; // Morph B -> C
            } else if (cycle < 9) {
                progress = 2.0; // Hold C (Double Helix)
            } else {
                progress = 2.0 + (cycle - 9) / 3; // Morph C -> A
            }
            
            material.uniforms.uProgress.value = progress;

            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
