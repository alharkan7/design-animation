<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* 
     * Brutalist / Scrapbook Collage
     * Strict rules: No background on body/html so player backgrounds show through.
     * High contrast, aggressive easing, raw physical motion.
     */
    
    :root {
      /* Palette */
      --black: #111111;
      --red: #E61919;
      --yellow: #FACC15;
      --white: #F8F8F8;
    }
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* No background color set */
    }

    .scene {
      width: 100vw;
      height: 100vh;
      position: relative;
      /* The whole collage rips off screen at the end */
      animation: ripAway 0.8s 8s cubic-bezier(0.76, 0, 0.24, 1) forwards;
    }

    @keyframes ripAway {
      0% { transform: translateX(0) rotate(0); visibility: visible; }
      99% { visibility: visible; }
      100% { transform: translateX(-150vw) rotate(-15deg); visibility: hidden; }
    }

    /* ---------------------------------
       Aggressive Entrance Keyframes
       --------------------------------- */
       
    /* The violent stamp: scales from huge, slams into place with massive overshoot */
    @keyframes stampIn {
      0% { transform: scale(6) rotate(15deg); visibility: hidden; }
      1% { visibility: visible; }
      100% { transform: scale(1) rotate(-3deg); visibility: visible; }
    }
    /* Same stamp, different resting rotation */
    @keyframes stampInAlt {
      0% { transform: scale(5) rotate(-20deg); visibility: hidden; }
      1% { visibility: visible; }
      100% { transform: scale(1) rotate(4deg); visibility: visible; }
    }

    /* Dropping in from above with a heavy, ungraceful bounce */
    @keyframes dropIn {
      0% { transform: translateY(-80vh) rotate(20deg); visibility: hidden; }
      1% { visibility: visible; }
      100% { transform: translateY(0) rotate(-6deg); visibility: visible; }
    }

    /* A snappy slide/slap from the side */
    @keyframes slapIn {
      0% { transform: translate(-30vw, 20vw) rotate(-30deg) scale(1.5); visibility: hidden; }
      1% { visibility: visible; }
      100% { transform: translate(0, 0) rotate(8deg) scale(1); visibility: visible; }
    }

    /* Masking tape sweeping across */
    @keyframes tapeSlap {
      0% { transform: scaleX(0); visibility: hidden; }
      1% { visibility: visible; }
      100% { transform: scaleX(1); visibility: visible; }
    }

    /* Fast mechanical flickering */
    @keyframes metaFlash {
      0% { opacity: 0; visibility: hidden; }
      1% { opacity: 1; visibility: visible; }
      20% { opacity: 0; }
      40% { opacity: 1; }
      60% { opacity: 0; }
      80% { opacity: 1; }
      100% { opacity: 1; visibility: visible; }
    }


    /* ---------------------------------
       Typography & Elements
       --------------------------------- */
       
    .word-stamp {
      position: absolute;
      color: var(--black);
      text-transform: uppercase;
      line-height: 0.8;
      white-space: nowrap;
      z-index: 5;
    }

    /* Huge italic serif */
    .serif-stamp {
      font-family: 'Times New Roman', Times, serif;
      font-size: 18vw;
      font-weight: 900;
      font-style: italic;
      top: 12vh;
      left: 6vw;
      /* Solid brutalist drop shadow */
      text-shadow: 0.6vw 0.6vw 0 var(--red);
      animation: stampIn 0.35s 0.2s cubic-bezier(0, 1.6, 0.2, 1) both;
    }

    /* Hollow outline sans-serif */
    .sans-stamp {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 20vw;
      font-weight: 900;
      letter-spacing: -0.8vw;
      bottom: 12vh;
      right: 4vw;
      color: transparent;
      -webkit-text-stroke: 1vw var(--black);
      animation: stampInAlt 0.4s 0.6s cubic-bezier(0, 1.4, 0.2, 1) both;
      z-index: 2;
    }

    /* Torn Paper / Halftone Box */
    .torn-box {
      position: absolute;
      top: 8vh;
      right: 22vw;
      width: 25vw;
      height: 35vw;
      background: var(--black);
      /* Jagged polygon simulating a rough crop */
      clip-path: polygon(2% 4%, 4% 0%, 96% 2%, 100% 6%, 97% 96%, 93% 100%, 5% 97%, 0% 93%, 1% 45%);
      animation: dropIn 0.6s 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      z-index: 3;
    }
    .torn-inner {
      position: absolute;
      inset: 0.8vw;
      /* Simple CSS halftone dot pattern */
      background-color: var(--yellow);
      background-image: radial-gradient(var(--black) 35%, transparent 40%);
      background-size: 1.5vw 1.5vw;
      background-position: 0 0, 0.75vw 0.75vw;
      clip-path: polygon(0% 2%, 100% 0%, 98% 100%, 2% 98%);
    }

    /* Warning Sticker */
    .warning-sticker {
      position: absolute;
      top: 48vh;
      left: 14vw;
      background: var(--yellow);
      border: 0.6vw solid var(--black);
      padding: 1vw;
      box-shadow: 1.5vw 1.5vw 0 rgba(0,0,0,0.8);
      transform-origin: center;
      animation: slapIn 0.5s 1.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      z-index: 6;
      display: flex;
      flex-direction: column;
    }
    .sticker-top {
      background: var(--black);
      color: var(--yellow);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 3.5vw;
      text-align: center;
      padding: 0.5vw 1.5vw;
      letter-spacing: 0.1vw;
    }
    .sticker-body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 900;
      font-size: 2.5vw;
      color: var(--black);
      margin-top: 1vw;
      text-align: center;
      line-height: 1;
    }

    /* Rejected Rubber Stamp */
    .red-stamp {
      position: absolute;
      top: 32vh;
      right: 18vw;
      border: 0.8vw solid var(--red);
      color: var(--red);
      font-family: 'Courier New', Courier, monospace;
      font-weight: 900;
      font-size: 7vw;
      padding: 1vw 2vw;
      border-radius: 1vw;
      transform-origin: center;
      /* Multi-layered shadow to look like heavy ink */
      box-shadow: inset 0 0 0 0.4vw var(--red), 0 0 0 0.4vw var(--red);
      animation: stampIn 0.25s 2.2s cubic-bezier(0, 2.5, 0.2, 1) both;
      z-index: 10;
    }

    /* Masking Tape */
    .tape-wrap {
      position: absolute;
      z-index: 8;
    }
    /* Hardcoded rotations on the wrappers so the tape can scaleX purely on its local axis */
    .tape-wrap-1 { top: 46vh; left: 10vw; transform: rotate(-15deg); width: 14vw; height: 3.5vw; }
    .tape-wrap-2 { top: 10vh; right: 28vw; transform: rotate(55deg); width: 16vw; height: 3vw; }
    .tape-wrap-3 { bottom: 20vh; right: 45vw; transform: rotate(-75deg); width: 12vw; height: 3vw; }

    .tape {
      width: 100%;
      height: 100%;
      background: rgba(240, 235, 220, 0.9);
      border-top: 2px solid rgba(0,0,0,0.1);
      border-bottom: 2px solid rgba(0,0,0,0.1);
      box-shadow: 0.3vw 0.5vw 0.5vw rgba(0,0,0,0.25);
      transform-origin: left center;
      /* Frayed edges */
      clip-path: polygon(2% 0, 100% 2%, 98% 100%, 0 98%);
    }
    .tape-wrap-1 .tape { animation: tapeSlap 0.15s 1.6s ease-out both; }
    .tape-wrap-2 .tape { animation: tapeSlap 0.15s 1.1s ease-out both; }
    .tape-wrap-3 .tape { animation: tapeSlap 0.15s 0.8s ease-out both; }

    /* Metadata */
    .meta {
      position: absolute;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.8vw;
      font-weight: 900;
      color: var(--black);
      background: var(--yellow);
      padding: 0.2vw 0.8vw;
      animation: metaFlash 0.4s steps(2, start) both;
      z-index: 9;
    }
    .meta-1 { top: 6vh; left: 6vw; animation-delay: 2.5s; }
    .meta-2 { bottom: 6vh; right: 6vw; animation-delay: 2.7s; color: var(--white); background: var(--black); }
    .meta-3 { top: 40vh; right: 3vw; transform: rotate(90deg); animation-delay: 2.9s; background: none; border: 0.3vw solid var(--black); }

  </style>
</head>
<body>
  
  <div class="scene">
    
    <!-- Torn Halftone Box -->
    <div class="torn-box">
       <div class="torn-inner"></div>
    </div>
    <div class="tape-wrap tape-wrap-2"><div class="tape"></div></div>

    <!-- Huge Serif -->
    <div class="word-stamp serif-stamp">BRUTAL</div>
    
    <!-- Huge Sans Serif -->
    <div class="word-stamp sans-stamp">SYSTEMS</div>
    <div class="tape-wrap tape-wrap-3"><div class="tape"></div></div>
    
    <!-- Warning Sticker -->
    <div class="sticker warning-sticker">
      <div class="sticker-top">WARNING</div>
      <div class="sticker-body">DO NOT IGNORE<br>THE GRID</div>
    </div>
    <div class="tape-wrap tape-wrap-1"><div class="tape"></div></div>

    <!-- Tiny Metadata -->
    <div class="meta meta-1">REC.094 // ACTIVE</div>
    <div class="meta meta-2">AX-994</div>
    <div class="meta meta-3">[ OVERRIDE ]</div>

    <!-- Big red rubber stamp -->
    <div class="red-stamp">REJECTED</div>

  </div>

</body>
</html>
