<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#a0b0c0" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <!-- Header -->
    <text x="40" y="60" font-size="28" font-weight="bold" fill="#0f172a">Centralized Event Bus</text>
    <text x="40" y="90" font-size="16" fill="#475569">Radial flow of real-time data ingestion and distribution via Apache Kafka</text>

    <!-- Radar Rings (Background) -->
    <g fill="none" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="12,12">
      <circle cx="600" cy="480" r="160" />
      <circle cx="600" cy="480" r="240" />
      <circle cx="600" cy="480" r="320" />
      <circle cx="600" cy="480" r="400" />
    </g>

    <!-- Connectors -->
    <g stroke-width="3" stroke-dasharray="6,8">
      <!-- Inputs (Blue) -->
      <line x1="600" y1="480" x2="600" y2="160" stroke="#d4e4f7" />
      <line x1="600" y1="480" x2="374" y2="254" stroke="#d4e4f7" />
      <line x1="600" y1="480" x2="280" y2="480" stroke="#d4e4f7" />
      <line x1="600" y1="480" x2="374" y2="706" stroke="#d4e4f7" />
      
      <!-- Outputs (Green/Warm) -->
      <line x1="600" y1="480" x2="826" y2="254" stroke="#b2e3c6" />
      <line x1="600" y1="480" x2="920" y2="480" stroke="#b2e3c6" />
      <line x1="600" y1="480" x2="826" y2="706" stroke="#b2e3c6" />
      <line x1="600" y1="480" x2="600" y2="800" stroke="#f3e4c4" />
    </g>

    <!-- Shapes -->
    <g filter="url(#shadow)">
      <!-- Center Hub -->
      <circle cx="600" cy="480" r="100" fill="#f8f5ff" stroke="#e2e0f0" stroke-width="3" />
      
      <!-- Blue Nodes (Inputs) -->
      <g fill="#f5f9ff" stroke="#d4e4f7" stroke-width="2">
        <rect x="510" y="130" width="180" height="60" rx="16" />
        <rect x="284" y="224" width="180" height="60" rx="16" />
        <rect x="190" y="450" width="180" height="60" rx="16" />
        <rect x="284" y="676" width="180" height="60" rx="16" />
      </g>
      
      <!-- Green Nodes (Outputs) -->
      <g fill="#f4fcf7" stroke="#b2e3c6" stroke-width="2">
        <rect x="736" y="224" width="180" height="60" rx="16" />
        <rect x="830" y="450" width="180" height="60" rx="16" />
        <rect x="736" y="676" width="180" height="60" rx="16" />
      </g>

      <!-- Warm Node (Output) -->
      <g fill="#fefcf5" stroke="#f3e4c4" stroke-width="2">
        <rect x="510" y="770" width="180" height="60" rx="16" />
      </g>
    </g>

    <!-- Node Text -->
    <g text-anchor="middle">
      <!-- Center Text -->
      <text x="600" y="475" font-size="20" font-weight="bold" fill="#3b2f6b">Apache Kafka</text>
      <text x="600" y="495" font-size="13" fill="#6b5b9e">Central Event Bus</text>

      <!-- Blue Texts -->
      <text x="600" y="156" font-size="14" font-weight="bold" fill="#00477a">API Gateway</text>
      <text x="600" y="172" font-size="11" fill="#33709e">Stream Input</text>
      
      <text x="374" y="250" font-size="14" font-weight="bold" fill="#00477a">Mobile App</text>
      <text x="374" y="266" font-size="11" fill="#33709e">Telemetry Data</text>

      <text x="280" y="476" font-size="14" font-weight="bold" fill="#00477a">Web Client</text>
      <text x="280" y="492" font-size="11" fill="#33709e">User Events</text>

      <text x="374" y="702" font-size="14" font-weight="bold" fill="#00477a">Microservices</text>
      <text x="374" y="718" font-size="11" fill="#33709e">Database CDC</text>

      <!-- Green Texts -->
      <text x="826" y="250" font-size="14" font-weight="bold" fill="#0e5927">Push Workers</text>
      <text x="826" y="266" font-size="11" fill="#2d874b">Notification Fan-out</text>

      <text x="920" y="476" font-size="14" font-weight="bold" fill="#0e5927">ML Pipeline</text>
      <text x="920" y="492" font-size="11" fill="#2d874b">Feature Extractor</text>

      <text x="826" y="702" font-size="14" font-weight="bold" fill="#0e5927">Snowflake DWH</text>
      <text x="826" y="718" font-size="11" fill="#2d874b">Analytics Sync</text>

      <!-- Warm Texts -->
      <text x="600" y="796" font-size="14" font-weight="bold" fill="#7a5900">Amazon S3</text>
      <text x="600" y="812" font-size="11" fill="#a37c00">Cold Archival</text>
    </g>
  </g>
</svg>
