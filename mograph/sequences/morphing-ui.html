<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* Reset & Base */
    :root {
      color-scheme: dark;
      --bg: #050508;
      --island-bg: #000000;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #58a6ff;
      --accent-glow: #b620e0;
      --text-main: #f5f5f7;
      --text-muted: #86868b;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ambient background glow to ground the island */
    .ambient-glow {
      position: absolute;
      width: 40vw;
      height: 40vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(88, 166, 255, 0.1) 0%, transparent 70%);
      filter: blur(40px);
      z-index: 1;
      animation: pulseGlow 14s infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.5); opacity: 1; }
    }

    /* 
     * The Dynamic Island / Morphing Container 
     */
    .island {
      position: relative;
      z-index: 10;
      background: var(--island-bg);
      border: 1px solid var(--border);
      box-shadow: 0 4vw 8vw rgba(0,0,0,0.8), inset 0 0 2vw rgba(255,255,255,0.05);
      overflow: hidden;
      display: flex;
      
      /* The master morphing animation */
      animation: islandMorph 14s both;
    }

    @keyframes islandMorph {
      /* Enter as a circle, then expand to pill */
      0%   { width: 4vw;  height: 4vw;  border-radius: 4vw;   transform: scale(0); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
      5%   { width: 22vw; height: 5vw;  border-radius: 2.5vw; transform: scale(1); }
      
      /* Hold Pill -> Morph to Media Player */
      25%  { width: 22vw; height: 5vw;  border-radius: 2.5vw; animation-timing-function: cubic-bezier(0.76, 0, 0.24, 1); }
      33%  { width: 42vw; height: 16vw; border-radius: 3vw; }
      
      /* Hold Media -> Morph to Dashboard */
      55%  { width: 42vw; height: 16vw; border-radius: 3vw; animation-timing-function: cubic-bezier(0.76, 0, 0.24, 1); }
      65%  { width: 85vw; height: 70vh; border-radius: 1.5vw; }
      
      /* Hold Dash -> Shrink to nothing */
      90%  { width: 85vw; height: 70vh; border-radius: 1.5vw; transform: scale(1); animation-timing-function: cubic-bezier(0.76, 0, 0.24, 1); }
      100% { width: 5vw;  height: 5vw;  border-radius: 2.5vw; transform: scale(0); }
    }

    /* State Wrappers */
    .state {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      pointer-events: none;
    }

    /* ---------------------------------
       State 1: The Pill
       --------------------------------- */
    .state-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1vw;
      /* Entrance from 0 (during box pop), exit at 3.4s */
      animation: pillEnter 0.5s 0.2s cubic-bezier(0.16,1,0.3,1) both,
                 pillExit 0.6s 3.2s cubic-bezier(0.76,0,0.24,1) forwards;
    }
    .pill-icon {
      width: 2vw; height: 2vw;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-glow));
      animation: pulseIcon 1.5s infinite alternate;
    }
    .pill-text {
      font-size: 1.2vw;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.05em;
    }

    @keyframes pillEnter {
      0% { opacity: 0; transform: scale(0.5); visibility: hidden; }
      1% { visibility: visible; }
      100% { opacity: 1; transform: scale(1); visibility: visible; }
    }
    @keyframes pillExit {
      0% { opacity: 1; transform: scale(1); visibility: visible; }
      99% { visibility: visible; }
      100% { opacity: 0; transform: scale(0.8) translateY(-1vw); visibility: hidden; }
    }
    @keyframes pulseIcon {
      0% { transform: scale(0.9); box-shadow: 0 0 0 transparent; }
      100% { transform: scale(1.1); box-shadow: 0 0 1vw var(--accent); }
    }

    /* ---------------------------------
       State 2: Media Player / Status
       --------------------------------- */
    .state-media {
      display: flex;
      align-items: center;
      padding: 3vw;
      gap: 2vw;
    }
    .media-art {
      width: 10vw; height: 10vw;
      border-radius: 2vw;
      background: linear-gradient(45deg, #111, #222);
      border: 1px solid var(--border);
      display: flex; justify-content: center; align-items: center;
    }
    .media-art-ring {
      width: 4vw; height: 4vw;
      border-radius: 50%;
      border: 0.4vw solid #333;
      border-top-color: var(--accent);
      animation: spin 1.5s linear infinite;
    }
    .media-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5vw;
    }
    .media-title {
      font-size: 2.2vw;
      font-weight: 800;
      color: var(--text-main);
      margin: 0;
    }
    .media-artist {
      font-size: 1.4vw;
      color: var(--text-muted);
      font-weight: 500;
    }
    .media-waveform {
      display: flex;
      gap: 0.5vw;
      height: 4vw;
      align-items: flex-end;
    }
    .wave-bar {
      width: 1vw; background: var(--text-muted); border-radius: 0.5vw;
      animation: eq 0.6s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; background: var(--text-main); }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; background: var(--accent); }

    /* Media Entrance / Exit staggered */
    .media-art { animation: itemEnter 0.8s 3.8s cubic-bezier(0.16,1,0.3,1) both, itemExit 0.6s 7.4s forwards; }
    .media-info { animation: itemEnter 0.8s 3.9s cubic-bezier(0.16,1,0.3,1) both, itemExit 0.6s 7.5s forwards; }
    .media-waveform { animation: itemEnter 0.8s 4.0s cubic-bezier(0.16,1,0.3,1) both, itemExit 0.6s 7.6s forwards; }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes eq { 0% { height: 1vw; } 100% { height: 4vw; } }

    /* ---------------------------------
       State 3: Full Dashboard
       --------------------------------- */
    .state-dash {
      display: flex;
      padding: 2vw;
      gap: 2vw;
    }
    .dash-sidebar {
      width: 14vw;
      background: #0a0a0c;
      border: 1px solid var(--border);
      border-radius: 1vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2vw 0;
      gap: 1.5vw;
    }
    .nav-dot { width: 3vw; height: 3vw; border-radius: 50%; background: #1a1a24; }
    .nav-dot.active { background: linear-gradient(135deg, var(--accent), var(--accent-glow)); }
    
    .dash-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2vw;
    }
    .dash-header {
      height: 8vw;
      background: #0a0a0c;
      border: 1px solid var(--border);
      border-radius: 1vw;
      display: flex; align-items: center; padding: 0 3vw;
    }
    .dash-title { font-size: 3vw; font-weight: 800; color: var(--text-main); margin: 0; }
    
    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1.5vw;
      flex: 1;
    }
    .dash-card {
      background: #0a0a0c;
      border: 1px solid var(--border);
      border-radius: 1vw;
      padding: 2vw;
      display: flex;
      flex-direction: column;
    }
    .card-large {
      grid-column: 1 / 3;
      flex-direction: row;
      align-items: flex-end;
      gap: 1vw;
    }
    /* Simple Bar Chart inside large card */
    .card-bar { flex: 1; background: #222; border-radius: 0.5vw 0.5vw 0 0; transform-origin: bottom; }
    .card-bar.active { background: var(--accent); }
    
    /* Dash Entrance / Exit staggered */
    .dash-sidebar { animation: itemEnter 0.8s 8.1s cubic-bezier(0.16,1,0.3,1) both, itemExit 0.6s 12.3s forwards; }
    .dash-header  { animation: itemEnter 0.8s 8.2s cubic-bezier(0.16,1,0.3,1) both, itemExit 0.6s 12.4s forwards; }
    .dash-card-1  { animation: itemEnter 0.8s 8.3s cubic-bezier(0.16,1,0.3,1) both, itemExit 0.6s 12.5s forwards; }
    .dash-card-2  { animation: itemEnter 0.8s 8.4s cubic-bezier(0.16,1,0.3,1) both, itemExit 0.6s 12.6s forwards; }
    .card-large   { animation: itemEnter 0.8s 8.5s cubic-bezier(0.16,1,0.3,1) both, itemExit 0.6s 12.7s forwards; }

    /* The chart bars slide up slightly after the card appears */
    .card-bar { animation: barGrow 1s 9.0s cubic-bezier(0.16,1,0.3,1) both; }
    .card-bar:nth-child(1) { height: 40%; animation-delay: 9.0s; }
    .card-bar:nth-child(2) { height: 70%; animation-delay: 9.1s; }
    .card-bar:nth-child(3) { height: 50%; animation-delay: 9.2s; }
    .card-bar:nth-child(4) { height: 90%; animation-delay: 9.3s; }
    .card-bar:nth-child(5) { height: 100%; animation-delay: 9.4s; }


    /* Universal Enter/Exit for nested items */
    @keyframes itemEnter {
      0% { opacity: 0; transform: scale(0.9) translateY(4vw); visibility: hidden; }
      1% { visibility: visible; }
      100% { opacity: 1; transform: scale(1) translateY(0); visibility: visible; }
    }
    @keyframes itemExit {
      0% { opacity: 1; transform: scale(1) translateY(0); visibility: visible; }
      99% { visibility: visible; }
      100% { opacity: 0; transform: scale(0.9) translateY(-2vw); visibility: hidden; }
    }
    @keyframes barGrow {
      0% { transform: scaleY(0); visibility: hidden; }
      1% { visibility: visible; }
      100% { transform: scaleY(1); visibility: visible; }
    }

  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="island">
    
    <!-- State 1: Pill -->
    <div class="state state-pill">
      <div class="pill-icon"></div>
      <div class="pill-text">Secure Sync</div>
    </div>

    <!-- State 2: Media / Status -->
    <div class="state state-media">
      <div class="media-art">
        <div class="media-art-ring"></div>
      </div>
      <div class="media-info">
        <h2 class="media-title">Transferring Data...</h2>
        <div class="media-artist">75% Complete</div>
      </div>
      <div class="media-waveform">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
    </div>

    <!-- State 3: Dashboard -->
    <div class="state state-dash">
      
      <div class="dash-sidebar">
        <div class="nav-dot active"></div>
        <div class="nav-dot"></div>
        <div class="nav-dot"></div>
        <div class="nav-dot" style="margin-top: auto;"></div>
      </div>
      
      <div class="dash-main">
        <div class="dash-header">
          <h1 class="dash-title">System Overview</h1>
        </div>
        <div class="dash-grid">
          <div class="dash-card dash-card-1">
            <div style="font-size: 1.5vw; color: var(--text-muted); font-weight: 600;">CPU Load</div>
            <div style="font-size: 4vw; color: var(--text-main); font-weight: 800; margin-top: auto;">32%</div>
          </div>
          <div class="dash-card dash-card-2">
            <div style="font-size: 1.5vw; color: var(--text-muted); font-weight: 600;">Active Nodes</div>
            <div style="font-size: 4vw; color: var(--text-main); font-weight: 800; margin-top: auto;">1,402</div>
          </div>
          <div class="dash-card card-large">
            <div class="card-bar"></div>
            <div class="card-bar"></div>
            <div class="card-bar"></div>
            <div class="card-bar"></div>
            <div class="card-bar active"></div>
          </div>
        </div>
      </div>
      
    </div>

  </div>

</body>
</html>
