<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Title PhD Research</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; }

  :root {
    /* Academic Paper Theme */
    --bg-main: #F7F5F0;
    --text-main: #1A1A1A;
    --accent: #1E3A8A; /* Oxford Blue */
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background-color: var(--bg-main);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: exitScene 0.8s 10s cubic-bezier(0.36, 0, 0.64, 1) forwards;
  }

  .bg-orb {
    position: absolute;
    width: 120vmin;
    height: 120vmin;
    background: radial-gradient(circle, rgba(30, 58, 138, 0.06) 0%, rgba(30, 58, 138, 0) 70%);
    border-radius: 50%;
    z-index: 0;
    top: 50%; left: 30%;
    transform: translate(-50%, -50%) scale(0.5);
    animation: orbPulse 11s cubic-bezier(0.25, 1, 0.5, 1) both;
  }

  /* Marquee Background */
  .marquee-bg {
    position: absolute;
    width: 100vw; height: 100vh;
    top: 0; left: 0;
    overflow: hidden;
    z-index: 1; 
    opacity: 0.8; 
    mask-image: radial-gradient(ellipse at 30% 50%, black 20%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse at 30% 50%, black 20%, transparent 100%);
  }
  .marquee-container {
    position: absolute;
    top: 50%; left: 0;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 2vmin;
    width: 2000vmin;
  }
  .marquee-row {
    display: flex; flex-direction: row; gap: 2vmin;
    will-change: transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    transform: translateZ(0);
  }
  .svg-card {
    width: 42vmin; 
    height: 30vmin;
    background: transparent; 
    border-radius: 2vmin;
    padding: 1.5vmin;
    box-sizing: border-box; 
    flex-shrink: 0; 
    display: flex; justify-content: center; align-items: center;
  }
  .svg-card img {
    width: 100%;
    height: auto;
  }
  .marquee-row-1 { 
    transform: translateX(0);
    animation: scrollLeft1 11s linear forwards; 
  }
  .marquee-row-2 { 
    transform: translateX(-176vmin);
    animation: scrollRight2 11s linear forwards; 
  }
  .marquee-row-3 { 
    margin-left: -22vmin; /* Brick-lay stagger so it never aligns with row 1 */
    transform: translateX(0);
    animation: scrollLeft3 11s linear forwards; /* Much slower to break lockstep */
  }
  
  @keyframes scrollLeft1 { 
    0% { transform: translateX(0); } 
    100% { transform: translateX(-97vmin); } 
  }
  @keyframes scrollRight2 { 
    0% { transform: translateX(-176vmin); } 
    100% { transform: translateX(-99vmin); } 
  }
  @keyframes scrollLeft3 { 
    0% { transform: translateX(0); } 
    100% { transform: translateX(-61vmin); } 
  }

  .abstract-shapes {
    position: absolute;
    width: 100vw; height: 100vh;
    z-index: 0; 
    overflow: hidden;
  }
  .ring-wrapper {
    position: absolute;
    top: 50%; left: 30%;
  }
  .ring-1-wrap { animation: ringReveal 2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
  .ring-2-wrap { animation: ringReveal 2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
  .ring-3-wrap { animation: ringReveal 2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }

  @keyframes ringReveal {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  
  .ring {
    position: relative;
    border-radius: 50%;
    display: block;
  }
  
  .ring-1 {
    width: 45vmin; height: 45vmin;
    animation: ringSpin1 11s linear forwards;
  }
  .ring-2 {
    width: 65vmin; height: 65vmin;
    border: 0.3vmin solid rgba(30, 58, 138, 0.15);
    animation: ringSpinRev2 11s linear forwards;
  }
  .ring-3 {
    width: 90vmin; height: 90vmin;
    border: 0.6vmin dotted rgba(30, 58, 138, 0.2);
    animation: ringSpin3 11s linear forwards;
  }

  @keyframes ringSpin1 {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(99deg); }
  }
  @keyframes ringSpinRev2 {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-79deg); }
  }
  @keyframes ringSpin3 {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(66deg); }
  }
  
  .title-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 1.5vmin;
    animation: drift 11s cubic-bezier(0.25, 1, 0.5, 1) both;
  }

  .word {
    display: flex;
    align-items: baseline;
  }
  
  .space {
    width: 2vmin;
  }

  .letter {
    font-family: 'Lora', serif;
    font-size: 7.5vmin;
    font-weight: 500;
    color: var(--text-main);
    line-height: 1;
    padding: 0 0.2vmin;
    --delay: calc(0.3s + var(--i) * 0.04s);
    animation: letterReveal 1.2s var(--delay) cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .indent {
    /* Removed arbitrary indent for strict flush-left alignment */
  }

  .subtitle {
    margin-top: 3vmin;
    align-items: center;
    gap: 1.5vmin;
  }

  .letter.sub {
    font-family: 'Inter', sans-serif;
    font-size: 3.2vmin;
    font-weight: 600;
    letter-spacing: 0.3vmin;
    text-transform: uppercase;
    color: var(--text-main);
  }

  .letter.accent {
    color: var(--accent);
    font-weight: 800;
  }

  .line {
    width: 6vmin;
    height: 0.3vmin;
    background: var(--accent);
    transform-origin: left;
    margin-right: 1vmin;
    animation: drawLine 1s 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes letterReveal {
    0% { 
      transform: translateY(100%); 
      clip-path: inset(-50% -50% 100% -50%);
    }
    100% { 
      transform: translateY(0); 
      clip-path: inset(-50% -50% -50% -50%);
    }
  }

  @keyframes drawLine {
    0% { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }

  @keyframes drift {
    0% { transform: scale(0.92); }
    100% { transform: scale(1.05); }
  }

  @keyframes orbPulse {
    0% { transform: translate(-50%, -50%) scale(0.5); }
    100% { transform: translate(-50%, -50%) scale(1.5); }
  }

  @keyframes ringSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(180deg); }
  }
  
  @keyframes ringSpinReverse {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-180deg); }
  }

  @keyframes exitScene {
    0% { transform: translateY(0) scale(1); clip-path: inset(-50% -50% -50% -50%); }
    100% { transform: translateY(-10vmin) scale(0.95); clip-path: inset(0 0 100% 0); }
  }

</style>
</head>
