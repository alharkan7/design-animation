<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Morph - True 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: #030305;
    }
    
    body {
      margin: 0; padding: 0; overflow: hidden;
      background: var(--surface);
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      font-family: 'Inter', system-ui, sans-serif;
    }
    
    .scene {
      position: absolute;
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
      
      /* CRITICAL FOR TRUE 3D: Apply perspective to the camera lens */
      perspective: 1200px;
      
      animation: sceneExit 0.1s forwards 10.5s;
    }
    
    @keyframes sceneExit {
      to { visibility: hidden; opacity: 0; }
    }
    
    .particle-container {
      position: relative;
      width: 0; height: 0; 
      
      /* CRITICAL FOR TRUE 3D: Tells the browser not to flatten the children */
      transform-style: preserve-3d;
      
      /* 
         The Camera Move: 
         We push in (translateZ) and sweep around (rotateY/X) 
         to expose the volumetric depth of the particles!
      */
      animation: cameraRotate 10s cubic-bezier(0.25, 0.1, 0.25, 1) both;
    }
    
    @keyframes cameraRotate {
      0% { transform: translateZ(-400px) rotateX(15deg) rotateY(-40deg); }
      100% { transform: translateZ(150px) rotateX(-5deg) rotateY(40deg); }
    }
    
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      margin-left: -2px; margin-top: -2px;
      border-radius: 50%;
      will-change: transform;
      /* Ensure particles render properly in 3D space */
      backface-visibility: visible;
    }
  </style>
</head>
<body>
  
  <div class="scene">
    <div class="particle-container" id="container"></div>
  </div>

  <script>
    const container = document.getElementById('container');
    const N = 2000; 
    const duration = 10000;

    function mulberry32(a) {
      return function() {
        var t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }
    const rand = mulberry32(888);

    function getTextCoords(text) {
      const c = document.createElement('canvas');
      const w = 1200;
      const h = 600;
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
      
      ctx.fillStyle = '#fff';
      ctx.font = '900 240px system-ui, sans-serif'; 
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, w/2, h/2);
      
      const data = ctx.getImageData(0,0,w,h).data;
      const coords = [];
      for(let y=0; y<h; y+=4) {
        for(let x=0; x<w; x+=4) {
          if (data[(y*w+x)*4] > 128) {
            coords.push({x: x - w/2, y: y - h/2});
          }
        }
      }
      return coords;
    }

    const textCoords = getTextCoords("99.9%");

    for (let j = textCoords.length - 1; j > 0; j--) {
      const k = Math.floor(rand() * (j + 1));
      const temp = textCoords[j];
      textCoords[j] = textCoords[k];
      textCoords[k] = temp;
    }

    // Responsive setup
    const vmin = Math.min(window.innerWidth, window.innerHeight);
    const vmax = Math.max(window.innerWidth, window.innerHeight);
    const textScaleFactor = Math.min(window.innerWidth / 1200, window.innerHeight / 600) * 0.8;

    for (let i = 0; i < N; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      
      const isAccent = (i % 12 === 0);
      if (isAccent) {
        p.style.backgroundColor = '#fbbf24'; 
        p.style.width = '6px';
        p.style.height = '6px';
        p.style.marginLeft = '-3px';
        p.style.marginTop = '-3px';
      } else {
        const grey = Math.floor(120 + rand() * 135); 
        p.style.backgroundColor = `rgb(${grey}, ${grey}, ${grey})`;
      }
      
      // --- SHAPE 1: Offscreen Start ---
      const startAngle = rand() * Math.PI * 2;
      const startR = vmax * 1.5 + rand() * 500;
      const startX = Math.cos(startAngle) * startR;
      const startY = Math.sin(startAngle) * startR;
      const startZ = (rand() * 2000) - 1000; // Deep Z spread

      // --- SHAPE 2: The Globe (True 3D) ---
      const phi = Math.acos(1 - 2 * (i + 0.5) / N);
      const theta = Math.PI * (1 + Math.sqrt(5)) * (i + 0.5);
      const rGlobe = vmin * 0.35; 
      const globeX = rGlobe * Math.cos(theta) * Math.sin(phi);
      const globeY = rGlobe * Math.sin(theta) * Math.sin(phi);
      const globeZ = rGlobe * Math.cos(phi); // True Z coordinate
      
      // --- SHAPE 3: Area Chart (Extruded 3D Ribbon) ---
      const chartW = window.innerWidth * 0.7; 
      const chartH = window.innerHeight * 0.4; 
      let chartX, chartY;
      while(true) {
        const rx = rand(); 
        const ry = rand(); 
        const topEdge = 1 - Math.pow(rx, 3); 
        if (ry >= topEdge) {
          chartX = (rx * chartW) - chartW/2;
          chartY = (ry * chartH) - chartH/2;
          break;
        }
      }
      // Give the chart deep 3D volume
      const chartZ = (rand() * 300) - 150; 

      // --- SHAPE 4: Text ("99.9%") (Volumetric Extrusion) ---
      const tc = textCoords[i % textCoords.length];
      const textX = (tc.x * textScaleFactor) + (rand() * 8 - 4); 
      const textY = (tc.y * textScaleFactor) + (rand() * 8 - 4);
      // Give the text extreme depth so it looks solid when the camera rotates!
      const textZ = (rand() * 200) - 100; 

      // --- SHAPE 5: Offscreen End ---
      const endAngle = rand() * Math.PI * 2;
      const endR = vmax * 1.5 + rand() * 500;
      const endX = Math.cos(endAngle) * endR;
      const endY = Math.sin(endAngle) * endR;
      const endZ = (rand() * 2000) - 1000;

      container.appendChild(p);

      // We now use translate3d(X, Y, Z) to physically move the particles in 3D space
      p.animate([
        { transform: `translate3d(${startX}px, ${startY}px, ${startZ}px) scale(0)`, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' },
        
        { transform: `translate3d(${globeX}px, ${globeY}px, ${globeZ}px) scale(1)`, offset: 0.10 },
        { transform: `translate3d(${globeX}px, ${globeY}px, ${globeZ}px) scale(1)`, offset: 0.30, easing: 'cubic-bezier(0.76, 0, 0.24, 1)' },
        
        { transform: `translate3d(${chartX}px, ${chartY}px, ${chartZ}px) scale(1)`, offset: 0.45 },
        { transform: `translate3d(${chartX}px, ${chartY}px, ${chartZ}px) scale(1)`, offset: 0.60, easing: 'cubic-bezier(0.76, 0, 0.24, 1)' },
        
        { transform: `translate3d(${textX}px, ${textY}px, ${textZ}px) scale(1)`, offset: 0.75 },
        { transform: `translate3d(${textX}px, ${textY}px, ${textZ}px) scale(1)`, offset: 0.90, easing: 'cubic-bezier(0.5, 0, 1, 1)' },
        
        { transform: `translate3d(${endX}px, ${endY}px, ${endZ}px) scale(0)`, offset: 1.0 }
      ], {
        duration: duration,
        fill: 'both',
        delay: rand() * 400 
      });
    }
  </script>
</body>
</html>
