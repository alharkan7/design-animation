<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Topography</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene Setup
        const scene = new THREE.Scene();

        // 2. Camera Setup (Orthographic gives the best data-vis vibe)
        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = 70; // Large to fit the 80x80 grid
        const camera = new THREE.OrthographicCamera(
            frustumSize * aspect / - 2,
            frustumSize * aspect / 2,
            frustumSize / 2,
            frustumSize / - 2,
            1,
            1000
        );
        camera.position.set(40, 40, 40);
        camera.lookAt(0, 0, 0);

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ 
            alpha: true, 
            antialias: true, 
            preserveDrawingBuffer: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // 4. Lighting Setup (Dramatic data-viz style)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 1.5);
        dirLight.position.set(-50, 60, 20); // Side lighting to emphasize spikes
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x88bbff, 0.5);
        fillLight.position.set(50, 10, -50);
        scene.add(fillLight);

        // --- 4.5 Text Sprites (Labels & Legend) ---
        function createTextSprite(text, fontSize = 64, textColor = "#1a2639") {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.font = `bold ${fontSize}px "Outfit", "Inter", sans-serif`;
            ctx.fillStyle = textColor;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            // Subtle white halo ensures it pops on dark models and the default white background
            ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
            ctx.shadowBlur = 15;
            
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false, opacity: 0 });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(40, 10, 1); 
            return sprite;
        }

        const titleSprite = createTextSprite("POPULATION DENSITY INDEX", 60, "#1a2639");
        titleSprite.position.set(0, 32, 0); 
        scene.add(titleSprite);

        const highLegendSprite = createTextSprite("▲ CRITICAL (PEAK)", 48, "#e76f51");
        highLegendSprite.position.set(-15, 26, -10); 
        scene.add(highLegendSprite);

        const lowLegendSprite = createTextSprite("▼ BASELINE (FLAT)", 48, "#2a9d8f");
        lowLegendSprite.position.set(25, 6, 20);
        scene.add(lowLegendSprite);

        const callouts = [];
        
        function createCallout(sprite, targetX, targetZ, gridIndex, colorHex) {
            const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0 });
            // Line from below the text to the floor (will animate to spike height)
            const geo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(sprite.position.x, sprite.position.y - 2, sprite.position.z),
                new THREE.Vector3(targetX, 0, targetZ)
            ]);
            const line = new THREE.Line(geo, mat);
            scene.add(line);
            
            callouts.push({
                line,
                sprite,
                targetX,
                targetZ,
                gridIndex,
                mat
            });
        }

        // Center Peak (wx=0, wz=0) -> grid index (35*70 + 35 = 2485)
        createCallout(highLegendSprite, 0, 0, 2485, 0xe76f51);
        
        // Baseline (wx=25, wz=20) -> grid index (60*70 + 55 = 4255)
        createCallout(lowLegendSprite, 25, 20, 4255, 0x2a9d8f);

        // 5. Build the Data Grid (InstancedMesh)
        const gridWidth = 70;
        const gridDepth = 70;
        const count = gridWidth * gridDepth;

        // Base geometry
        const geometry = new THREE.BoxGeometry(0.85, 1, 0.85);
        // Translate so origin is at the bottom. Scaling Y will scale upwards only.
        geometry.translate(0, 0.5, 0);

        const material = new THREE.MeshStandardMaterial({ 
            color: 0xffffff,
            roughness: 0.2,
            metalness: 0.1
        });

        const instancedMesh = new THREE.InstancedMesh(geometry, material, count);
        instancedMesh.castShadow = true;
        instancedMesh.receiveShadow = true;
        scene.add(instancedMesh);

        // Data arrays for animation
        const targetHeights = new Float32Array(count);
        const currentHeights = new Float32Array(count);
        const dummy = new THREE.Object3D();
        const colorObj = new THREE.Color();

        for (let x = 0; x < gridWidth; x++) {
            for (let z = 0; z < gridDepth; z++) {
                const i = x * gridDepth + z;
                
                // Map to world coordinates centered around 0,0
                const wx = x - gridWidth / 2;
                const wz = z - gridDepth / 2;
                
                // --- Procedural "Data" Generation ---
                // We create a map-like topography with a central cluster and noise
                const dist = Math.sqrt(wx*wx + wz*wz);
                
                // Layers of noise
                const n1 = Math.sin(wx * 0.1) * Math.cos(wz * 0.1) * 3;
                const n2 = Math.sin(wx * 0.3 + 2) * Math.cos(wz * 0.2 + 1) * 1.5;
                const n3 = Math.max(0, 15 - dist * 0.4); // Central mountain
                
                let h = n1 + n2 + n3; 
                // Square it to make peaks sharper and valleys flatter
                h = Math.pow(Math.max(0.1, h), 1.5) * 0.1; 
                
                // Cap the height and set floor
                h = Math.max(0.1, Math.min(25, h));
                
                targetHeights[i] = h;
                currentHeights[i] = 0.1; // Everyone starts flat

                // --- Color Gradient based on target height ---
                if (h < 0.5) {
                    colorObj.setHex(0x1a2639); // Deep dark blue (sea level)
                } else if (h < 2.0) {
                    colorObj.setHex(0x2a9d8f); // Teal
                } else if (h < 6.0) {
                    colorObj.setHex(0xe9c46a); // Yellow/Gold
                } else if (h < 12.0) {
                    colorObj.setHex(0xf4a261); // Orange
                } else {
                    colorObj.setHex(0xe76f51); // Red/Coral (highest peaks)
                }
                
                // Apply color to this instance
                instancedMesh.setColorAt(i, colorObj);
                
                // Set initial transform
                dummy.position.set(wx, 0, wz);
                dummy.scale.set(1, 0.1, 1);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
        }
        instancedMesh.instanceMatrix.needsUpdate = true;
        if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;

        // Base Grid Plane (aesthetically pleasing foundation)
        const basePlaneGeo = new THREE.PlaneGeometry(gridWidth, gridDepth);
        basePlaneGeo.rotateX(-Math.PI / 2);
        const basePlaneMat = new THREE.MeshStandardMaterial({ color: 0x111625, roughness: 0.8 });
        const basePlane = new THREE.Mesh(basePlaneGeo, basePlaneMat);
        basePlane.position.y = -0.1;
        basePlane.receiveShadow = true;
        scene.add(basePlane);

        // 6. Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        // Slow cinematic rotation
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 7. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;

            // --- The Data Sweep Animation ---
            // 10 second loop: 4s build, 4s hold/pulse, 2s wipe
            const loopDuration = 10;
            const cycle = time % loopDuration;
            
            for (let x = 0; x < gridWidth; x++) {
                for (let z = 0; z < gridDepth; z++) {
                    const i = x * gridDepth + z;
                    const wx = x - gridWidth / 2;
                    const wz = z - gridDepth / 2;
                    
                    let target = 0.1;
                    
                    if (cycle < 4) {
                        // 1. Build Phase: Scanner sweeps across X axis
                        const progress = cycle / 4; 
                        const waveX = - (gridWidth/2) + progress * (gridWidth + 20); // Sweep from left to right
                        
                        if (wx < waveX) {
                            target = targetHeights[i];
                            
                            // Pulse on the leading edge of the scanner
                            const distToWave = waveX - wx;
                            if (distToWave < 4 && target > 0.5) {
                                target += Math.sin((4 - distToWave)/4 * Math.PI) * 3;
                            }
                        }
                    } else if (cycle < 8) {
                        // 2. Hold Phase: Full data visible with a subtle organic pulse
                        target = targetHeights[i];
                        if (target > 1) {
                            // Only tall spikes pulse
                            target += Math.sin(time * 3 + wx * 0.2 + wz * 0.2) * (target * 0.05);
                        }
                    } else {
                        // 3. Wipe Phase: Scanner wipes data back to flat
                        const progress = (cycle - 8) / 2;
                        const waveX = - (gridWidth/2) + progress * (gridWidth + 20);
                        
                        if (wx < waveX) {
                            target = 0.1; // Flat
                        } else {
                            target = targetHeights[i];
                        }
                    }
                    
                    // Smoothly lerp current height to target height
                    currentHeights[i] += (target - currentHeights[i]) * 0.15;
                    
                    // Apply to transform
                    dummy.position.set(wx, 0, wz);
                    dummy.scale.set(1, Math.max(0.01, currentHeights[i]), 1);
                    dummy.updateMatrix();
                    instancedMesh.setMatrixAt(i, dummy.matrix);
                }
            }
            
            instancedMesh.instanceMatrix.needsUpdate = true;

            // Animate Labels (Fade in after sweep, fade out on wipe)
            let uiOpacity = 0;
            if (cycle > 3 && cycle < 8.5) {
                uiOpacity = 1;
            } else if (cycle >= 8.5) {
                uiOpacity = Math.max(0, 1 - (cycle - 8.5) * 2);
            } else {
                uiOpacity = Math.min(1, Math.max(0, (cycle - 2.5) * 1.5));
            }
            
            titleSprite.material.opacity += (uiOpacity - titleSprite.material.opacity) * 0.1;
            highLegendSprite.material.opacity += (uiOpacity - highLegendSprite.material.opacity) * 0.1;
            lowLegendSprite.material.opacity += (uiOpacity - lowLegendSprite.material.opacity) * 0.1;

            // Gentle floating effect for title only (legends stay anchored to lines)
            titleSprite.position.y = 32 + Math.sin(time * 2) * 0.5;

            // Update callout lines to perfectly track the current height of their specific data spikes
            callouts.forEach(callout => {
                callout.mat.opacity = callout.sprite.material.opacity;
                
                const h = currentHeights[callout.gridIndex];
                const positions = callout.line.geometry.attributes.position.array;
                
                // Point 1 is positions[0,1,2] (start at sprite, remains static)
                // Point 2 is positions[3,4,5] (end at data spike, actively tracks height)
                positions[3] = callout.targetX;
                positions[4] = h; // Dynamic height!
                positions[5] = callout.targetZ;
                
                callout.line.geometry.attributes.position.needsUpdate = true;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
