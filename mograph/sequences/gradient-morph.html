<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;600;800&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #0d0d1a;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    will-change: transform;
  }

  .blob-1 {
    width: clamp(200px, 50vw, 600px);
    height: clamp(200px, 50vw, 600px);
    background: linear-gradient(135deg, #667eea, #764ba2);
    animation: morph1 8s ease-in-out infinite, fadeIn 2s ease-out forwards;
    opacity: 0;
  }

  .blob-2 {
    width: clamp(250px, 45vw, 550px);
    height: clamp(250px, 45vw, 550px);
    background: linear-gradient(135deg, #f093fb, #f5576c);
    animation: morph2 10s ease-in-out infinite, fadeIn 2s 0.5s ease-out forwards;
    opacity: 0;
  }

  .blob-3 {
    width: clamp(180px, 35vw, 450px);
    height: clamp(180px, 35vw, 450px);
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    animation: morph3 7s ease-in-out infinite, fadeIn 2s 1s ease-out forwards;
    opacity: 0;
  }

  .text-container {
    position: relative;
    z-index: 10;
    text-align: center;
    opacity: 0;
    animation: textReveal 1.5s 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .text-container h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: clamp(3rem, 10vw, 8rem);
    color: white;
    line-height: 0.95;
    margin-bottom: 1rem;
    mix-blend-mode: overlay;
  }

  .text-container p {
    font-family: 'Outfit', sans-serif;
    font-weight: 200;
    font-size: clamp(1rem, 3vw, 2rem);
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    animation: slideUp 1s 2.5s ease-out forwards;
    opacity: 0;
    transform: translateY(20px);
  }

  .glass-card {
    position: absolute;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    opacity: 0;
  }

  .glass-card-1 {
    width: clamp(120px, 25vw, 300px);
    height: clamp(80px, 15vw, 180px);
    top: 10%;
    right: 10%;
    animation: cardFloat 6s ease-in-out infinite, fadeIn 1s 3s ease-out forwards;
  }

  .glass-card-2 {
    width: clamp(100px, 20vw, 250px);
    height: clamp(100px, 20vw, 250px);
    bottom: 12%;
    left: 8%;
    border-radius: 50%;
    animation: cardFloat2 8s ease-in-out infinite, fadeIn 1s 3.5s ease-out forwards;
  }

  @keyframes morph1 {
    0%, 100% { transform: translate(-30%, -20%) scale(1) rotate(0deg); border-radius: 50%; }
    25% { transform: translate(10%, -30%) scale(1.1) rotate(45deg); border-radius: 40% 60% 50% 50%; }
    50% { transform: translate(20%, 10%) scale(0.9) rotate(90deg); border-radius: 50% 40% 60% 50%; }
    75% { transform: translate(-10%, 20%) scale(1.05) rotate(135deg); border-radius: 60% 50% 40% 50%; }
  }

  @keyframes morph2 {
    0%, 100% { transform: translate(20%, 15%) scale(1); border-radius: 50%; }
    33% { transform: translate(-20%, -10%) scale(1.15); border-radius: 45% 55% 50% 50%; }
    66% { transform: translate(10%, -20%) scale(0.85); border-radius: 55% 45% 50% 55%; }
  }

  @keyframes morph3 {
    0%, 100% { transform: translate(10%, -25%) scale(1) rotate(0deg); }
    50% { transform: translate(-25%, 15%) scale(1.2) rotate(180deg); }
  }

  @keyframes fadeIn {
    to { opacity: 0.7; }
  }

  @keyframes textReveal {
    from { opacity: 0; transform: scale(0.9); filter: blur(10px); }
    to { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  @keyframes slideUp {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes cardFloat {
    0%, 100% { transform: translateY(0) rotate(5deg); }
    50% { transform: translateY(-20px) rotate(-3deg); }
  }

  @keyframes cardFloat2 {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(15px) scale(1.05); }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="glass-card glass-card-1"></div>
    <div class="glass-card glass-card-2"></div>
    <div class="text-container">
      <h1>Fluid<br>Motion</h1>
      <p>Organic Visual Flow</p>
    </div>
  </div>
</body>
</html>
