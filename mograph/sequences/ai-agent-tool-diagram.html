<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Tool Diagram V2 - Mograph</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&family=Fira+Code:wght@500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --border-thick: #cbd5e1;
    --text-main: #0f172a;
    --text-muted: #64748b;
    
    --accent-1: #6366f1; /* Indigo */
    --accent-2: #2563eb; /* Blue */
    --accent-3: #10b981; /* Emerald */
    --accent-4: #f59e0b; /* Amber */
    --accent-5: #ef4444; /* Red */
  }

  body, html {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    color-scheme: light;
    overflow: hidden;
  }

  .camera {
    width: 100vw; height: 100vh;
    transform-origin: center center;
    animation: cameraPan 26s linear both;
  }

  .canvas {
    width: 260vmin; height: 320vmin;
    position: absolute; top: 50%; left: 50%;
    margin-top: -160vmin; margin-left: -130vmin;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr 1fr;
  }

  @keyframes cameraPan {
    0% { transform: scale(0) translate(0, 0); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    2% { transform: scale(0.3) translate(0, 0); animation-timing-function: linear; }
    4% { transform: scale(0.3) translate(0, 0); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    
    /* Zoom to User */
    8% { transform: scale(0.9) translate(0vmin, -120vmin); animation-timing-function: linear; }
    10% { transform: scale(0.9) translate(0vmin, -120vmin); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    
    /* Pan to Input (Left, Bottom) */
    14% { transform: scale(0.7) translate(65vmin, -40vmin); animation-timing-function: linear; }
    22% { transform: scale(0.7) translate(65vmin, -40vmin); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    
    /* Pan to Optimize (Left, Middle) */
    26% { transform: scale(0.8) translate(65vmin, 40vmin); animation-timing-function: linear; }
    34% { transform: scale(0.8) translate(65vmin, 40vmin); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    
    /* Pan to Database (Top) */
    38% { transform: scale(0.8) translate(0vmin, 120vmin); animation-timing-function: linear; }
    46% { transform: scale(0.8) translate(0vmin, 120vmin); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    
    /* Pan to Scanning (Right, Middle) */
    50% { transform: scale(0.7) translate(-65vmin, 40vmin); animation-timing-function: linear; }
    62% { transform: scale(0.7) translate(-65vmin, 40vmin); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    
    /* Pan to Ranked (Right, Bottom) */
    66% { transform: scale(0.7) translate(-65vmin, -40vmin); animation-timing-function: linear; }
    80% { transform: scale(0.7) translate(-65vmin, -40vmin); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    
    /* Zoom out to overview */
    85% { transform: scale(0.3) translate(0, 0); animation-timing-function: linear; }
    94% { transform: scale(0.3) translate(0, 0); animation-timing-function: cubic-bezier(0.36, 0, 0.64, 1); }
    
    100% { transform: scale(0) translate(0, 0); }
  }

  @media (orientation: portrait) {
    .camera { animation-name: cameraPanPortrait; }
  }

  @keyframes cameraPanPortrait {
    0% { transform: scale(0) translate(0, 0); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    2% { transform: scale(0.35) translate(0, 0); animation-timing-function: linear; }
    4% { transform: scale(0.35) translate(0, 0); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    8% { transform: scale(0.95) translate(0vmin, -120vmin); animation-timing-function: linear; }
    10% { transform: scale(0.95) translate(0vmin, -120vmin); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    14% { transform: scale(0.8) translate(65vmin, -40vmin); animation-timing-function: linear; }
    22% { transform: scale(0.8) translate(65vmin, -40vmin); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    26% { transform: scale(0.85) translate(65vmin, 40vmin); animation-timing-function: linear; }
    34% { transform: scale(0.85) translate(65vmin, 40vmin); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    38% { transform: scale(0.85) translate(0vmin, 120vmin); animation-timing-function: linear; }
    46% { transform: scale(0.85) translate(0vmin, 120vmin); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    50% { transform: scale(0.8) translate(-65vmin, 40vmin); animation-timing-function: linear; }
    62% { transform: scale(0.8) translate(-65vmin, 40vmin); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    66% { transform: scale(0.8) translate(-65vmin, -40vmin); animation-timing-function: linear; }
    80% { transform: scale(0.8) translate(-65vmin, -40vmin); animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1); }
    85% { transform: scale(0.35) translate(0, 0); animation-timing-function: linear; }
    94% { transform: scale(0.35) translate(0, 0); animation-timing-function: cubic-bezier(0.36, 0, 0.64, 1); }
    100% { transform: scale(0) translate(0, 0); }
  }

  /* --- SVG LINES --- */
  .diagram-lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .trace { stroke-dasharray: 200; stroke-dashoffset: 200; }
  @keyframes traceDraw { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: 0; } }
  
  .t1 { animation: traceDraw 1.0s 2.6s ease-in-out both; }
  .t2 { animation: traceDraw 1.0s 5.7s ease-in-out both; }
  .t3 { animation: traceDraw 1.0s 8.8s ease-in-out both; }
  .t4 { animation: traceDraw 1.0s 11.9s ease-in-out both; }
  .t5 { animation: traceDraw 1.0s 16.1s ease-in-out both; }
  .t6 { animation: traceDraw 1.0s 20.8s ease-in-out both; }

  /* --- ANIMATIONS --- */
  @keyframes showScene { 0% { visibility: hidden; } 100% { visibility: visible; } }
  @keyframes wipeRightIn { 0% { clip-path: inset(0 100% 0 0); transform: translateX(-4vmin); } 100% { clip-path: inset(0 0 0 0); transform: translateX(0); } }
  @keyframes wipeLeftIn { 0% { clip-path: inset(0 0 0 100%); transform: translateX(4vmin); } 100% { clip-path: inset(0 0 0 0); transform: translateX(0); } }
  @keyframes wipeUpIn { 0% { clip-path: inset(100% 0 0 0); transform: translateY(4vmin); } 100% { clip-path: inset(0 0 0 0); transform: translateY(0); } }
  @keyframes slideUpIn { 0% { clip-path: inset(100% 0 0 0); transform: translateY(4vmin); } 100% { clip-path: inset(0 0 0 0); transform: translateY(0); } }
  @keyframes slideDownIn { 0% { clip-path: inset(0 0 100% 0); transform: translateY(-4vmin); } 100% { clip-path: inset(0 0 0 0); transform: translateY(0); } }
  @keyframes scaleIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  @keyframes irisIn { 0% { clip-path: circle(0% at center); transform: scale(0.9); } 100% { clip-path: circle(100% at center); transform: scale(1); } }
  @keyframes spinScaleIn { 0% { transform: rotate(-180deg) scale(0); } 100% { transform: rotate(0deg) scale(1); } }
  @keyframes exitShrink { 0% { transform: scale(1); } 100% { transform: scale(0); } }

  /* --- NODES BASE --- */
  .node {
    position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 2vmin; z-index: 2; background: var(--bg-main); padding: 2vmin; border-radius: 4vmin;
    visibility: hidden; align-self: center; justify-self: center;
  }
  .node-title {
    font-family: 'Fira Code', monospace; font-size: 2.2vmin; color: var(--accent-1);
    letter-spacing: 0.2vmin; font-weight: 700; text-align: center; margin-bottom: 1vmin;
  }

  /* --- MAIN TITLE --- */
  .main-title { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; animation: showScene 0.1s 0s both; }
  .s1-image {
    max-width: 80vmin; max-height: 70vmin;
    border-radius: 2vmin; border: 1px solid var(--border-thick);
    animation: wipeUpIn 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    display: block;
  }

  /* --- USER --- */
  .n-user { grid-column: 1 / span 2; grid-row: 4; width: 20vmin; height: 20vmin; padding: 2vmin; animation: showScene 0.1s 0.5s both; }
  .n-user .node-title { animation: wipeUpIn 0.8s 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .n-user svg { animation: irisIn 0.8s 1.7s cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* --- INPUT --- */
  .n-input { grid-column: 1; grid-row: 3; animation: showScene 0.1s 2.8s both; }
  .search-box {
    background: var(--card-bg); border: 3px solid var(--border); padding: 2vmin 3vmin; border-radius: 4vmin;
    display: flex; align-items: center; gap: 1.5vmin; font-size: 2.5vmin; font-family: 'Fira Code', monospace;
    width: 34vmin; animation: wipeRightIn 0.6s 3.0s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .typing-text { font-weight: 700; color: var(--accent-1); animation: typing 1s 3.5s steps(9, end) both; overflow: hidden; white-space: nowrap; }
  .cursor { color: var(--border-thick); animation: blink 1s 26; }
  @keyframes typing { 0% { max-width: 0; } 100% { max-width: 15vmin; } }
  @keyframes blink { 0%, 49% { visibility: visible; } 50%, 100% { visibility: hidden; } }
  
  .context-mode {
    background: var(--card-bg); border: 3px dashed var(--accent-2); border-radius: 3vmin;
    padding: 2vmin; display: flex; align-items: center; gap: 2vmin; margin-top: 2vmin; width: 34vmin;
    animation: slideUpIn 0.6s 4.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .doc-icon { font-size: 4vmin; }
  .doc-label { font-size: 1.8vmin; font-weight: 800; color: var(--accent-2); text-transform: uppercase; margin-bottom: 1vmin; }
  .doc-lines .d-line { height: 0.8vmin; background: var(--border-thick); border-radius: 1vmin; margin-bottom: 0.6vmin; width: 100%; }
  .doc-lines .d-line.short { width: 60%; }

  /* --- OPTIMIZE --- */
  .n-optimize { grid-column: 1; grid-row: 2; animation: showScene 0.1s 5.8s both; }
  .raw-inputs { display: flex; gap: 1.5vmin; justify-content: center; }
  .raw-pill { border: 2px solid var(--border-thick); background: var(--card-bg); color: var(--text-main); padding: 1vmin 2vmin; border-radius: 2vmin; font-size: 1.8vmin; font-weight: 700; }
  .rp1 { animation: scaleIn 0.5s 6.0s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .rp2 { animation: scaleIn 0.5s 6.2s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .opt-arrow { text-align: center; margin: 1.5vmin 0; animation: wipeUpIn 0.4s 6.8s both; color: var(--border-thick); }
  .optimized-query {
    background: var(--card-bg); border: 4px solid var(--accent-1); padding: 3vmin; border-radius: 3vmin;
    font-family: 'Fira Code', monospace; font-size: 2.2vmin; line-height: 1.6; text-align: center;
    animation: irisIn 0.8s 7.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .b-op { color: var(--accent-1); font-weight: 700; }
  .b-keyword { color: var(--accent-3); font-weight: 700; }
  .b-paren { color: var(--text-muted); }

  /* --- DATABASE --- */
  .n-database { grid-column: 1 / span 2; grid-row: 1; animation: showScene 0.1s 9.0s both; }
  .db-container {
    background: var(--card-bg); border: 4px solid var(--accent-2); border-radius: 4vmin; padding: 4vmin 6vmin;
    display: flex; flex-direction: column; align-items: center; gap: 2vmin;
    animation: wipeUpIn 0.8s 9.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .db-label { font-family: 'Outfit', sans-serif; font-size: 3vmin; font-weight: 800; color: var(--accent-2); text-transform: uppercase; }

  /* --- SCANNING --- */
  .n-scanning { grid-column: 2; grid-row: 2; animation: showScene 0.1s 12.0s both; }
  .scan-container { position: relative; width: 34vmin; height: 32vmin; display: flex; flex-direction: column; gap: 2vmin; justify-content: center; }
  .scan-card { background: var(--card-bg); border: 3px solid var(--border); border-radius: 2vmin; padding: 2.5vmin; position: relative; overflow: hidden; }
  .sc-title { height: 1.5vmin; width: 80%; background: var(--border-thick); border-radius: 1vmin; margin-bottom: 1.5vmin; }
  .sc-title.short { width: 50%; }
  .sc-desc { height: 1vmin; width: 100%; background: var(--border); border-radius: 1vmin; margin-bottom: 0.8vmin; }
  
  .sc1 { animation: slideDownIn 0.5s 12.2s cubic-bezier(0.34, 1.56, 0.64, 1) both, flashBorder 0.4s 13.5s both; }
  .sc2 { animation: slideDownIn 0.5s 12.4s cubic-bezier(0.34, 1.56, 0.64, 1) both, flashBorder 0.4s 14.2s both; }
  .sc3 { animation: slideDownIn 0.5s 12.6s cubic-bezier(0.34, 1.56, 0.64, 1) both, flashBorder 0.4s 14.9s both; }
  
  @keyframes flashBorder { 0%, 100% { border-color: var(--border); } 50% { border-color: var(--accent-3); } }

  .scan-line {
    position: absolute; top: 0; left: -5%; width: 110%; height: 0.8vmin;
    background: var(--accent-3); z-index: 10; border-radius: 1vmin;
    animation: scanMove 2.5s 13.0s cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes scanMove { 0% { transform: translateY(0vmin) scaleY(0); } 10% { transform: translateY(3vmin) scaleY(1); } 90% { transform: translateY(29vmin) scaleY(1); } 100% { transform: translateY(32vmin) scaleY(0); } }

  /* --- RANKED --- */
  .n-ranked { grid-column: 2; grid-row: 3; animation: showScene 0.1s 16.0s both; }
  .ranked-list { position: relative; width: 36vmin; height: 38vmin; }
  .rank-item-wrapper { position: absolute; left: 0; width: 100%; }
  .rank-item {
    background: var(--card-bg); border: 3px solid var(--border); border-radius: 2vmin;
    padding: 2vmin 3vmin; display: flex; align-items: center; gap: 3vmin;
  }
  
  #ri-A-wrap { top: 0vmin; animation: moveDownA 1s 18.2s cubic-bezier(0.64, 0, 0.36, 1) both; z-index: 1; }
  #ri-A { animation: wipeLeftIn 0.5s 16.2s both; }
  
  #ri-B-wrap { top: 12vmin; animation: moveUpB 1s 18.2s cubic-bezier(0.64, 0, 0.36, 1) both; z-index: 2; }
  #ri-B { border-color: var(--border); animation: wipeLeftIn 0.5s 16.4s both, highlightB 1s 18.2s forwards; }
  @keyframes highlightB { 100% { border-color: var(--accent-3); } }
  
  #ri-C-wrap { top: 24vmin; animation: moveUpC 1s 18.2s cubic-bezier(0.64, 0, 0.36, 1) both; z-index: 1; }
  #ri-C { animation: wipeLeftIn 0.5s 16.6s both; }

  @keyframes moveDownA { 0% { transform: translateY(0); } 100% { transform: translateY(24vmin); } }
  @keyframes moveUpB { 0% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6vmin) scale(1.05); z-index: 10; } 100% { transform: translateY(-12vmin) scale(1); z-index: 10; } }
  @keyframes moveUpC { 0% { transform: translateY(0); } 100% { transform: translateY(-12vmin); } }

  .score-badge { width: 7vmin; height: 7vmin; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 3vmin; color: #fff; }
  .score-high { background: var(--accent-3); }
  .score-mid { background: var(--accent-4); }
  .score-low { background: var(--accent-5); }

  #ri-A .score-badge { animation: scaleIn 0.5s 17.2s both; }
  #ri-B .score-badge { animation: scaleIn 0.5s 17.4s both; }
  #ri-C .score-badge { animation: scaleIn 0.5s 17.6s both; }

  .ri-content { flex: 1; }
  .ri-title { height: 1.5vmin; background: var(--border-thick); border-radius: 1vmin; margin-bottom: 1.5vmin; width: 100%; }
  .ri-title.short { width: 70%; }
  .ri-desc { height: 1vmin; background: var(--border); border-radius: 1vmin; width: 100%; margin-bottom: 0.8vmin; }
  .ri-desc.short { width: 50%; }
</style>
</head>
<body>

  <div class="camera">
    <div class="canvas">

      <!-- SVG Traces -->
      <svg class="diagram-lines" viewBox="0 0 260 320" preserveAspectRatio="none">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--border-thick)" />
          </marker>
          <marker id="arrow-animated" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent-2)" />
          </marker>
        </defs>

        <path d="M 120 280 C 65 280, 65 250, 65 215" fill="none" stroke="var(--border-thick)" stroke-width="0.6" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
        <path d="M 65 185 L 65 135" fill="none" stroke="var(--border-thick)" stroke-width="0.6" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
        <path d="M 65 105 C 65 40, 90 40, 115 40" fill="none" stroke="var(--border-thick)" stroke-width="0.6" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
        <path d="M 145 40 C 195 40, 195 70, 195 102" fill="none" stroke="var(--border-thick)" stroke-width="0.6" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
        <path d="M 195 138 L 195 179" fill="none" stroke="var(--border-thick)" stroke-width="0.6" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
        <path d="M 195 221 C 195 280, 170 280, 140 280" fill="none" stroke="var(--border-thick)" stroke-width="0.6" stroke-dasharray="2 2" marker-end="url(#arrow)"/>

        <path class="trace t1" d="M 120 280 C 65 280, 65 250, 65 215" fill="none" stroke="var(--accent-2)" stroke-width="1.0" marker-end="url(#arrow-animated)" />
        <path class="trace t2" d="M 65 185 L 65 135" fill="none" stroke="var(--accent-2)" stroke-width="1.0" marker-end="url(#arrow-animated)" />
        <path class="trace t3" d="M 65 105 C 65 40, 90 40, 115 40" fill="none" stroke="var(--accent-2)" stroke-width="1.0" marker-end="url(#arrow-animated)" />
        <path class="trace t4" d="M 145 40 C 195 40, 195 70, 195 102" fill="none" stroke="var(--accent-2)" stroke-width="1.0" marker-end="url(#arrow-animated)" />
        <path class="trace t5" d="M 195 138 L 195 179" fill="none" stroke="var(--accent-2)" stroke-width="1.0" marker-end="url(#arrow-animated)" />
        <path class="trace t6" d="M 195 221 C 195 280, 170 280, 140 280" fill="none" stroke="var(--accent-2)" stroke-width="1.0" marker-end="url(#arrow-animated)" />
      </svg>

      <!-- Nodes -->
      <div class="node n-database">
        <div class="node-title">DATABASE SEARCH</div>
        <div class="db-container">
          <svg width="8vmin" height="8vmin" viewBox="0 0 24 24" fill="none" stroke="var(--accent-2)" stroke-width="2">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
          </svg>
          <div class="db-label">Scientific Repos</div>
        </div>
      </div>

      <div class="node n-optimize">
        <div class="node-title">QUERY OPTIMIZATION</div>
        <div class="opt-container">
          <div class="raw-inputs">
             <div class="raw-pill rp1">"AI agents"</div>
             <div class="raw-pill rp2">Context Doc</div>
          </div>
          <div class="opt-arrow">
            <svg width="4vmin" height="4vmin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
          </div>
          <div class="optimized-query">
             <span class="b-paren">(</span><span class="b-keyword">"AI agents"</span> <span class="b-op">OR</span> <span class="b-keyword">"autonomous"</span><span class="b-paren">)</span><br>
             <span class="b-op">AND</span> <span class="b-keyword">"applications"</span>
          </div>
        </div>
      </div>

      <div class="node n-scanning">
        <div class="node-title">AI REVIEW & SCORING</div>
        <div class="scan-container">
          <div class="scan-card sc1"><div class="sc-title"></div><div class="sc-desc"></div><div class="sc-desc"></div></div>
          <div class="scan-card sc2"><div class="sc-title short"></div><div class="sc-desc"></div><div class="sc-desc"></div></div>
          <div class="scan-card sc3"><div class="sc-title"></div><div class="sc-desc"></div><div class="sc-desc short"></div></div>
          <div class="scan-line"></div>
        </div>
      </div>

      <div class="node n-input">
        <div class="node-title">USER INPUT</div>
        <div class="input-container">
          <div class="search-box">
             <svg width="3vmin" height="3vmin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
               <circle cx="11" cy="11" r="8"></circle>
               <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
             </svg>
             <span class="typing-text">AI agents</span>
             <span class="cursor">|</span>
          </div>
          <div class="context-mode">
             <div class="doc-icon">
