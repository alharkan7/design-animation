<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geospatial Map & Flight Path Tracing</title>
  <style>
    :root {
      --grid: rgba(255, 255, 255, 0.08);
      --land: #1E293B;
      --land-stroke: #0F172A;
      --accent-1: #00FFCC; /* Neon Cyan */
      --accent-2: #FF00CC; /* Neon Pink */
      --accent-3: #FFD700; /* Gold */
      --text-main: #FFFFFF;
      --text-muted: #8892B0;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      /* Background is handled dynamically by Mograph Player */
    }

    /* Fixed Aspect Ratio Container (1920x1080) */
    .scaler {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      transform-origin: center;
      /* Script will apply the exact decimal scale */
      transform: translate(-50%, -50%) scale(1);
    }

    .scene {
      width: 100%;
      height: 100%;
      position: relative;
      /* Animate the entire scene out at the end */
      animation: sceneOut 1s 12s cubic-bezier(0.76, 0, 0.24, 1) forwards;
    }

    @keyframes sceneOut {
      0% { transform: scale(1); opacity: 1; filter: blur(0px); }
      100% { transform: scale(1.1); opacity: 0; filter: blur(10px); }
    }

    /* 3D Camera / Isometric Tilt Wrapper */
    .tilt-wrapper {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      perspective: 3000px;
      /* Dynamic camera pan */
      animation: cameraPan 10s linear both;
    }

    @keyframes cameraPan {
      0% {
        transform: rotateX(55deg) rotateZ(-25deg) translate3d(500px, 250px, 100px) scale(2.2);
        animation-timing-function: linear;
      }
      15% {
        transform: rotateX(55deg) rotateZ(-25deg) translate3d(500px, 250px, 100px) scale(2.2);
        animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1);
      }
      30% {
        transform: rotateX(55deg) rotateZ(-20deg) translate3d(-50px, 350px, 100px) scale(2.2);
        animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1);
      }
      45% {
        transform: rotateX(55deg) rotateZ(-15deg) translate3d(-150px, -200px, 100px) scale(2.2);
        animation-timing-function: cubic-bezier(0.64, 0, 0.36, 1);
      }
      60% {
        transform: rotateX(55deg) rotateZ(-25deg) translate3d(500px, 250px, 100px) scale(2.2);
        animation-timing-function: linear;
      }
      70% {
        transform: rotateX(55deg) rotateZ(-25deg) translate3d(500px, 250px, 100px) scale(2.2);
        animation-timing-function: cubic-bezier(0.76, 0, 0.24, 1);
      }
      90% {
        transform: rotateX(60deg) rotateZ(-30deg) translate3d(150px, 50px, 0px) scale(0.9);
        animation-timing-function: linear;
      }
      100% {
        transform: rotateX(60deg) rotateZ(-30deg) translate3d(150px, 50px, 0px) scale(0.9);
      }
    }

    /* The Map Canvas */
    .map-plane {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2400px;
      height: 1600px;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      backface-visibility: hidden;
      
      /* Grid background to show the floor */
      background-image: 
        linear-gradient(var(--grid) 2px, transparent 2px),
        linear-gradient(90deg, var(--grid) 2px, transparent 2px);
      background-size: 80px 80px;
      background-position: center;
      border: 2px solid var(--grid);
      border-radius: 40px;
    }

    .map-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      backface-visibility: hidden;
      transform: translateZ(0);
      will-change: transform;
    }

    /* Base Map Graphics */
    .landmass {
      fill: var(--land);
      stroke: var(--land-stroke);
      stroke-width: 4;
      stroke-linejoin: round;
      
    }

    /* Flight Paths */
    .flight-path {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      filter: drop-shadow(0 0 15px currentColor);
    }

    #path-1 {
      stroke: var(--accent-1);
      /* Exact length calculated in Node */
      --len: 761.9362667494995;
      stroke-dasharray: calc(var(--len) * 1px);
      stroke-dashoffset: calc(var(--len) * 1px);
      animation: drawPath 1.5s 1.5s cubic-bezier(0.64, 0, 0.36, 1) both;
    }

    #path-2 {
      stroke: var(--accent-2);
      --len: 653.3022700503517;
      stroke-dasharray: calc(var(--len) * 1px);
      stroke-dashoffset: calc(var(--len) * 1px);
      animation: drawPath 1.5s 3.0s cubic-bezier(0.64, 0, 0.36, 1) both;
    }

    #path-3 {
      stroke: var(--accent-3);
      --len: 929.1404417939842;
      stroke-dasharray: calc(var(--len) * 1px);
      stroke-dashoffset: calc(var(--len) * 1px);
      animation: drawPath 1.5s 4.5s cubic-bezier(0.64, 0, 0.36, 1) both;
    }

    @keyframes drawPath {
      0% { stroke-dashoffset: calc(var(--len) * 1px); }
      100% { stroke-dashoffset: 0; }
    }

    /* Traveling Packets (The "Planes") */
    .packet {
      position: absolute;
      left: 0; top: 0;
      width: 24px;
      height: 24px;
      background: currentColor;
      border-radius: 50%;
      box-shadow: 0 0 20px currentColor, 0 0 40px currentColor;
      /* Auto align rotation with the path */
      offset-anchor: auto;
      offset-rotate: auto;
      z-index: 10;
    }

    .packet.cyan { 
      color: var(--accent-1); 
      offset-path: path('M 709.1736208322491,529.98248507174 C 809.1736208322491,229.98248507174003 1157.5818677752118,167.65192546770191 1257.5818677752118,467.6519254677019'); 
      animation: flyPacket 1.5s 1.5s cubic-bezier(0.64, 0, 0.36, 1) both; 
    }
    .packet.pink { 
      color: var(--accent-2); 
      offset-path: path('M 1257.5818677752118,467.6519254677019 C 1057.5818677752118,667.6519254677019 1122.1872895262993,824.9984572957333 1322.1872895262993,1024.9984572957333'); 
      animation: flyPacket 1.5s 3.0s cubic-bezier(0.64, 0, 0.36, 1) both; 
    }
    .packet.gold { 
      color: var(--accent-3); 
      offset-path: path('M 1322.1872895262993,1024.9984572957333 C 1022.1872895262993,924.9984572957333 509.17362083224907,829.98248507174 709.1736208322491,529.98248507174'); 
      animation: flyPacket 1.5s 4.5s cubic-bezier(0.64, 0, 0.36, 1) both; 
    }

    /* Squash & Stretch velocity effect during the flight */
    @keyframes flyPacket {
      0% { offset-distance: 0%; transform: scale(0); opacity: 0; }
      10% { transform: scale(1); opacity: 1; }
      90% { transform: scale(1); opacity: 1; }
      100% { offset-distance: 100%; transform: scale(0); opacity: 0; }
    }

    /* 3D Location Pins */
    .pin {
      position: absolute;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      /* Rotate -90deg on X to stand upright exactly against the floor */
      transform: rotateX(-90deg) scale(0);
      animation: pinDrop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .pin-marker {
      width: 24px;
      height: 24px;
      background: currentColor;
      border-radius: 50%;
      position: absolute;
      left: -12px;
      top: -12px;
      box-shadow: 0 0 30px currentColor;
      border: 4px solid rgba(0,0,0,0.8);
    }

    .pin-stem {
      width: 4px;
      height: 120px;
      background: linear-gradient(to bottom, currentColor, transparent);
      position: absolute;
      left: -2px;
      top: 0;
      opacity: 0.5;
    }

    .pin-label {
      position: absolute;
      left: 24px;
      top: -48px;
      background: rgba(10,15,25,0.9);
      border: 2px solid rgba(255,255,255,0.15);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      white-space: nowrap;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    @keyframes pinDrop {
      0% { transform: rotateX(-90deg) translateY(-200px) scale(0); opacity: 0; }
      100% { transform: rotateX(-90deg) translateY(0) scale(1); opacity: 1; }
    }

    /* Pings (Ripples on the map floor) */
    .ping {
      position: absolute;
      width: 200px;
      height: 200px;
      border: 6px solid currentColor;
      border-radius: 50%;
      left: -100px;
      top: -100px;
      transform: scale(0);
      opacity: 0;
      animation: ripple 2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes ripple {
      0% { transform: scale(0); opacity: 1; stroke-width: 12px; }
      100% { transform: scale(2); opacity: 0; stroke-width: 0px; }
    }

    /* Node Positioning & Delays */
    .node-a { left: 709.1736208322491px; top: 529.98248507174px; color: var(--accent-1); }
    .node-a .pin { animation-delay: 1.0s; }
    .node-a .ping { animation-delay: 1.2s; }

    .node-b { left: 1257.5818677752118px; top: 467.6519254677019px; color: var(--accent-2); }
    .node-b .pin { animation-delay: 2.5s; }
    .node-b .ping { animation-delay: 2.7s; }

    .node-c { left: 1322.1872895262993px; top: 1024.9984572957333px; color: var(--accent-3); }
    .node-c .pin { animation-delay: 4.0s; }
    .node-c .ping { animation-delay: 4.2s; }

    /* Foreground UI Panel */
    .ui-panel {
      position: absolute;
      right: 60px;
      top: 60px;
      background: rgba(10, 15, 25, 0.85);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 32px;
      width: 320px;
      backdrop-filter: blur(24px);
      box-shadow: 0 40px 80px rgba(0,0,0,0.8);
      animation: panelIn 1.2s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes panelIn {
      0% { transform: translateX(150px) scale(0.9); opacity: 0; }
      100% { transform: translateX(0) scale(1); opacity: 1; }
    }

    .ui-panel h1 {
      margin: 0 0 12px 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .ui-panel p {
      margin: 0 0 24px 0;
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 2px solid rgba(255,255,255,0.1);
      margin-bottom: 16px;
    }

    .stat-row:last-child {
      margin-bottom: 0;
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-muted);
      font-family: monospace;
      text-transform: uppercase;
    }

    .stat-val {
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* Animating Stats in sequence with the nodes */
    .stat-val-a { color: var(--accent-1); animation: popVal 0.6s 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    .stat-val-b { color: var(--accent-2); animation: popVal 0.6s 2.7s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    .stat-val-c { color: var(--accent-3); animation: popVal 0.6s 4.2s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

    @keyframes popVal {
      0% { transform: scale(0.2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

  </style>
</head>
<body>

  <div class="scene">
    
    <!-- 3D Camera / Map -->
    <div class="tilt-wrapper">
      <div class="map-plane">
