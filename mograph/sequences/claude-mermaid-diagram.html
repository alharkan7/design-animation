<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Mermaid Diagram</title>
  <style>
    :root {
      color-scheme: light;
      --canvas-bg: transparent;
      --surface-1: #f8fafc;
      --surface-2: #ffffff; 
      --surface-3: #f1f5f9; 
      --surface-4: #e2e8f0;
      --accent-1: #3b82f6;
      --text-main: #0f172a; 
      --text-muted: #64748b;
      --border: #e2e8f0;
      
      --mermaid-bg: #ffffff;
      --mermaid-border: #cbd5e1;
      --mermaid-text: #334155;
    }

    body {
      margin: 0; padding: 0; overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      width: 100vw; height: 100vh;
      background-color: var(--canvas-bg);
    }

    .sequence-container {
      position: relative; width: 100vw; height: 100vh;
      font-size: min(1.3vw, 2.2vh); 
    }

    /* SCENE MAIN */
    .scene-main {
      position: absolute; width: 100vw; height: 100vh;
      box-sizing: border-box; display: flex; flex-direction: column;
      visibility: visible; overflow: hidden; z-index: 1;
      align-items: center; justify-content: center;
      animation: sceneWipeOut 0.5s cubic-bezier(0.76, 0, 0.24, 1) 18.5s forwards;
    }

    @keyframes sceneWipeOut {
      0% { visibility: visible; transform: scale(1); opacity: 1; filter: saturate(1); }
      100% { visibility: hidden; transform: scale(0.95); opacity: 0; filter: saturate(0.5); }
    }

    .camera-pan {
      width: 100vw; height: 100vh; position: absolute; top: 0; left: 0;
      animation: camPan 19s cubic-bezier(0.76, 0, 0.24, 1) forwards;
    }
    @keyframes camPan {
      0%, 55.26% { transform: translateX(0); }
      58.95%, 65.79% { transform: translateX(-200vw); }
      69.47%, 100% { transform: translateX(0); }
    }

    .camera-zoom {
      width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    
    @media (min-aspect-ratio: 1/1) {
      .vertical-layout { display: none !important; }
      .horizontal-layout { display: block; }
      
      .diagram-container.left { left: -55.25em; top: 12em; }
      .diagram-container.right { left: 70.25em; top: 12em; }
      
      .camera-zoom { animation: camZoom 19s cubic-bezier(0.76, 0, 0.24, 1) forwards; }
      @keyframes camZoom {
        0%, 11.05% { transform: scale(2.5) translate(-18.7em, 14.75em); }
        16.32%, 35.79% { transform: scale(1) translate(0, 0); }
        41.05%, 58.95% { transform: scale(0.4) translate(-2.25em, -3em); }
        59.00%, 100% { transform: scale(1.8) translate(-2.25em, -6em); }
      }
    }

    @media (max-aspect-ratio: 1/1) {
      .vertical-layout { display: block; }
      .horizontal-layout { display: none !important; }
      
      .diagram-container.left { left: 7.5em; top: 42em; }
      .diagram-container.right { left: 7.5em; top: 74em; }
      
      .camera-zoom { animation: camZoomVert 19s cubic-bezier(0.76, 0, 0.24, 1) forwards; }
      @keyframes camZoomVert {
        0%, 11.05% { transform: scale(2.5) translate(-18.7em, 14.75em); }
        16.32%, 35.79% { transform: scale(1) translate(0, 0); }
        41.05%, 58.95% { transform: scale(0.9) translate(-5.25em, -35em); }
        59.00%, 100% { transform: scale(1.2) translate(-2em, -8em); }
      }
    }

    .chat-ui {
      width: 65em; height: 44em;
      background: transparent;
      border: 0.1em solid transparent;
      border-radius: 1.5em;
      display: flex; flex-direction: column;
      box-shadow: none;
      animation: 
        uiReveal 0.5s cubic-bezier(0.76, 0, 0.24, 1) 2.1s forwards, 
        uiFadeToTransparent 0.5s 6.8s forwards;
      position: relative;
    }
    @keyframes uiReveal {
      0% { background-color: transparent; border-color: transparent; box-shadow: none; }
      100% { background-color: var(--surface-2); border-color: var(--border); box-shadow: 0 1em 3em rgba(0,0,0,0.1); }
    }
    @keyframes uiFadeToTransparent {
      100% { background-color: transparent; border-color: transparent; box-shadow: none; }
    }

    .chat-header {
      height: 3.5em;
      border-bottom: 0.1em solid var(--border);
      display: flex; align-items: center; padding: 0 1.5em;
      gap: 0.6em;
      opacity: 0;
      animation: headerReveal 0.5s cubic-bezier(0.76, 0, 0.24, 1) 2.1s forwards, elementFadeOut 0.5s 6.8s forwards;
    }
    @keyframes headerReveal {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes elementFadeOut {
      100% { opacity: 0; visibility: hidden; }
    }
    
    .chat-header-dot { width: 0.9em; height: 0.9em; border-radius: 50%; }
    
    .chat-body {
      flex: 1; padding: 2em 3em; display: flex; flex-direction: column; gap: 2.5em;
      position: relative;
    }

    .chat-bubble-user {
      align-self: flex-end;
      background: var(--surface-3);
      border-radius: 1em 1em 0 1em;
      border: 0.05em solid var(--border);
      font-size: 1.2em; font-weight: 500; color: var(--text-main);
      box-shadow: 0 0.4em 0.8em rgba(0,0,0,0.05);
      z-index: 10;
      
      box-sizing: border-box;
      overflow: hidden;
      white-space: nowrap;
      padding: 1em 1.5em;
      height: 3.5em;
      animation: 
        bubblePop 0.3s cubic-bezier(0.76, 0, 0.24, 1) 0.2s both,
        typing 1.5s steps(35, end) 0.5s forwards,
        fadeOutFast 0.5s ease 12s forwards;
    }

    @keyframes bubblePop {
      0% { width: 3em; opacity: 0; transform: scale(0.5); }
      100% { width: 4em; opacity: 1; transform: scale(1); }
    }
    @keyframes typing {
      0% { width: 4em; }
      100% { width: 18em; } 
    }

    .chat-bubble-ai {
      align-self: flex-start;
      display: flex; gap: 1.5em;
      width: 100%;
      flex: 1;
      animation: aiEnter 0.6s cubic-bezier(0.76, 0, 0.24, 1) 3.0s both;
    }
    @keyframes aiEnter {
      0% { visibility: hidden; transform: translateY(2vh); opacity: 0; }
      1% { visibility: visible; }
      100% { visibility: visible; transform: translateY(0); opacity: 1; }
    }
    
    .ai-avatar {
      width: 3em; height: 3em; border-radius: 0.8em; 
      background: #d97757;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      border: 0.05em solid #d97757;
      animation: fadeOutFast 0.5s ease 12s forwards;
    }
    .ai-avatar svg { width: 1.5em; height: 1.5em; fill: #ffffff; }
    
    /* Branch Lines */
    .branch-lines {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;
      animation: fadeOutFast 0.5s ease 12s forwards;
    }
    .draw-path {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: svgDraw 0.6s cubic-bezier(0.76, 0, 0.24, 1) 7.2s forwards;
    }
    @keyframes svgDraw {
      100% { stroke-dashoffset: 0; }
    }

    /* The Diagram Containers */
    .diagram-container {
      flex: 1; background: var(--mermaid-bg); border: 0.1em solid var(--mermaid-border);
      border-radius: 2em; padding: 2.5em 0;
      display: flex; flex-direction: column; align-items: center;
      position: relative;
    }
    .diagram-container.center {
      background: var(--surface-2); border-color: var(--border);
      animation: uiFadeToTransparent 0.5s ease 12s forwards;
    }
    .diagram-container.left, .diagram-container.right {
      position: absolute; width: 54.5em; height: 28em; opacity: 0;
      animation: fadeOutFast 0.5s ease 12s forwards;
    }
    .diagram-container.left {
      --mermaid-bg: #eff6ff; --mermaid-border: #bfdbfe; --mermaid-text: #1e40af;
      animation: s2DiagEnterLeft 0.6s cubic-bezier(0.76, 0, 0.24, 1) 7.3s forwards, fadeOutFast 0.5s ease 12s forwards;
    }
    .diagram-container.right {
      --mermaid-bg: #ecfdf5; --mermaid-border: #a7f3d0; --mermaid-text: #065f46;
      animation: s2DiagEnterRight 0.6s cubic-bezier(0.76, 0, 0.24, 1) 7.5s forwards, fadeOutFast 0.5s ease 12s forwards;
    }

    @keyframes s2DiagEnterLeft {
      0% { transform: translateX(5em); opacity: 0; } 100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes s2DiagEnterRight {
      0% { transform: translateX(-5em); opacity: 0; } 100% { transform: translateX(0); opacity: 1; }
    }

    /* Mermaid tag */
    .mermaid-tag {
      position: absolute; top: 1em; right: 1.5em;
      background: var(--mermaid-bg); border: 0.05em solid var(--mermaid-border);
      color: var(--mermaid-text); font-size: 0.8em; font-weight: 700;
      padding: 0.5em 1em; border-radius: 0.5em; letter-spacing: 2px;
      animation: tagPop 0.6s cubic-bezier(0.76, 0, 0.24, 1) 4.2s both, fadeOutFast 0.5s ease 12s forwards;
    }
    @keyframes tagPop {
      0% { visibility: hidden; transform: scale(0); }
      1% { visibility: visible; }
      100% { visibility: visible; transform: scale(1); }
    }

    @keyframes fadeOutFast {
      0% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* Diagram Nodes */
    .diagram-row { display: flex; position: relative; z-index: 5; }
    .diagram-row.node-1 { margin-bottom: 2em; }
    .diagram-row.node-2 { margin-bottom: 2em; }
    .diagram-row.node-3 { margin-bottom: 4em; }
    .diagram-row.node-4 { gap: 8em; }
    
    .diagram-node {
      width: 12em; height: 3em;
      background: var(--mermaid-bg); border: 0.1em solid var(--mermaid-border);
      color: var(--mermaid-text); display: flex; align-items: center; justify-content: center;
      font-family: monospace; font-size: 0.9em; font-weight: bold;
      border-radius: 2em; text-align: center;
      animation: nodeEnter 0.5s cubic-bezier(0.76, 0, 0.24, 1) var(--delay) both;
    }

    @keyframes nodeEnter {
      0% { visibility: hidden; transform: translateY(2vh); opacity: 0; }
      1% { visibility: visible; }
      100% { visibility: visible; transform: translateY(0); opacity: 1; }
    }

    /* Diagram Connections */
    .conn-line {
      position: absolute; background: var(--mermaid-border);
      animation: lineDraw var(--dur) linear var(--delay) both;
    }
    .conn-line.static { position: relative; }
    .conn-line.vertical { width: 0.1em; animation-name: drawV; }
    .conn-line.horizontal { height: 0.1em; animation-name: drawH; }

    @keyframes drawV {
      0% { visibility: hidden; transform: scaleY(0); }
      1% { visibility: visible; }
      100% { visibility: visible; transform: scaleY(1); }
    }
    @keyframes drawH {
      0% { visibility: hidden; transform: scaleX(0); }
      1% { visibility: visible; }
      100% { visibility: visible; transform: scaleX(1); }
    }
    
    .branch-label {
      position: absolute; color: var(--mermaid-text); font-size: 0.8em; font-family: monospace;
      animation: tagPop 0.3s cubic-bezier(0.76, 0, 0.24, 1) var(--delay) both;
    }

    /* LIMIT BANNER SECTION */
    .limit-section {
      position: absolute;
      top: 50%; left: calc(50% + 200vw);
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .limit-card {
      background: var(--surface-2); border: 0.1em solid var(--border); border-radius: 1.5em;
      padding: 4em 6em; display: flex; flex-direction: column; align-items: center; gap: 1em;
      box-shadow: 0 1em 4em rgba(0,0,0,0.1);
    }
    @keyframes limitCardExit {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0; }
    }

    .limit-icon { width: 5em; height: 5em; fill: #d97757; margin-bottom: 1em; }
    .limit-title { font-size: 2.2em; font-weight: 900; color: #d97757; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
    .limit-sub { font-size: 1.2em; color: var(--text-muted); white-space: nowrap; }

    /* SVG FREEFORM DIAGRAM (Scene 2 overlap) */
    .diagram-svg-freeform {
      position: absolute; inset: -0.1em;
      border-radius: 2em;
      background: radial-gradient(circle at top, #ffffff, #f8fafc);
      border: 0.1em solid #e2e8f0;
      box-shadow: 0 0 3em rgba(0,0,0,0.1), inset 0 0 1em rgba(0,0,0,0.05);
      z-index: 20;
      clip-path: inset(0 100% 0 0);
      animation: svgWipe 1.5s cubic-bezier(0.76, 0, 0.24, 1) 13.5s forwards;
      overflow: hidden;
    }

    @keyframes svgWipe {
      0% { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 0 0 0); }
    }

    .wipe-scanner {
      position: absolute; top: 0; left: 0; width: 0.5em; height: 100%;
      background: #8b5cf6;
      box-shadow: 0 0 2em 1em #8b5cf6;
      transform: translateX(-100%);
      animation: scanWipe 1.5s cubic-bezier(0.76, 0, 0.24, 1) 13.5s forwards;
    }

    @keyframes scanWipe {
      0% { left: 0%; transform: translateX(0); opacity: 1; }
      95% { opacity: 1; }
      100% { left: 100%; transform: translateX(-100%); opacity: 0; }
    }

    .svg-tag {
      position: absolute; top: 1em; left: 1.5em;
      background: #f1f5f9; border: 0.05em solid #cbd5e1;
      color: #64748b; font-size: 0.8em; font-weight: 700;
      padding: 0.5em 1em; border-radius: 0.5em; letter-spacing: 2px;
      opacity: 0;
      animation: tagFadeIn 0.5s ease 13.8s forwards;
      z-index: 10;
    }
    @keyframes tagFadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="sequence-container">
    <div class="scene-main">
      <div class="camera-pan">
        
        <div class="camera-zoom">
          <div class="chat-ui">
            <div class="chat-header">
              <div class="chat-header-dot" style="background: #ff5f56;"></div>
              <div class="chat-header-dot" style="background: #ffbd2e;"></div>
              <div class="chat-header-dot" style="background: #27c93f;"></div>
            </div>
            
            <div class="chat-body">
              
              <!-- Orthogonal Branching Lines -->
              <div class="branch-lines">
                <!-- HORIZONTAL LAYOUT -->
                <svg class="branch-svg horizontal-layout" viewBox="-28 3.75 70.5 8.25" style="position: absolute; top: 3.75em; left: -28em; width: 70.5em; height: 8.25em; overflow: visible;">
                  <path class="draw-path" d="M 42.5 3.75 L -26 3.75 Q -28 3.75, -28 5.75 L -28 12" fill="none" stroke="#94a3b8" stroke-width="0.4" stroke-linecap="round" />
                </svg>
                <svg class="branch-svg horizontal-layout" viewBox="62 3.75 35.5 8.25" style="position: absolute; top: 3.75em; left: 62em; width: 35.5em; height: 8.25em; overflow: visible;">
                  <path class="draw-path" d="M 62 3.75 L 95.5 3.75 Q 97.5 3.75, 97.5 5.75 L 97.5 12" fill="none" stroke="#94a3b8" stroke-width="0.4" stroke-linecap="round" />
                </svg>

                <!-- VERTICAL LAYOUT -->
                <svg class="branch-svg vertical-layout" viewBox="62 3.75 6 52.25" style="position: absolute; top: 3.75em; left: 62em; width: 6em; height: 52.25em; overflow: visible;">
                  <path class="draw-path" d="M 62 3.75 L 66 3.75 Q 68 3.75, 68 5.75 L 68 54 Q 68 56, 66 56 L 62 56" fill="none" stroke="#94a3b8" stroke-width="0.4" stroke-linecap="round" />
                </svg>
                <svg class="branch-svg vertical-layout" viewBox="62 3.75 6 94.25" style="position: absolute; top: 3.75em; left: 62em; width: 6em; height: 94.25em; overflow: visible;">
                  <path class="draw-path" d="M 62 3.75 L 66 3.75 Q 68 3.75, 68 5.75 L 68 96 Q 68 98, 66 98 L 62 98" fill="none" stroke="#94a3b8" stroke-width="0.4" stroke-linecap="round" />
                </svg>
              </div>

              <!-- Left Diagram -->
              <div class="diagram-container left" style="justify-content: center; padding: 0;">
                <div class="mermaid-tag" style="animation-delay: 7.5s">MERMAID</div>
                <div style="display: flex; flex-direction: row; align-items: center; gap: 1.5em; transform: scale(0.85); transform-origin: center;">
                  <div class="diagram-node" style="--delay: 7.5s">User Login</div>
                  <div class="conn-line horizontal static" style="width: 1.5em; transform-origin: left; --delay: 7.6s; --dur: 0.2s;"></div>
                  <div class="diagram-node" style="--delay: 7.7s">OAuth Provider</div>
                  <div class="conn-line horizontal static" style="width: 1.5em; transform-origin: left; --delay: 7.8s; --dur: 0.2s;"></div>
                  <div class="diagram-node" style="--delay: 7.9s">Fetch Profile</div>
                  <div class="conn-line horizontal static" style="width: 1.5em; transform-origin: left; --delay: 8.0s; --dur: 0.2s;"></div>
                  <div class="diagram-node" style="--delay: 8.1s">Dashboard</div>
                </div>
              </div>

              <!-- Right Diagram -->
              <div class="diagram-container right" style="justify-content: center; padding: 0;">
                <div class="mermaid-tag" style="animation-delay: 7.6s">MERMAID</div>
                <div style="display: flex; flex-direction: row; align-items: center; gap: 1.5em; transform: scale(0.85); transform-origin: center;">
                  <div class="diagram-node" style="--delay: 7.6s">Auth Request</div>
                  <div class="conn-line horizontal static" style="width: 1.5em; transform-origin: left; --delay: 7.7s; --dur: 0.2s;"></div>
                  <div class="diagram-node" style="--delay: 7.8s">2FA Prompt</div>
                  <div class="conn-line horizontal static" style="width: 1.5em; transform-origin: left; --delay: 7.9s; --dur: 0.2s;"></div>
                  
                  <!-- Right column split -->
                  <div style="display: flex; flex-direction: column; align-items: center; position: relative;">
                    <div class="diagram-node" style="--delay: 8.0s; border-radius: 1.5em">Approved?</div>
                    <div class="conn-line vertical" style="top: 3em; left: calc(50% - 0.05em); height: 1.5em; transform-origin: top; --delay: 8.1s; --dur: 0.2s;"></div>
                    <div class="conn-line horizontal" style="top: 4.5em; right: 50%; width: 4.5em; transform-origin: right; --delay: 8.2s; --dur: 0.2s;"></div>
                    <div class="conn-line horizontal" style="top: 4.5em; left: 50%; width: 4.5em; transform-origin: left; --delay: 8.2s; --dur: 0.2s;"></div>
                    <div class="conn-line vertical" style="top: 4.5em; left: calc(50% - 4.5em - 0.05em); height: 1.5em; transform-origin: top; --delay: 8.3s; --dur: 0.2s;"></div>
                    <div class="conn-line vertical" style="top: 4.5em; left: calc(50% + 4.5em - 0.05em); height: 1.5em; transform-origin: top; --delay: 8.3s; --dur: 0.2s;"></div>
                    
                    <div style="display: flex; gap: 1em; margin-top: 3em;">
                      <div class="diagram-node" style="width: 8em; --delay: 8.4s">Denied</div>
                      <div class="diagram-node" style="width: 8em; --delay: 8.4s">Granted</div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="chat-bubble-user">
                Draw a login process diagram
              </div>
              
              <div class="chat-bubble-ai">
                <div class="ai-avatar">
                  <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5v-1H1a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg>
                </div>
                
                <!-- Center Diagram -->
                <div class="diagram-container center" style="justify-content: center; padding: 0;">
                  <div class="mermaid-tag" style="animation-delay: 4.2s">MERMAID</div>
                  
                  <div class="diagram-graph" style="position: relative; display: flex; flex-direction: column; align-items: center;">
                    <div class="diagram-row node-1"><div class="diagram-node" style="--delay: 3.8s">Submit Credentials</div></div>
                    <div class="diagram-row node-2"><div class="diagram-node" style="--delay: 4.0s">Authenticate Token</div></div>
                    <div class="diagram-row node-3"><div class="diagram-node" style="--delay: 4.2s; border-radius: 1.5em">Is Valid?</div></div>
                    <div class="diagram-row node-4">
                      <div class="diagram-node" style="--delay: 4.6s">Show Error</div>
                      <div class="diagram-node" style="--delay: 4.6s">Load Dashboard</div>
                    </div>

                    <div class="conn-line vertical" style="top: 3em; left: calc(50% - 0.05em); height: 2em; transform-origin: top; --delay: 3.9s; --dur: 0.2s;"></div>
                    <div class="conn-line vertical" style="top: 8em; left: calc(50% - 0.05em); height: 2em; transform-origin: top; --delay: 4.1s; --dur: 0.2s;"></div>
                    <div class="conn-line vertical" style="top: 13em; left: calc(50% - 0.05em); height: 1.5em; transform-origin: top; --delay: 4.3s; --dur: 0.1s;"></div>
                    <div class="conn-line horizontal" style="top: 14.5em; right: 50%; width: 10em; transform-origin: right; --delay: 4.4s; --dur: 0.2s;"></div>
                    <div class="conn-line horizontal" style="top: 14.5em; left: 50%; width: 10em; transform-origin: left; --delay: 4.4s; --dur: 0.2s;"></div>
                    <div class="conn-line vertical" style="top: 14.5em; left: calc(50% - 10em - 0.05em); height: 2.5em; transform-origin: top; --delay: 4.5s; --dur: 0.2s;"></div>
                    <div class="conn-line vertical" style="top: 14.5em; left: calc(50% + 10em - 0.05em); height: 2.5em; transform-origin: top; --delay: 4.5s; --dur: 0.2s;"></div>
                    
                    <div class="branch-label" style="top: 13.5em; left: calc(50% - 6em); --delay: 4.5s;">No</div>
                    <div class="branch-label" style="top: 13.5em; left: calc(50% + 5em); --delay: 4.5s;">Yes</div>
                  </div>

                  <!-- NEW SVG FREEFORM DIAGRAM -->
                  <div class="diagram-svg-freeform">
