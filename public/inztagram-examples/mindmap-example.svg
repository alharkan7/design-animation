<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#a0b0c0" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <!-- Header -->
    <text x="40" y="60" font-size="28" font-weight="bold" fill="#0f172a">Inztagram Product Ecosystem</text>
    <text x="40" y="90" font-size="16" fill="#475569">A mindmap of core feature domains and their sub-components</text>

    <!-- Decorative Background Rings -->
    <g fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,10" opacity="0.5">
      <circle cx="600" cy="480" r="320" />
      <circle cx="600" cy="480" r="500" />
    </g>

    <!-- Connectors -->
    <g fill="none" stroke="#cbd5e1" stroke-width="2.5">
      <!-- Center to L1 -->
      <path d="M 490 480 C 450 480, 480 280, 440 280" />
      <path d="M 710 480 C 750 480, 720 280, 760 280" />
      <path d="M 710 480 C 750 480, 720 680, 760 680" />
      <path d="M 490 480 C 450 480, 480 680, 440 680" />

      <!-- TL to TL Children -->
      <path d="M 260 280 C 230 280, 240 180, 210 180" />
      <path d="M 260 280 L 210 280" />
      <path d="M 260 280 C 230 280, 240 380, 210 380" />

      <!-- TR to TR Children -->
      <path d="M 940 280 C 970 280, 960 180, 990 180" />
      <path d="M 940 280 L 990 280" />
      <path d="M 940 280 C 970 280, 960 380, 990 380" />

      <!-- BR to BR Children -->
      <path d="M 940 680 C 970 680, 960 580, 990 580" />
      <path d="M 940 680 L 990 680" />
      <path d="M 940 680 C 970 680, 960 780, 990 780" />

      <!-- BL to BL Children -->
      <path d="M 260 680 C 230 680, 240 580, 210 580" />
      <path d="M 260 680 L 210 680" />
      <path d="M 260 680 C 230 680, 240 780, 210 780" />
    </g>

    <!-- Node Shapes -->
    <g filter="url(#shadow)">
      <!-- Center Node -->
      <rect x="490" y="440" width="220" height="80" rx="40" fill="#f8f5ff" stroke="#e2e0f0" stroke-width="2" />

      <!-- TL: Content (Green) -->
      <rect x="260" y="250" width="180" height="60" rx="30" fill="#f4fcf7" stroke="#b2e3c6" stroke-width="2" />
      <rect x="50" y="158" width="160" height="44" rx="22" fill="#ffffff" stroke="#b2e3c6" stroke-width="1.5" />
      <rect x="50" y="258" width="160" height="44" rx="22" fill="#ffffff" stroke="#b2e3c6" stroke-width="1.5" />
      <rect x="50" y="358" width="160" height="44" rx="22" fill="#ffffff" stroke="#b2e3c6" stroke-width="1.5" />

      <!-- TR: Social (Blue) -->
      <rect x="760" y="250" width="180" height="60" rx="30" fill="#f5f9ff" stroke="#d4e4f7" stroke-width="2" />
      <rect x="990" y="158" width="160" height="44" rx="22" fill="#ffffff" stroke="#d4e4f7" stroke-width="1.5" />
      <rect x="990" y="258" width="160" height="44" rx="22" fill="#ffffff" stroke="#d4e4f7" stroke-width="1.5" />
      <rect x="990" y="358" width="160" height="44" rx="22" fill="#ffffff" stroke="#d4e4f7" stroke-width="1.5" />

      <!-- BR: Monetization (Warm) -->
      <rect x="760" y="650" width="180" height="60" rx="30" fill="#fefcf5" stroke="#f3e4c4" stroke-width="2" />
      <rect x="990" y="558" width="160" height="44" rx="22" fill="#ffffff" stroke="#f3e4c4" stroke-width="1.5" />
      <rect x="990" y="658" width="160" height="44" rx="22" fill="#ffffff" stroke="#f3e4c4" stroke-width="1.5" />
      <rect x="990" y="758" width="160" height="44" rx="22" fill="#ffffff" stroke="#f3e4c4" stroke-width="1.5" />

      <!-- BL: Discovery (Pink) -->
      <rect x="260" y="650" width="180" height="60" rx="30" fill="#fff9f9" stroke="#f6dce0" stroke-width="2" />
      <rect x="50" y="558" width="160" height="44" rx="22" fill="#ffffff" stroke="#f6dce0" stroke-width="1.5" />
      <rect x="50" y="658" width="160" height="44" rx="22" fill="#ffffff" stroke="#f6dce0" stroke-width="1.5" />
      <rect x="50" y="758" width="160" height="44" rx="22" fill="#ffffff" stroke="#f6dce0" stroke-width="1.5" />
    </g>

    <!-- Node Text -->
    <g text-anchor="middle">
      <!-- Center Node Text -->
      <text x="600" y="478" font-size="20" font-weight="bold" fill="#3b2f6b">Inztagram Core</text>
      <text x="600" y="498" font-size="12" fill="#6b5b9e">Primary Platform API</text>

      <!-- TL: Content (Green) -->
      <text x="350" y="285" font-size="16" font-weight="bold" fill="#0e5927">Content Creation</text>
      <g font-size="13" font-weight="bold" fill="#168039">
        <text x="130" y="184">Photo Filters</text>
        <text x="130" y="284">Video Reels</text>
        <text x="130" y="384">24Hr Stories</text>
      </g>

      <!-- TR: Social (Blue) -->
      <text x="850" y="285" font-size="16" font-weight="bold" fill="#00477a">Social Interactions</text>
      <g font-size="13" font-weight="bold" fill="#0060a6">
        <text x="1070" y="184">Direct Messages</text>
        <text x="1070" y="284">Threaded Comments</text>
        <text x="1070" y="384">Likes &amp; Reactions</text>
      </g>

      <!-- BR: Monetization (Warm) -->
      <text x="850" y="685" font-size="16" font-weight="bold" fill="#7a5900">Monetization</text>
      <g font-size="13" font-weight="bold" fill="#a37c00">
        <text x="1070" y="584">Sponsored Posts</text>
        <text x="1070" y="684">E-commerce Shops</text>
        <text x="1070" y="784">Creator Subs</text>
      </g>

      <!-- BL: Discovery (Pink) -->
      <text x="350" y="685" font-size="16" font-weight="bold" fill="#8f000b">Discovery</text>
      <g font-size="13" font-weight="bold" fill="#b3000e">
        <text x="130" y="584">Explore Feed</text>
        <text x="130" y="684">Hashtag Search</text>
        <text x="130" y="784">Recommendation AI</text>
      </g>
    </g>
  </g>
</svg>
